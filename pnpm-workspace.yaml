packages:
  - 'packages/*'

# Security overrides — pin vulnerable transitive deps to patched versions
# (Dependabot alerts on CI-Hub@dev). Direct deps are also bumped in their package.json.
overrides:
  '@babel/core': 7.29.6
  '@grpc/grpc-js': 1.14.7
  '@hono/node-server': 2.1.3
  '@opentelemetry/core': 2.8.0
  '@protobufjs/utf8': 1.1.1
  baseline-browser-mapping: 2.11.34
  browserslist: 4.29.5
  axios: 1.21.0
  body-parser: 2.4.0
  brace-expansion: 5.0.12
  dompurify: 3.4.17
  drizzle-orm: 0.45.2
  esbuild: 0.25.0
  fast-uri: 3.1.9
  file-type: 21.3.2
  follow-redirects: 1.16.2
  form-data: 4.0.6
  fflate: 0.8.3
  handlebars: 4.7.9
  hono: 4.13.14
  i18next-fs-backend: 2.6.6
  i18next-http-backend: 4.0.7
  ip-address: 10.7.5
  'js-yaml@^3': 3.15.2
  'js-yaml@^4': 4.3.2
  multer: 2.5.0
  'nanoid@^3': 3.3.18
  'postcss-selector-parser': 6.1.5
  piscina: 4.9.4
  postcss: 8.5.23
  protobufjs: 7.6.5
  proxy-addr: 2.0.8
  qs: 6.17.1
  react-router: 7.18.2
  systeminformation: 5.33.19
  'smol-toml': 1.9.1
  'source-map-js': 1.2.2
  turbo: 2.9.14
  uuid: 11.1.1
  valibot: 1.4.2
  vite: 7.3.7
  ws: 8.21.0
  zod: 4.6.7

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@swc/core': true
  argon2: true
  cpu-features: true
  esbuild: true
  msw: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@companionintelligence/tokens'
