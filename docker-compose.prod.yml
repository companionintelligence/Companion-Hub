services:
  ci-hub-db:
    container_name: ${DB_CONTAINER_NAME:-ci-hub-db}
    image: postgres:14
    pull_policy: if_not_present
    restart: unless-stopped
    stop_grace_period: 120s
    volumes:
      - ci_hub_pgdata:/var/lib/postgresql/data
    command: -p 6543
    ports:
      - 6543:6543
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USERNAME:-companion}
      POSTGRES_DB: ${POSTGRES_DBNAME:-companiondb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-companiondb} -U ${POSTGRES_USER:-companion} -p 6543"]
      interval: 5s
      timeout: 20s
      retries: 120
    networks:
      - ci_os_hub_network

  ci-os-hub-queue:
    container_name: ${QUEUE_CONTAINER_NAME:-ci-os-hub-queue}
    image: rabbitmq:4-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "5001:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-companion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
      # Disable khepri_db to speed up startup (uses classic Mnesia instead)
      RABBITMQ_FEATURE_FLAGS: ""
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 180s
    networks:
      - ci_os_hub_network

  ci-os-hub:
    # Platform selection based on DOCKER_PLATFORM env variable
    # Set DOCKER_PLATFORM=linux/arm64 for Mac development (native ARM64 build, faster)
    # Set DOCKER_PLATFORM=linux/amd64 for Linux production (AMD64 build, slower on Mac due to emulation)
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TIPI_VERSION: ${TIPI_VERSION:-4.5.0}
        LOCAL: ${LOCAL:-false}
        TARGETARCH: ${TARGETARCH:-amd64}
        DOCKER_PLATFORM: ${DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      ci-hub-db:
        condition: service_healthy
      ci-os-hub-queue:
        condition: service_healthy
    container_name: ${HUB_CONTAINER_NAME:-ci-os-hub}
    restart: unless-stopped
    ports:
      - "5002:5002"
    healthcheck:
      start_period: 90s
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      # Critical app data — named volume, survives container recreation
      - ci_hub_app_data:/app-data
      # Data directories — bind mounts from host (require ROOT_FOLDER_HOST)
      - ${RUNTIPI_MEDIA_PATH:-${ROOT_FOLDER_HOST:-.internal}}/media:/data/media
      # Allow Hub to configure Tunnel
      - ./tunnel:/app/tunnel
      - ${RUNTIPI_STATE_PATH:-${ROOT_FOLDER_HOST:-.internal}}/state:/data/state
      - ${RUNTIPI_REPOS_PATH:-${ROOT_FOLDER_HOST:-.internal}}/repos:/data/repos
      - ${RUNTIPI_APPS_PATH:-${ROOT_FOLDER_HOST:-.internal}}/apps:/data/apps
      - ${RUNTIPI_LOGS_PATH:-${ROOT_FOLDER_HOST:-.internal}}/logs:/data/logs
      - ${RUNTIPI_USER_CONFIG_PATH:-${ROOT_FOLDER_HOST:-.internal}}/user-config:/data/user-config
      - ${RUNTIPI_BACKUPS_PATH:-${ROOT_FOLDER_HOST:-.internal}}/backups:/data/backups
      # Static
      - ${ENV_FILE:-.env}:/data/.env
      - ./.internal/cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/root/.docker/config.json:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - ./docker-compose.prod.yml:/data/docker-compose.yml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      ci_os_hub_network:
        aliases:
          - host.docker.internal
    environment:
      API_PORT: 5002
      LOCAL: ${LOCAL:-false}
      NODE_ENV: ${NODE_ENV:-production}
      ROOT_FOLDER_HOST: ${ROOT_FOLDER_HOST:?ROOT_FOLDER_HOST must be set to an absolute host path}
      POSTGRES_HOST: ${POSTGRES_HOST:-ci-hub-db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-companion}
      POSTGRES_DBNAME: ${POSTGRES_DBNAME:-companiondb}
      POSTGRES_PORT: ${POSTGRES_PORT:-6543}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-companion}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-ci-os-hub-queue}
      INTERNAL_IP: ${INTERNAL_IP:-127.0.0.1}
      TIPI_VERSION: ${TIPI_VERSION:-4.5.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CI_CLOUD_API_URL: ${CI_CLOUD_API_URL}
      CI_CLOUD_FRONTEND_URL: ${CI_CLOUD_FRONTEND_URL}
    env_file:
      - ${ENV_FILE:-.env}
    labels:
      traefik.enable: true
      ci-os-hub.managed: true
      traefik.http.middlewares.runtipi.forwardauth.address: "http://ci-os-hub:5002/api/auth/traefik"
      traefik.http.middlewares.runtipi.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.runtipi.forwardauth.authResponseHeaders: "X-Runtipi-User"
      # Prevent Traefik from creating a default router on websecure (which triggers ACME)
      traefik.http.routers.ci-os-hub.entrypoints: "web"
      traefik.http.routers.ci-os-hub.rule: "Host(`ci-os-hub.local`)"

  traefik:
    image: traefik:v3.6.7
    pull_policy: if_not_present
    container_name: ${TRAEFIK_CONTAINER_NAME:-traefik}
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "8080:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount Traefik config files individually to avoid mount conflicts
      - ${RUNTIPI_STATE_PATH:-${ROOT_FOLDER_HOST:-.internal}}/state/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${RUNTIPI_STATE_PATH:-${ROOT_FOLDER_HOST:-.internal}}/state/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${RUNTIPI_STATE_PATH:-${ROOT_FOLDER_HOST:-.internal}}/state/traefik/acme_storage.json:/etc/traefik/acme.json:rw
      - ${RUNTIPI_STATE_PATH:-${ROOT_FOLDER_HOST:-.internal}}/state/traefik/tls:/etc/traefik/tls:ro
    networks:
      ci_os_hub_network:
    depends_on:
      - ci-os-hub
    labels:
      ci-os-hub.managed: true

  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    pull_policy: if_not_present
    container_name: ${CLOUDFLARED_CONTAINER_NAME:-cloudflared}
    restart: unless-stopped
    command: tunnel run --token-file /home/nonroot/.cloudflared/token
    volumes:
      - ./tunnel:/home/nonroot/.cloudflared:ro
    networks:
      - ci_os_hub_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ci-os-hub
      - traefik

  headscale:
    image: headscale/headscale:0.25.1
    pull_policy: if_not_present
    container_name: ${HEADSCALE_CONTAINER_NAME:-headscale}
    restart: unless-stopped
    command: serve
    volumes:
      - ${RUNTIPI_STATE_PATH:-${ROOT_FOLDER_HOST:-.internal}}/state/headscale:/etc/headscale
    networks:
      - ci_os_hub_network
    labels:
      ci-os-hub.managed: true

  hub-tailscale:
    image: tailscale/tailscale:v1.82.5
    pull_policy: if_not_present
    container_name: ${HUB_TAILSCALE_CONTAINER_NAME:-hub-tailscale}
    restart: unless-stopped
    hostname: hub-tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      TS_AUTHKEY: ${HEADSCALE_PREAUTH_KEY:-}
      TS_EXTRA_ARGS: --login-server=http://headscale:8080 --advertise-routes=172.18.0.0/16 --accept-routes
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - hub_tailscale_state:/var/lib/tailscale
    depends_on:
      - headscale
    networks:
      - ci_os_hub_network
    labels:
      ci-os-hub.managed: true

networks:
  ci_os_hub_network:
    driver: bridge
    name: ${NETWORK_NAME:-ci-os-hub_network}

volumes:
  ci_hub_pgdata:
    name: ${DB_VOLUME_NAME:-ci_hub_pgdata}
  ci_hub_app_data:
    name: ci_hub_app_data
  hub_tailscale_state:
    name: hub_tailscale_state
