[package]
name = "tauri-plugin-ci-auth"
version = "0.1.0"
# Tauri plugin build helpers require `links` to equal the package name.
links = "tauri-plugin-ci-auth"
edition = "2021"
# Tauri 2.12 needs Rust 1.90.
rust-version = "1.90"
description = "Tauri v2 plugin: RFC 8252 loopback sign-in and OS keychain storage for Companion Intelligence desktop apps"
readme = "README.md"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pins. Adding this crate must not move the Companion Hub's runtime, so bump tauri and
# tauri-build together with the Hub's lock.
tauri = "=2.12.4"

# keyring 4 with its default `v1` feature selects the native store per OS:
# Keychain on macOS, Credential Manager on Windows, Secret Service on Linux and BSD.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
keyring = "4.2.0"

[build-dependencies]
# build.rs calls tauri-plugin only. tauri-build is pinned here so that a consuming app's resolution
# keeps the Hub's version too.
tauri-build = "=2.7.3"
tauri-plugin = { version = "2.7.1", features = ["build"] }
