services:
  ci-hub-db:
    container_name: ci-hub-db
    image: postgres:14
    pull_policy: if_not_present
    restart: unless-stopped
    stop_grace_period: 120s
    volumes:
      - ci_hub_pgdata:/var/lib/postgresql/data
    command: -p 6543
    ports:
      - "${POSTGRES_PORT:-6543}:6543"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: companion
      POSTGRES_DB: companiondb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d companiondb -U companion -p 6543"]
      interval: 5s
      timeout: 20s
      retries: 120
    networks:
      - ci_os_hub_network

  ci-os-hub-queue:
    container_name: ci-os-hub-queue
    image: rabbitmq:4-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5001}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: companion
      RABBITMQ_DEFAULT_PASS: admin
      # Disable khepri_db to speed up startup (uses classic Mnesia instead)
      RABBITMQ_FEATURE_FLAGS: ""
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 180s
    networks:
      - ci_os_hub_network

  ci-os-hub:
    # Platform selection based on DOCKER_PLATFORM env variable
    # Set DOCKER_PLATFORM=linux/arm64 for Mac development (native ARM64 build, faster)
    # Set DOCKER_PLATFORM=linux/amd64 for Linux production (AMD64 build, slower on Mac due to emulation)
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    privileged: true
    image: ${CI_HUB_IMAGE:-ghcr.io/companionintelligence/ci-hub:dev}
    pull_policy: always
    depends_on:
      ci-hub-db:
        condition: service_healthy
      ci-os-hub-queue:
        condition: service_healthy
    container_name: ci-os-hub
    restart: unless-stopped
    ports:
      - "${API_PORT:-5002}:5002"
    healthcheck:
      start_period: 90s
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      # App data — bind mount from host (must match APP_DATA_DIR in backend)
      - ${ROOT_FOLDER_HOST:-.internal}/app-data:/app-data
      # Data directories — bind mounts from host (require ROOT_FOLDER_HOST)
      - ${ROOT_FOLDER_HOST:-.internal}/media:/data/media
      # Allow Hub to configure Tunnel
      - ./tunnel:/app/tunnel
      - ${ROOT_FOLDER_HOST:-.internal}/state:/data/state
      - ${ROOT_FOLDER_HOST:-.internal}/repos:/data/repos
      - ${ROOT_FOLDER_HOST:-.internal}/apps:/data/apps
      - ${ROOT_FOLDER_HOST:-.internal}/logs:/data/logs
      - ${ROOT_FOLDER_HOST:-.internal}/user-config:/data/user-config
      - ${ROOT_FOLDER_HOST:-.internal}/backups:/data/backups
      # Static
      - ${ENV_FILE:-.env}:/data/.env
      - ./.internal/cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Container-safe Docker config generated by scripts/init-docker-config.ts.
      # Strips host-only fields (currentContext=desktop-linux, credsStore=desktop,
      # osxkeychain, wincred, secretservice, plugins, hooks) that exist in a
      # developer's ~/.docker/config.json but break the Docker CLI inside the
      # Linux container. Registry auths are preserved.
      - ${DOCKER_CONFIG_PATH:-./.internal/docker-config.json}:/root/.docker/config.json:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - ./docker-compose.prod.yml:/data/docker-compose.yml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      ci_os_hub_network:
        aliases:
          - host.docker.internal
    environment:
      NODE_ENV: production
      LOCAL: "false"
      EXPERIMENTAL_INSECURE_COOKIE: "true"
      LOG_LEVEL: info
      API_PORT: 5002
      ROOT_FOLDER_HOST: ${ROOT_FOLDER_HOST:?ROOT_FOLDER_HOST must be set to an absolute host path}
      POSTGRES_HOST: ci-hub-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USERNAME: companion
      POSTGRES_DBNAME: companiondb
      POSTGRES_PORT: 6543
      RABBITMQ_USERNAME: companion
      RABBITMQ_PASSWORD: admin
      RABBITMQ_HOST: ci-os-hub-queue
      RABBITMQ_PORT: 5672
      INTERNAL_IP: ${INTERNAL_IP:-0.0.0.0}
      CI_HUB_VERSION: ${CI_HUB_VERSION:-4.7.0}
      CI_CLOUD_URL: ${CI_CLOUD_URL:-https://portal.companionintelligence.com}
      DOMAIN: ${DOMAIN:-companionintelligence.com}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      traefik.enable: true
      ci-os-hub.managed: true
      traefik.http.middlewares.ci-hub.forwardauth.address: "http://ci-os-hub:5002/api/auth/traefik"
      traefik.http.middlewares.ci-hub.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.ci-hub.forwardauth.authResponseHeaders: "X-CI-Hub-User"
      # Prevent Traefik from creating a default router on websecure (which triggers ACME)
      traefik.http.routers.ci-os-hub.entrypoints: "web"
      traefik.http.routers.ci-os-hub.rule: "Host(`ci-os-hub.local`)"

  traefik:
    image: traefik:v3.6.7
    pull_policy: if_not_present
    container_name: traefik
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount Traefik config files individually to avoid mount conflicts
      - ${ROOT_FOLDER_HOST:-.internal}/state/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${ROOT_FOLDER_HOST:-.internal}/state/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${ROOT_FOLDER_HOST:-.internal}/state/traefik/acme_storage.json:/etc/traefik/acme.json:rw
      - ${ROOT_FOLDER_HOST:-.internal}/state/traefik/tls:/etc/traefik/tls:ro
    networks:
      ci_os_hub_network:
    depends_on:
      - ci-os-hub
    labels:
      ci-os-hub.managed: true

  # Cloudflare tunnel — opt-in. Requires a token file at ./tunnel/token.
  # Enable with: docker compose --profile cloudflare up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    pull_policy: if_not_present
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run --token-file /home/nonroot/.cloudflared/token
    volumes:
      - ./tunnel:/home/nonroot/.cloudflared:ro
    networks:
      - ci_os_hub_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ci-os-hub
      - traefik
    profiles:
      - cloudflare

  # Headscale control server — opt-in via the `private-vpn` compose profile
  # (scripts/start.ts and the desktop Hub merge that profile automatically
  # whenever PRIVATE_VPN_ENABLED is not "false"). Requires a config file at
  # ${ROOT_FOLDER_HOST}/state/headscale/config.yaml, which the backend's
  # HeadscaleService generates on boot.
  headscale:
    image: headscale/headscale:0.25.1
    pull_policy: if_not_present
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ${ROOT_FOLDER_HOST:-.internal}/state/headscale:/etc/headscale
    networks:
      - ci_os_hub_network
    labels:
      ci-os-hub.managed: true
    profiles:
      - private-vpn

  # Headplane — web UI for Headscale. Runs alongside the Headscale container
  # and shares its /etc/headscale volume so it can read the generated
  # config.yaml + SQLite DB. Exposed via Traefik at headscale-admin.${DOMAIN}
  # (dynamic Traefik route is written by the backend once a public host is
  # known). Uses the docker socket to drive Headscale's config-reload endpoint
  # by restarting the headscale container after GUI edits.
  # See https://github.com/tale/headplane for details.
  headplane:
    image: ghcr.io/tale/headplane:0.7.0
    pull_policy: if_not_present
    container_name: headplane
    restart: unless-stopped
    depends_on:
      - headscale
    environment:
      HEADSCALE_URL: http://headscale:8080
      # Path inside the headplane container; matches the shared volume mount
      # point. Headplane reads this YAML for UI-driven config edits.
      HEADSCALE_CONFIG_PATH: /etc/headscale/config.yaml
      HEADSCALE_INTEGRATION: docker
      HEADSCALE_CONTAINER: headscale
      COOKIE_SECRET: ${HEADPLANE_COOKIE_SECRET:-change-me-32-bytes-minimum-please-rotate}
      # Optional OIDC gate for the admin UI. Leave unset for open-access local
      # dev; set all three (and the Headscale config.yaml `oidc.*` keys) in
      # shared envs so only the workspace admin can reach the dashboard.
      OIDC_ISSUER: ${HEADPLANE_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${HEADPLANE_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${HEADPLANE_OIDC_CLIENT_SECRET:-}
    volumes:
      - ${ROOT_FOLDER_HOST:-.internal}/state/headscale:/etc/headscale
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ci_os_hub_network
    labels:
      ci-os-hub.managed: true
      traefik.enable: true
      traefik.http.routers.headplane.rule: "Host(`headscale-admin.${DOMAIN:-ci.localhost}`)"
      traefik.http.routers.headplane.entrypoints: websecure
      traefik.http.routers.headplane.tls.certresolver: myresolver
      traefik.http.services.headplane.loadbalancer.server.port: "3000"
    profiles:
      - private-vpn

  # Tailscale client — opt-in, depends on headscale above.
  hub-tailscale:
    image: tailscale/tailscale:v1.82.5
    pull_policy: if_not_present
    container_name: hub-tailscale
    restart: unless-stopped
    hostname: hub-tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      TS_AUTHKEY: ${HEADSCALE_PREAUTH_KEY:-}
      TS_EXTRA_ARGS: --login-server=http://headscale:8080 --advertise-routes=172.18.0.0/16 --accept-routes
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - hub_tailscale_state:/var/lib/tailscale
    depends_on:
      - headscale
    networks:
      - ci_os_hub_network
    labels:
      ci-os-hub.managed: true
    profiles:
      - private-vpn

networks:
  ci_os_hub_network:
    driver: bridge
    name: ci-os-hub_network

volumes:
  ci_hub_pgdata:
    name: ci_hub_pgdata
  hub_tailscale_state:
    name: hub_tailscale_state
