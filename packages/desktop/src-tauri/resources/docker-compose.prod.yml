# Cap every container's stdout/stderr logs so they cannot fill the device disk.
# json-file is Docker's default driver and grows unbounded without these limits.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ci-hub-db:
    container_name: ci-hub-db
    logging: *default-logging
    image: postgres:14
    pull_policy: if_not_present
    restart: unless-stopped
    stop_grace_period: 120s
    volumes:
      - ci_hub_pgdata:/var/lib/postgresql/data
    command: -p 6543
    ports:
      # Loopback only: the Hub reaches Postgres over ci_hub_internal; the host
      # port exists for local tooling and must not be offered to the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-6543}:6543"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: companion
      POSTGRES_DB: companiondb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d companiondb -U companion -p 6543"]
      interval: 5s
      timeout: 20s
      retries: 120
    networks:
      - ci_hub_internal

  ci-hub-queue:
    container_name: ci-hub-queue
    logging: *default-logging
    image: rabbitmq:4-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      # Loopback only, as for Postgres above. Nothing outside the Hub container
      # publishes to or consumes from this broker in a deployed Hub.
      - "127.0.0.1:${RABBITMQ_PORT:-5001}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: companion
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
      # Disable khepri_db to speed up startup (uses classic Mnesia instead)
      RABBITMQ_FEATURE_FLAGS: ""
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 180s
    networks:
      # Internal only. Every installed app's main container joins ci_hub_network,
      # so a broker on it was one leaked password away from every app being able
      # to install, reset or uninstall anything on the Hub. Only the Hub itself
      # needs the broker; the legacy alias stays for pre-rename RABBITMQ_HOST values.
      ci_hub_internal:
        aliases:
          - ci-os-hub-queue

  ci-hub:
    # Platform selection based on DOCKER_PLATFORM env variable
    # Set DOCKER_PLATFORM=linux/arm64 for Mac development (native ARM64 build, faster)
    # Set DOCKER_PLATFORM=linux/amd64 for Linux production (AMD64 build, slower on Mac due to emulation)
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    # PID 1 is `node`, which has no SIGTERM handler, and the kernel gives PID 1 no default signal
    # action: `docker restart ci-hub` waited out the 10 s grace and SIGKILLed (exit 137), cutting
    # streams with no error frame. Docker's init forwards the signal so node exits at once (143).
    init: true
    # SECURITY: the Hub container does NOT run privileged. It manages app
    # containers by talking to the host Docker daemon over the mounted
    # /var/run/docker.sock (see docker.service.ts — it spawns `docker compose`
    # and uses dockerode against that socket). The daemon performs all
    # privileged work host-side; the Hub process only needs *access* to the
    # socket, which is granted by the entrypoint dropping to CI_HUB_CONTAINER_UID
    # with DOCKER_GID applied via `setpriv --groups` (see docker-entrypoint.sh)
    # + the read-only socket mount below. NOTE: the `group_add: DOCKER_GID` below
    # only affects the brief pre-drop root phase — setpriv REPLACES the
    # supplementary groups, so the dropped process's socket access comes solely
    # from `--groups=$DOCKER_GID` (fed by the DOCKER_GID env var).
    # The backend performs no iptables /
    # modprobe / mknod / device or kernel-module operations of its own, so it
    # needs no host devices, no extra capabilities, and no seccomp/AppArmor
    # opt-out. `privileged: true` would grant ALL of those and directly
    # contradict the least-privilege setup on the lines that follow, so it is
    # intentionally omitted. If a future feature needs a specific capability,
    # add a scoped `cap_add:` (as the tailscale sidecar does with NET_ADMIN /
    # SYS_MODULE) rather than reintroducing blanket privilege.
    image: ${CI_HUB_IMAGE:-ghcr.io/companionintelligence/ci-hub:latest}
    pull_policy: if_not_present
    depends_on:
      ci-hub-db:
        condition: service_healthy
      ci-hub-queue:
        condition: service_healthy
    container_name: ci-hub
    logging: *default-logging
    restart: unless-stopped
    # The container starts as root and drops to CI_HUB_CONTAINER_UID:GID in its
    # entrypoint (docker-entrypoint.sh) after chowning bind-mount dirs the Hub must
    # write (notably /app/tunnel — Docker creates missing bind sources root-owned,
    # which otherwise wedges the tunnel token as `tunnel_token_missing`). This
    # replaces a compose `user:` directive, which cannot chown the dir first.
    # The desktop app writes CI_HUB_CONTAINER_UID/GID/DOCKER_GID to the env file
    # from resolve_hub_container_identity(): 0:0 on Windows (Docker Desktop / NTFS
    # bind mounts require root — the entrypoint then skips the drop), or the host
    # UID:GID on Linux/macOS.
    # Host docker.sock is root:docker (660); add the host docker group GID (see init-hub-data-dirs.ts).
    group_add:
      - "${DOCKER_GID:-973}"
    ports:
      - "${API_PORT:-5002}:5002"
    healthcheck:
      start_period: 90s
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      # Data directories — bind mounts from host (require ROOT_FOLDER_HOST)
      - ${ROOT_FOLDER_HOST:-.internal}/media:/data/media
      # Allow Hub to configure Tunnel — resolves to the sibling tunnel/ directory
      # relative to ROOT_FOLDER_HOST (e.g. /home/user/ci-hub/.internal → /home/user/ci-hub/tunnel).
      # Must match scripts/heal-hub-bind-mounts.ts resolveTunnelDir() (= <ROOT_FOLDER_HOST>/../tunnel),
      # which pre-creates/repairs this dir owned by the container UID. A plain
      # ${ROOT_FOLDER_HOST}/tunnel bind would land inside .internal, where the heal step never
      # runs, so Docker auto-creates it root-owned and the Hub can't write the tunnel token.
      - ${ROOT_FOLDER_HOST:-.internal}/../tunnel:/app/tunnel
      - ${ROOT_FOLDER_HOST:-.internal}/app-data:/app-data
      - ${ROOT_FOLDER_HOST:-.internal}/state:/data/state
      - ${ROOT_FOLDER_HOST:-.internal}/repos:/data/repos
      - ${ROOT_FOLDER_HOST:-.internal}/apps:/data/apps
      - ${ROOT_FOLDER_HOST:-.internal}/logs:/data/logs
      - ${ROOT_FOLDER_HOST:-.internal}/user-config:/data/user-config
      - ${ROOT_FOLDER_HOST:-.internal}/backups:/data/backups
      # Static. Long syntax with create_host_path:false so a mis-resolved host path
      # fails loudly ("bind source path does not exist") instead of Docker silently
      # creating an empty dir here — which would mount a directory over /data/.env
      # and crash the backend with EISDIR. (Seen when ROOT_FOLDER_HOST used the
      # Docker-Desktop `/c/...` form against a native WSL2 engine that needs `/mnt/c/...`.)
      - type: bind
        source: ${ENV_FILE:-.env}
        target: /data/.env
        bind:
          create_host_path: false
      # Backend uses DATA_DIR/cache (/data/cache). Created by scripts/init-hub-data-dirs.ts.
      - ${ROOT_FOLDER_HOST:-.internal}/cache:/data/cache
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      # Container-safe Docker config — scripts/init-docker-config.ts writes
      # ${ROOT_FOLDER_HOST}/.docker/config.json (whole dir mounted for non-root Hub).
      - ${ROOT_FOLDER_HOST:-.internal}/.docker:/data/.docker
      - /proc/meminfo:/host/proc/meminfo:ro
      - ${COMPOSE_FILE_HOST:-./docker-compose.prod.yml}:/data/docker-compose.yml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Hub Pool needs this node's Tailscale identity: `nodeFqdn` is how a peer
      # addresses us, and TailscaleService.resolveStrategy() can only get it by
      # running the host's CLI against the host's tailscaled socket. Neither was
      # mounted, so on every Tailscale host the Hub reported `notInstalled`,
      # `/inference/pool/identify` returned `nodeFqdn: null`, and pairing could
      # never complete. The `hub-tailscale` sidecar below is not a substitute --
      # it sits behind the `private-vpn` profile and needs TAILSCALE_AUTHKEY.
      #
      # The socket is mounted READ-WRITE deliberately: isSocketAvailable() probes
      # it with R_OK|W_OK, and the tailscaled protocol writes. A `:ro` mount here
      # looks right and silently defeats the whole thing.
      #
      # Both are optional by design. On a host with no Tailscale, Docker creates
      # empty paths, the socket probe fails, and the Hub degrades to exactly the
      # no-VPN behaviour it has today -- so this is safe on every host. Override
      # the source paths where the distro puts them elsewhere.
      - ${TAILSCALE_SOCKET_DIR:-/var/run/tailscale}:/var/run/tailscale
      - ${TAILSCALE_BINARY:-/usr/bin/tailscale}:/usr/bin/tailscale:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Resolver patience (#933): the Hub resolves sibling containers (ci-hub-db, ci-hub-queue,
    # per-app services) through Docker's embedded DNS, which drops queries under network churn —
    # every app install/uninstall recreates networks. Default musl/glibc behavior gives up after
    # 2 attempts and surfaces getaddrinfo EAI_AGAIN. Retry harder before failing.
    dns_opt:
      - attempts:5
      - timeout:2
    networks:
      # The gateway network, as for traefik below: ci_hub_internal sorts first
      # by name and would otherwise take the default route. The Hub's own
      # connections (the Portal, image registries) would then leave from that
      # bridge, whose range Docker picked when it was created and which a VPN
      # or an accepted Tailscale route may also claim. Postgres and RabbitMQ
      # are still reached over ci_hub_internal.
      ci_hub_network:
        gw_priority: 1
        aliases:
          - ci-os-hub
          - host.docker.internal
      ci_os_hub_network:
        aliases:
          - ci-os-hub
          - host.docker.internal
      ci_hub_internal:
    environment:
      # Runtime marker: if absent, a new image detects the pre-rename compose
      # from its legacy queue host and keeps writing ci-os-hub DNS/network names.
      HUB_CONTAINER_NAME: ci-hub
      # The two edge hops' fixed addresses, for Traefik's trusted-forwarders
      # list (written into traefik.yml at config-copy time) and the Hub's own
      # (ProxyTrustService). By address, never the edge subnet: its gateway is
      # where every connection that reaches Traefik through the host comes
      # from. Must match the cloudflared and hub-tailscale addresses below.
      HUB_EDGE_CLOUDFLARED_IP: ${HUB_EDGE_CLOUDFLARED_IP:-10.128.0.3}
      HUB_EDGE_TAILSCALE_IP: ${HUB_EDGE_TAILSCALE_IP:-10.128.0.4}
      # Traefik's own edge address, for the Hub to attach a Traefik created
      # before the edge network existed when it starts cloudflared (which is on
      # the edge network only). Must match the traefik address below.
      HUB_EDGE_TRAEFIK_IP: ${HUB_EDGE_TRAEFIK_IP:-10.128.0.2}
      # `tailscale serve` upstream for the sidecar: Traefik's fixed edge
      # address rather than the name `traefik`, which the sidecar (on three
      # networks) could resolve to an address Traefik does not trust. Must
      # match HUB_EDGE_TRAEFIK_IP. Only a fallback: the Private VPN sync names
      # each app's container and the Hub itself as the upstream, so no
      # current publish goes through Traefik.
      TAILSCALE_SERVE_UPSTREAM: ${TAILSCALE_SERVE_UPSTREAM:-10.128.0.2:80}
      OLLAMA_URL: http://host.docker.internal:11434
      VLLM_URL: ${VLLM_URL:-http://host.docker.internal:8000}
      # Empty unless the operator sets it: the Hub then probes oMLX's default
      # (host.docker.internal:8000) only on Apple Silicon. A default here would
      # skip that gate and probe vLLM's :8000 as oMLX on every Linux node.
      OMLX_URL: ${OMLX_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OMLX_API_KEY: ${OMLX_API_KEY:-}
      LEMONADE_URL: ${LEMONADE_URL:-http://host.docker.internal:13305}
      API_PORT: 5002
      CI_HUB_ENVIRONMENT: ${CI_HUB_ENVIRONMENT:-production}
      LOCAL: ${LOCAL:-false}
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: ${NODE_OPTIONS:---disable-warning=ExperimentalWarning}
      HOME: /data/user-config
      ROOT_FOLDER_HOST: ${ROOT_FOLDER_HOST:?ROOT_FOLDER_HOST must be set to an absolute host path}
      DOCKER_CONFIG: /data/.docker
      # Passed through EMPTY, not defaulted to 1000, so the entrypoint's own derivation is
      # authoritative. `docker-entrypoint.sh` picks the owner of /data when this is unset —
      # 1000 for a user-owned install, 0 for a root-owned one, where it then skips the
      # privilege drop. Defaulting here made the variable ALWAYS set, so that derivation was
      # dead code on the only path that matters, and a root-owned install crash-looped on
      # EACCES reading its own 0600 /data/.env.
      # Compose renders `${VAR:-}` as the empty string rather than omitting the key, and the
      # image's BusyBox `sh` treats an empty value as unset for `${VAR:-default}` — both
      # verified against the shipped image, because the whole fix rests on them.
      CI_HUB_CONTAINER_UID: ${CI_HUB_CONTAINER_UID:-}
      CI_HUB_CONTAINER_GID: ${CI_HUB_CONTAINER_GID:-}
      # Consumed by docker-entrypoint.sh to keep Docker-socket access after it
      # drops privileges (matches the group_add below).
      DOCKER_GID: ${DOCKER_GID:-973}
      POSTGRES_HOST: ci-hub-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USERNAME: companion
      POSTGRES_DBNAME: companiondb
      POSTGRES_PORT: 6543
      RABBITMQ_USERNAME: companion
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_HOST: ci-hub-queue
      RABBITMQ_PORT: 5672
      INTERNAL_IP: ${INTERNAL_IP:-127.0.0.1}
      CI_HUB_VERSION: ${CI_HUB_VERSION:-0.2.27}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # CI_CLOUD_URL comes from env_file + /data/.env mount only — do not set it here;
      # compose `environment:` interpolates from the host shell and overrides env_file.
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    labels:
      traefik.enable: true
      ci-hub.managed: true
      ci-os-hub.managed: true
      # The image exposes both the dev (3000) and prod (5002) API ports. Pin
      # Traefik to the canonical network and prod port instead of letting its
      # Docker provider choose an arbitrary network/first exposed port.
      traefik.docker.network: "ci-hub_network"
      traefik.http.middlewares.ci-hub.forwardauth.address: "http://ci-hub:5002/api/auth/traefik"
      # false: decide from the request the router matched, never from forwarded
      # headers that arrived with it (see assets/traefik/dynamic/dynamic.yml).
      traefik.http.middlewares.ci-hub.forwardauth.trustForwardHeader: "false"
      # Bound what Traefik will read back from the auth reply. The Hub answers forward auth with a
      # redirect or a short JSON error, so this is a ceiling on a misbehaving auth server, not a limit
      # anything legitimate approaches. Needs Traefik 3.6.9 or later.
      traefik.http.middlewares.ci-hub.forwardauth.maxResponseBodySize: "16384"
      # Every signed identity header must ride through — Traefik copies ONLY the headers
      # listed here onto the forwarded request, and consumers verifying the signature fail
      # closed on a missing timestamp/signature (CI-Engineering#74). Listing a name also strips
      # a visitor's own copy, which keeps the stable-id trio from ever arriving unsigned.
      traefik.http.middlewares.ci-hub.forwardauth.authResponseHeaders: "X-CI-Hub-User,X-CI-Hub-User-Timestamp,X-CI-Hub-User-Signature,X-CI-Hub-User-Issuer,X-CI-Hub-User-Id,X-CI-Hub-User-Id-Signature"
      # Prevent Traefik from creating a default router on websecure (which triggers ACME)
      traefik.http.routers.ci-hub.entrypoints: "web"
      traefik.http.routers.ci-hub.rule: "Host(`ci-hub.local`)"
      traefik.http.routers.ci-hub.service: "ci-hub"
      traefik.http.routers.ci-os-hub.entrypoints: "web"
      traefik.http.routers.ci-os-hub.rule: "Host(`ci-os-hub.local`)"
      traefik.http.routers.ci-os-hub.service: "ci-hub"
      traefik.http.services.ci-hub.loadbalancer.server.port: "5002"

  traefik:
    image: traefik:v3.6.12
    pull_policy: if_not_present
    container_name: traefik
    logging: *default-logging
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"  # Dashboard
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      # Mount Traefik config files individually to avoid mount conflicts.
      # create_host_path:false: fail loudly if the host path is mis-resolved rather
      # than letting Docker fabricate an empty dir over traefik.yml (crash-loops
      # Traefik with "traefik.yml: is a directory").
      - type: bind
        source: ${ROOT_FOLDER_HOST:-.internal}/state/traefik/config/traefik.yml
        target: /etc/traefik/traefik.yml
        read_only: true
        bind:
          create_host_path: false
      - ${ROOT_FOLDER_HOST:-.internal}/state/traefik/dynamic:/etc/traefik/dynamic:ro
      # acme.json is a FILE mount like traefik.yml above — same create_host_path:false
      # guard, or a mis-resolved path silently becomes a persistent host directory
      # that breaks ACME issuance until manually deleted.
      - type: bind
        source: ${ROOT_FOLDER_HOST:-.internal}/state/traefik/acme_storage.json
        target: /etc/traefik/acme.json
        bind:
          create_host_path: false
      - ${ROOT_FOLDER_HOST:-.internal}/state/traefik/tls:/etc/traefik/tls:ro
    networks:
      # The gateway network, as it was before the edge network existed: the
      # edge sorts first by name and would otherwise take the default route, so
      # Traefik's own connections to the host (a port-expose app's
      # host.docker.internal upstream) would leave from 10.128.0.2 — outside
      # the 172.16.0.0/12 that fleet ufw rules admit from Docker bridges.
      # `gw_priority` needs Compose 2.33+ and Engine 28+; Docker 29 ships both.
      # An older Compose refuses this file, so the desktop app and `cihub up`
      # stop and say so. An older Engine ignores the setting and routes by name
      # as above (measured: Engine 27.5.1 with Compose 5.1.4), so they warn.
      ci_hub_network:
        gw_priority: 1
      ci_os_hub_network:
      # Fixed address on the edge network, where cloudflared and the Tailscale
      # sidecar reach it by this address alone. See `ci_hub_edge` below.
      ci_hub_edge:
        ipv4_address: ${HUB_EDGE_TRAEFIK_IP:-10.128.0.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ci-hub
    labels:
      ci-hub.managed: true
      ci-os-hub.managed: true

  # Cloudflare tunnel — opt-in. Requires a token file at ./tunnel/token.
  # Enable with: docker compose --profile cloudflare up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    pull_policy: if_not_present
    container_name: cloudflared
    logging: *default-logging
    restart: unless-stopped
    command: tunnel run --token-file /home/nonroot/.cloudflared/token
    volumes:
      # Sibling tunnel/ dir (see ci-hub /app/tunnel mount above) — where the Hub writes the token.
      - ${ROOT_FOLDER_HOST:-.internal}/../tunnel:/home/nonroot/.cloudflared:ro
    # The edge network ONLY, at a fixed address. Every app's tunnel ingress
    # targets `traefik:80`, and Docker DNS resolves that to the one address the
    # two share, so every tunnelled app request reaches Traefik from this
    # address — the one Traefik trusts forwarded headers from. A second shared
    # network would let DNS answer with an address Traefik does not trust.
    networks:
      ci_hub_edge:
        ipv4_address: ${HUB_EDGE_CLOUDFLARED_IP:-10.128.0.3}
    # Load-bearing: Portal routes the Hub's OWN hostname to
    # http://host.docker.internal:{hub port} (rebuilt from its database, not
    # from the Hub's sync), which reaches the Hub's published port through the
    # host. That works from a bridge the Hub is not on (checked on the fleet's
    # Docker 29.8); the Hub sees it from a bridge gateway and ignores its
    # forwarded headers, as before this network existed.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ci-hub
      - traefik
    profiles:
      - cloudflare

  # --- Private VPN (Tailscale sidecar) -----------------------------------------
  # Profile `private-vpn`. The `hub-tailscale` container joins your tailnet via
  # tailscale.com using TS_AUTHKEY (set TAILSCALE_AUTHKEY in `.env`; HEADSCALE_PREAUTH_KEY is still read as a fallback for old configs).
  # Advertises the Docker bridge by default so tailnet devices can reach the Hub network.
  hub-tailscale:
    image: tailscale/tailscale:v1.98.3
    pull_policy: if_not_present
    container_name: hub-tailscale
    logging: *default-logging
    restart: unless-stopped
    hostname: hub-tailscale
    entrypoint:
      - /bin/sh
      - -lc
      - |
        if [ -n "${TAILSCALE_AUTHKEY:-}" ]; then
          export TS_AUTHKEY="$TAILSCALE_AUTHKEY"
          exec /usr/local/bin/containerboot
        fi
        # No auth key: run tailscaled alone. containerboot would run `tailscale up`
        # itself, kill it after 60 s (nobody can finish an interactive login in
        # here) and exit; `restart: unless-stopped` then respawns it every minute,
        # and every respawn re-creates the container's veth on the host, which
        # the host's browsers see as a network change (Chrome: ERR_NETWORK_CHANGED).
        # Hub runs `tailscale up` over `docker exec` and shows the auth URL, so
        # the sidecar only has to keep the daemon alive. A persisted login is
        # resumed by tailscaled by itself; the tun node is what containerboot
        # would have created. `$$` keeps compose from interpolating the shell vars.
        if [ ! -c /dev/net/tun ]; then
          mkdir -p /dev/net && mknod /dev/net/tun c 10 200
        fi
        exec tailscaled --socket="$$TS_SOCKET" --statedir="$$TS_STATE_DIR"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-${HEADSCALE_PREAUTH_KEY:-}}
      # During the ci-os-hub → ci-hub transition, an upgraded appliance has
      # the legacy bridge on 172.18/16 and the canonical bridge on 172.19/16.
      # Fresh installs create the same two bridges in the opposite order.
      TS_EXTRA_ARGS: ${HUB_TAILSCALE_EXTRA_ARGS:---login-server=https://controlplane.tailscale.com --accept-routes --advertise-routes=172.18.0.0/16,172.19.0.0/16}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - hub_tailscale_state:/var/lib/tailscale
    networks:
      # The gateway network, as for traefik: not the edge, which sorts first.
      ci_hub_network:
        gw_priority: 1
      ci_os_hub_network:
      # Fixed address on the edge network: `tailscale serve` is pointed at
      # Traefik's edge address (TAILSCALE_SERVE_UPSTREAM on the ci-hub service),
      # so tailnet visitors reach Traefik from an address it trusts.
      ci_hub_edge:
        ipv4_address: ${HUB_EDGE_TAILSCALE_IP:-10.128.0.4}
    healthcheck:
      # Passes as soon as tailscaled is accepting commands (any BackendState).
      # grep for "BackendState" in the JSON output — present whenever the daemon
      # is up, even if not yet authenticated (NeedsLogin / NoState).
      test: ["CMD-SHELL", "tailscale status --json 2>&1 | grep -q 'BackendState'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      ci-hub.managed: true
      ci-os-hub.managed: true
    profiles:
      - private-vpn

networks:
  ci_hub_network:
    driver: bridge
    name: ci-hub_network
  # Hub-private plumbing: Postgres and RabbitMQ live here and only the Hub
  # joins it. Apps never see this network — it is not offered to app containers
  # by the compose builder — so the Hub's own infrastructure is unreachable from
  # a marketplace container by design rather than by password.
  ci_hub_internal:
    driver: bridge
    name: ci-hub_internal
  # The edge: Traefik plus the two proxies that carry public traffic to it,
  # cloudflared and the Tailscale sidecar, on a bridge with a FIXED subnet and
  # fixed addresses. That is what lets Traefik trust the client address those
  # two forward (traefik.yml `forwardedHeaders.trustedIPs`) while stripping it
  # from everything else, and what lets the Hub and each app trust Traefik's
  # hop in turn (ProxyTrustService). Trust is by those two addresses, never
  # the subnet: its .1 is the bridge gateway, the host's own address on it, so
  # anything the host sends or routes onto the bridge arrives from there.
  #
  # Nothing may join it at an address Docker picks. `ip_range` is the pool
  # Docker allocates from, and this one holds only the network address and the
  # gateway, so every member needs a fixed address outside it and anything
  # else — a container started with `--network ci-hub_edge`, or an app whose
  # `network_mode` names this network (which the Hub also refuses) — fails to
  # start with "no available IPv4 addresses" instead of taking a hop's address.
  # Measured on Docker 29.8: fixed members start; a dynamic one is refused.
  #
  # The subnet is inside the 10.128.0.0–10.128.9.0 range reserved for Hub
  # infrastructure, so the app allocator never hands it out; override
  # HUB_EDGE_SUBNET, HUB_EDGE_IP_RANGE and the three HUB_EDGE_*_IP values
  # together if it collides with something on your LAN. Compose recreates the
  # network when these change, but reconnects running members WITHOUT their
  # fixed addresses (Compose 5.5.1), so they then fail to start: follow such a
  # change with `up -d --force-recreate traefik cloudflared hub-tailscale`.
  ci_hub_edge:
    driver: bridge
    name: ci-hub_edge
    ipam:
      config:
        - subnet: ${HUB_EDGE_SUBNET:-10.128.0.0/29}
          ip_range: ${HUB_EDGE_IP_RANGE:-10.128.0.0/31}
  # Keep the retired network so already-installed apps stay attached and can
  # still resolve the Hub via the ci-os-hub alias on this network.
  ci_os_hub_network:
    driver: bridge
    name: ci-os-hub_network

volumes:
  ci_hub_pgdata:
    name: ci_hub_pgdata
  hub_tailscale_state:
    name: hub_tailscale_state
