[package]
name = "ci-os-hub-desktop"
version = "0.1.0"
description = "Companion Hub Desktop — native wrapper for the Companion Intelligence Hub"
authors = ["Companion Intelligence"]
edition = "2021"

[lib]
name = "ci_os_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.11"
log = "0.4"
env_logger = "0.11"
dirs = "5"
rand = "0.8"
sha2 = "0.10"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tempfile = "3"
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
