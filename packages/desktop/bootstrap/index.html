<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion Hub</title>
    <link rel="stylesheet" href="./bootstrap.css" />
  </head>
  <body>
    <!-- Titlebar is built by bootstrap.js: the shape differs per platform, and
         the window controls need Tauri IPC. -->
    <main>
      <div class="shell">
        <img class="logo" src="./assets/hub-logo.png" alt="" aria-hidden="true" />
        <div class="card">
          <svg class="spinner" id="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
          <h1>Companion Hub</h1>
          <p id="status" role="status">Starting your Hub…</p>
          <div class="panel" id="diagnostics-card">
            <div class="panel-title">
              <span>Health check</span>
              <span class="panel-updated" id="diagnostics-updated"></span>
            </div>
            <div id="diagnostics-grid"></div>
          </div>
          <div class="actions" id="actions">
            <button type="button" class="btn btn-primary btn-wide" id="retry">Retry</button>
            <button type="button" class="btn btn-outline" id="quick-restart">Quick restart</button>
            <button type="button" class="btn btn-outline" id="start-hub">Start Hub</button>
            <button type="button" class="btn btn-outline" id="run-diagnostics">Run diagnostics</button>
            <button type="button" class="btn btn-outline" id="install-docker">Install Docker</button>
            <button type="button" class="btn btn-outline btn-wide" id="open-logs">View logs</button>
          </div>
        </div>
      </div>
    </main>
    <script src="./bootstrap.js"></script>
  </body>
</html>
