<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion Hub</title>
    <link rel="stylesheet" href="./bootstrap.css" />
  </head>
  <body>
    <!-- Titlebar is built by bootstrap.js: the shape differs per platform, and
         the window controls need Tauri IPC. -->
    <main>
      <div class="shell">
        <div class="brand">
          <img class="logo" src="./assets/hub-logo.png" alt="" aria-hidden="true" />
          <h1>CI Hub</h1>
        </div>

        <div class="card">
          <div class="stack">
            <div class="head">
              <h2>Starting CI Hub</h2>
              <p id="status" role="status">Services are coming online...</p>
              <p class="note">This might take a minute on first startup while containers are pulled.</p>
            </div>

            <div class="progress" id="progress" hidden>
              <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
              <div class="bar-meta">
                <span id="progress-pct">0%</span>
                <span id="elapsed">0:00 elapsed</span>
              </div>
              <div class="counts">
                <div id="service-counts"></div>
                <div id="image-pulls"></div>
                <div id="checks-updated" hidden></div>
              </div>
            </div>

            <div class="services" id="services" hidden></div>

            <div class="initialising" id="initialising">
              <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              <span>Initialising...</span>
            </div>

            <div class="actions" id="actions" hidden>
              <button type="button" class="btn btn-primary btn-wide" id="retry">Retry</button>
              <button type="button" class="btn btn-outline" id="quick-restart">Quick restart</button>
              <button type="button" class="btn btn-outline" id="start-hub">Start Hub</button>
              <button type="button" class="btn btn-outline" id="run-diagnostics">Run diagnostics</button>
              <button type="button" class="btn btn-outline" id="install-docker">Install Docker</button>
              <button type="button" class="btn btn-outline btn-wide" id="open-logs">View logs</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./bootstrap.js"></script>
  </body>
</html>
