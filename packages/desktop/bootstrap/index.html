<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion Hub</title>
    <link rel="stylesheet" href="./bootstrap.css" />
  </head>
  <body>
    <!-- Titlebar is built by bootstrap.js: the shape differs per platform, and
         the window controls need Tauri IPC. -->
    <main>
      <div class="shell">
        <div class="brand">
          <img class="logo" src="./assets/hub-logo.png" alt="" aria-hidden="true" />
          <h1>CI Hub</h1>
        </div>

        <div class="card">
          <div class="stack">
            <div class="head">
              <h2 id="title">Checking CI Hub</h2>
              <p class="line" id="status" role="status">Looking at Docker and the Hub's services…</p>
            </div>

            <div class="initialising" id="initialising">
              <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              <span>Initialising...</span>
            </div>

            <div class="progress" id="progress" hidden>
              <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
              <div class="bar-meta">
                <span id="progress-pct">0%</span>
                <span id="progress-time"></span>
              </div>
            </div>

            <div class="panel" id="panel" hidden>
              <dl class="facts" id="facts"></dl>
              <div class="rows" id="rows"></div>
              <p class="panel-error" id="panel-error" hidden></p>
              <div class="counts" id="counts"></div>
            </div>

            <div class="command" id="command" hidden>
              <code id="command-text"></code>
              <button type="button" class="command-copy" id="command-copy">Copy</button>
            </div>

            <div class="actions" id="actions" hidden>
              <button type="button" class="btn btn-primary" id="start-hub">Start Hub</button>
              <button type="button" class="btn btn-primary" id="restart-hub">Restart Hub</button>
              <button type="button" class="btn btn-outline" id="keep-waiting">Keep waiting</button>
              <button type="button" class="btn btn-primary" id="try-again">Try again</button>
              <button type="button" class="btn btn-primary" id="install-docker">Install Docker</button>
              <button type="button" class="link" id="copy-error">Copy error</button>
              <button type="button" class="link" id="open-logs">View logs</button>
            </div>
            <p class="action-error" id="logs-error" hidden></p>
            <p class="aside" id="aside" hidden>Starting usually takes under a minute.</p>

            <div class="waiting" id="waiting" hidden>
              <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              <span>Waiting for Docker…</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./bootstrap.js"></script>
  </body>
</html>
