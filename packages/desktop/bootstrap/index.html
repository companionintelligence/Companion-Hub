<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion Hub</title>
    <style>
      :root {
                                            color-scheme: dark;
                                            --bg: #041620;
                                            --text: #e8f4f8;
                                            --muted: #8aa8b5;
                                            --accent: #3ec9e0;
                                          }
                                          * {
                                            box-sizing: border-box;
                                          }
                                          body {
                                            margin: 0;
                                            min-height: 100vh;
                                            display: flex;
                                            align-items: center;
                                            justify-content: center;
                                            background: var(--bg);
                                            color: var(--text);
                                            font-family: 'Manrope', system-ui, -apple-system, sans-serif;
                                          }
                                          main {
                                            text-align: center;
                                            padding: 2rem;
                                            max-width: 28rem;
                                          }
                                          h1 {
                                            font-size: 1.25rem;
                                            font-weight: 600;
                                            margin: 0 0 0.5rem;
                                          }
                                          p {
                                            margin: 0;
                                            color: var(--muted);
                                            font-size: 0.95rem;
                                            line-height: 1.5;
                                          }
                                          .spinner {
                                            width: 2rem;
                                            height: 2rem;
                                            margin: 0 auto 1.25rem;
                                            border: 2px solid rgba(62, 201, 224, 0.25);
                                            border-top-color: var(--accent);
                                            border-radius: 50%;
                                            animation: spin 0.8s linear infinite;
                                          }
                                          @keyframes spin {
                                            to {
                                              transform: rotate(360deg);
                                            }
                                          }
                                          .actions {
                                            margin-top: 1.5rem;
                                            display: none;
                                            flex-direction: column;
                                            gap: 0.5rem;
                                          }
                                          .actions.visible {
                                            display: flex;
                                          }
                                          button {
                                            appearance: none;
                                            border: 1px solid rgba(62, 201, 224, 0.45);
                                            background: transparent;
                                            color: var(--text);
                                            border-radius: 0.5rem;
                                            padding: 0.625rem 1rem;
                                            font: inherit;
                                            cursor: pointer;
                                          }
                                          button.primary {
                                            background: var(--accent);
                                            border-color: var(--accent);
                                            color: var(--bg);
                                            font-weight: 600;
                                          }
                                          button:hover {
                                            filter: brightness(1.08);
                                          }
                                          #status.error {
                                            color: #f87171;
                                          }
                                          .titlebar {
                                            position: fixed;
                                            top: 0;
                                            left: 0;
                                            right: 0;
                                            height: 2.5rem;
                                            z-index: 10;
                                          }
    </style>
  </head>
  <body>
    <!-- Decorations are off on Windows/Linux (see main.rs setup), so without a
         drag region the window cannot be moved while the Hub is starting.
         Tauri's injected handler makes this strip drag the window; a
         double-click on it toggles maximize. -->
    <div class="titlebar" data-tauri-drag-region></div>
    <main>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <h1>Companion Hub</h1>
      <p id="status" role="status">Starting your Hub…</p>
      <div class="actions" id="actions">
        <button type="button" class="primary" id="retry">Retry</button>
        <button type="button" id="start-hub">Start Hub</button>
        <button type="button" id="install-docker">Install Docker</button>
        <button type="button" id="open-logs">View logs</button>
      </div>
    </main>
    <script src="./bootstrap.js"></script>
  </body>
</html>
