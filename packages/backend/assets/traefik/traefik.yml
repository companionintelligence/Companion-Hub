api:
  dashboard: true
  # SECURITY: keep the insecure API/dashboard OFF by default. When `insecure` is
  # true, Traefik serves the unauthenticated dashboard + API on :8080, which the
  # prod compose publishes to the host — an unauthenticated control-plane leak.
  # It is only re-enabled for local development at config-copy time (see
  # AppService.copyAssets); production/staging/test all keep it disabled.
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
    # Disable host information retrieval to avoid Docker API version errors
    useBindPortIP: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Which peers may vouch for a client's address. ONLY the edge network
# (docker-compose.prod.yml: `ci_hub_edge`, a fixed subnet holding just
# cloudflared and the Tailscale sidecar at fixed addresses). A request from
# anywhere else — the LAN, an app container, the host — has its forwarded
# headers stripped and is named as the client itself, so nothing outside that
# subnet can choose the address it appears as. The placeholder is filled from
# HUB_EDGE_SUBNET at config-copy time (AppService.copyAssets), the same value
# the compose file gives the network.
entryPoints:
  web:
    address: ":80"
    # Allow plain HTTP - no automatic redirect to HTTPS
    # Cloudflare Tunnel connects via plain HTTP
    forwardedHeaders:
      trustedIPs:
        - {{EDGE_TRUSTED_CIDR}}
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 300s
        idleTimeout: 300s
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: myresolver
    forwardedHeaders:
      trustedIPs:
        - {{EDGE_TRUSTED_CIDR}}
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 300s
        idleTimeout: 300s

certificatesResolvers:
  myresolver:
    acme:
      email: {{ACME_EMAIL}}
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  # Suppress Docker provider errors about host information retrieval
  format: json
