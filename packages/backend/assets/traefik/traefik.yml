api:
  dashboard: true
  # SECURITY: keep the insecure API/dashboard OFF by default. When `insecure` is
  # true, Traefik serves the unauthenticated dashboard + API on :8080, which the
  # prod compose publishes to the host — an unauthenticated control-plane leak.
  # It is only re-enabled for local development at config-copy time (see
  # AppService.copyAssets); production/staging/test all keep it disabled.
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
    # Disable host information retrieval to avoid Docker API version errors
    useBindPortIP: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Which peers may vouch for a client's address. ONLY the two edge hops,
# cloudflared and the Tailscale sidecar, at the fixed addresses
# docker-compose.prod.yml gives them on `ci_hub_edge`. A request from anywhere
# else — the LAN, an app container, the host — has its forwarded headers
# stripped and is named as the client itself, so nothing else can choose the
# address it appears as.
#
# By address, NOT the edge subnet: the subnet's gateway (.1) is the host's own
# address on the bridge, so anything the host sends or routes onto it arrives
# from there — every connection to Traefik's published ports, whenever the edge
# is Traefik's gateway network, including an app dialling
# host.docker.internal:80. See `resolveEdgeHops`.
#
# The values are the compose defaults, real addresses rather than placeholders
# because the CLI and the desktop app seed this file with nothing but the ACME
# email filled in, and Traefik will not start on an entry that is not an
# address. The Hub rewrites each tagged line from HUB_EDGE_CLOUDFLARED_IP /
# HUB_EDGE_TAILSCALE_IP at config-copy time (AppService.copyAssets), and
# restarts Traefik when that changes the file, since Traefik reads this file
# only at startup. Keep the `# edge hop:` tags.
#
# Trusting a hop keeps EVERY forwarded header it sends, and Traefik fills in
# only those left empty. Cloudflare rewrites X-Forwarded-For and
# X-Forwarded-Proto but passes the visitor's own X-Real-Ip, X-Forwarded-Uri
# and the like through, so tunnel routes strip those first
# (`ci-hub-edge-headers` in dynamic/dynamic.yml), and the Hub's forward auth
# reads the request the router matched, not the forwarded headers.
entryPoints:
  web:
    address: ":80"
    # Allow plain HTTP - no automatic redirect to HTTPS
    # Cloudflare Tunnel connects via plain HTTP
    forwardedHeaders:
      trustedIPs:
        - 10.128.0.3/32 # edge hop: cloudflared
        - 10.128.0.4/32 # edge hop: hub-tailscale
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 300s
        idleTimeout: 300s
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: myresolver
    forwardedHeaders:
      trustedIPs:
        - 10.128.0.3/32 # edge hop: cloudflared
        - 10.128.0.4/32 # edge hop: hub-tailscale
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 300s
        idleTimeout: 300s

certificatesResolvers:
  myresolver:
    acme:
      email: {{ACME_EMAIL}}
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  # Suppress Docker provider errors about host information retrieval
  format: json
