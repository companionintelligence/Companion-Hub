api:
  dashboard: true
  insecure: true
  # In Traefik v3, when insecure is true, dashboard listens on port 8080 by default
  # Access at http://localhost:9091/dashboard/ (note the trailing slash)
  # The API is available at http://localhost:9091/api/

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
    # Disable host information retrieval to avoid Docker API 400 errors
    useBindPortIP: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: ":80"
    # Allow plain HTTP - no automatic redirect to HTTPS
    # Cloudflare Tunnel connects via plain HTTP
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 300s
        idleTimeout: 300s
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: myresolver
    transport:
      respondingTimeouts:
        readTimeout: 300s
        writeTimeout: 300s
        idleTimeout: 300s

certificatesResolvers:
  myresolver:
    acme:
      email: acme@thisprops.com
      storage: /shared/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  # Suppress Docker provider errors about host information retrieval
  format: json
