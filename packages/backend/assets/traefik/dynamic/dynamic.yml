# Transport security floor for every TLS router Traefik serves (Hub itself and
# every app behind it, CI Memory included). Go's crypto/tls already defaults to
# this and has no SSLv2/SSLv3 at all, but the floor is pinned here so it is a
# stated configuration rather than an inherited default, and so an upgrade of
# Traefik or Go can never lower it silently.
tls:
  options:
    default:
      minVersion: VersionTLS12

http:
  serversTransports:
    insecuretransport:
      insecureSkipVerify: true
    # For the Hub's app-starting page below. The Hub answers it in milliseconds, so this only bounds
    # how long a Hub that is down or stuck can hold up an app's error response: past it the visitor
    # gets Traefik's plain error text under the app's status, as before the page existed.
    ci-hub-app-starting:
      forwardingTimeouts:
        dialTimeout: 2s
        responseHeaderTimeout: 5s

  middlewares:
    ci-hub:
      forwardAuth:
        address: "http://{{HUB_CONTAINER_NAME}}:5002/api/auth/traefik"
        # false: the Hub decides from the request the router matched — its Host
        # (the tunnel's rewritten origin host), URI and method — never from
        # X-Forwarded-* headers that arrived with it. The entry points trust
        # cloudflared's forwarded headers (traefik.yml), and Cloudflare passes a
        # visitor's own X-Forwarded-Uri / -Method / -Prefix through untouched, so
        # with true a visitor could name a public path while requesting another,
        # or name another app's host. The Hub still sees the peer Traefik saw.
        trustForwardHeader: false
        # No `maxResponseBodySize` here, though the compose labels set it. This file is rewritten by
        # whichever Hub or CLI version is newest, and it can land beside a Traefik that was not rolled
        # with it; a Traefik older than 3.6.9 rejects the unknown field and, with it, the whole file,
        # which takes this middleware, the TLS floor and every route that uses them down. The labels
        # travel with the image pin in the same compose file, so they cannot be ahead of it.
        # Every signed identity header must ride through — Traefik copies ONLY the
        # headers listed here, and consumers verifying the signature fail closed on a
        # missing timestamp/signature (CI-Engineering#74). Listing a name also strips a
        # visitor's own copy of it before the copy, which is what keeps the stable-id
        # trio (issuer, id, id signature) from ever arriving unsigned.
        authResponseHeaders:
          - "X-CI-Hub-User"
          - "X-CI-Hub-User-Timestamp"
          - "X-CI-Hub-User-Signature"
          - "X-CI-Hub-User-Issuer"
          - "X-CI-Hub-User-Id"
          - "X-CI-Hub-User-Id-Signature"

    # First on every tunnel route (TraefikLabelsBuilder.addCloudflareLabels).
    # Traefik keeps a trusted peer's forwarded headers and fills in only those
    # left empty, and the entry points trust cloudflared (traefik.yml). Neither
    # Cloudflare nor cloudflared sets these, so on a tunnel request each is
    # whatever the visitor sent: an X-Real-Ip of their choosing would reach
    # every app that reads it, defeating its per-address throttles. Empty
    # removes the header; an app that needs the visitor's address reads
    # X-Forwarded-For past HUB_TRUSTED_PROXY_CIDRS. X-Forwarded-Port is set
    # again by the app's public-host middleware, which runs after this one.
    ci-hub-edge-headers:
      headers:
        customRequestHeaders:
          X-Real-Ip: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Port: ""
          X-Forwarded-Tls-Client-Cert: ""
          X-Forwarded-Tls-Client-Cert-Info: ""

    # Last on every app router (withAppStartingPage in traefik-labels.builder.ts, and the
    # port-expose routes) and on nothing else: not the Hub's own routers, not forward auth. When the
    # app's route answers 502 (its container is up but nothing listens yet) or 504 (the app, or a
    # proxy inside it, timed out), Traefik asks the Hub for "<app> is starting…" or why it is not,
    # and sends that page under the app's own status code, so API clients and health checks still
    # see the failure. Traefik makes that request with the visitor's own headers (cookies and Authorization
    # too; it has no option to drop them before v3.6.15) and `Host`, which is how the Hub knows
    # which app it is. An app's OWN 502 or 504 body is replaced as well; there is no telling the two
    # apart from here.
    #
    # Not 503. Apps send it on purpose, with a body their own clients read: Companion Memory's
    # PowerSync token endpoint answers 503 by design, and model servers answer 503 while a model
    # loads. Traefik itself seldom answers 503 on these routes, since the Hub drops a stopped app's
    # router and these services have no health checks.
    ci-hub-app-starting:
      errors:
        status:
          - "502"
          - "504"
        service: ci-hub-app-starting
        query: "/api/apps/starting?status={status}"

  services:
    # The Hub, for the page above, by the same container-name placeholder as forward auth's address,
    # which the Hub fills in when it copies this file (AppService.copyAssets). Keeps the visitor's
    # `Host` (Traefik's default, written out because the page depends on it) rather than the Hub's.
    ci-hub-app-starting:
      loadBalancer:
        passHostHeader: true
        serversTransport: ci-hub-app-starting
        servers:
          - url: "http://{{HUB_CONTAINER_NAME}}:5002"
