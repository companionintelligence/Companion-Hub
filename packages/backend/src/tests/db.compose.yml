services:
  db:
    image: ${POSTGRES_TEST_IMAGE:-postgres:14}
    restart: no
    command: -p 6543
    ports:
      - 6543
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

  rabbitmq:
    image: ${RABBITMQ_TEST_IMAGE:-rabbitmq:4-alpine}
    restart: no
    ports:
      - 5672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 3s
      timeout: 5s
      retries: 10
