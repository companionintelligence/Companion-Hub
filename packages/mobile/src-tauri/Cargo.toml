[package]
name = "ci-os-hub-mobile"
version = "0.1.0"
description = "Mobile (iOS/Android) app for accessing the Companion Intelligence Hub"
authors = ["Companion Intelligence"]
edition = "2021"
license-file = "../../../LICENSE.md"
readme = "../README.md"
homepage = "https://ci.computer"
repository = "https://github.com/companionintelligence"

# The mobile entry point (tauri::mobile_entry_point) lives in the library, which
# the generated iOS/Android native projects link against and call into. `main.rs`
# is only used for desktop `tauri dev`.
[lib]
name = "ci_os_hub_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# A thin remote client: no tray, no Docker/Hub management, no updater. It embeds
# the React frontend and connects to a remote Hub appliance over the network.
tauri = { version = "2", features = ["image-png", "devtools"] }
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# Native HTTP client — lets the cloud "Hub picker" call the Portal cross-origin
# without webview CORS/cookie restrictions, and routes remote-Hub API calls
# through native HTTP so a tauri://localhost webview can talk to https Hubs.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
