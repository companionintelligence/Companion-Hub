<svg xmlns="http://www.w3.org/2000/svg" width="664" height="254" viewBox="0 0 664 254" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal capture for app-list</desc>
  <rect width="664" height="254" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="664" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="664" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="332.0" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">app-list</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16" xml:space="preserve">
    <text x="24" y="56" fill="#e6edf3">$ cihub app list</text><text x="24" y="78" fill="#e6edf3">┌─ Local Docker app lifecycle─────────────────────────┐</text><text x="24" y="100" fill="#e6edf3">│ Listing Docker containers managed on this machine. │</text><text x="24" y="122" fill="#e6edf3">└─────────────────────────────────────────────────────┘</text><text x="24" y="144" fill="#e6edf3">▶ docker ps -a --format &quot;table {{.Names}}\t{{.Image}}\t{{.Status}}&quot;</text><text x="24" y="166" fill="#e6edf3">NAMES            IMAGE                           STATUS</text><text x="24" y="188" fill="#e6edf3">demo-ollama      ollama/ollama:latest           Up 2 minutes</text><text x="24" y="210" fill="#e6edf3">demo-openwebui   ghcr.io/open-webui/open-webui  Up 2 minutes</text>
  </g>
</svg>
