<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal capture for cihub --help</desc>
  <rect width="960" height="1320" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="960" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="960" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="480" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">help</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="56"  fill="#7ee787">$ cihub --help</text>
    <text x="24" y="80"  fill="#3fb950" font-size="20">Companion Intelligence Hub</text>
    <text x="24" y="104" fill="#3fb950" font-size="16">ci.computer</text>

    <text x="24" y="144" fill="#3fb950">┌─ Quick start ──────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="164" fill="#e6edf3">  First run  cihub wizard</text>
    <text x="24" y="184" fill="#e6edf3">  Install    npm install -g ci-hub</text>
    <text x="24" y="204" fill="#e6edf3">  NPX        npx --package ci-hub cihub --help</text>
    <text x="24" y="224" fill="#e6edf3">  Dev        pnpm run hub -- --help</text>
    <text x="24" y="244" fill="#3fb950">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="284" fill="#30363d">┌─ Setup &amp; Registration ─────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="304" fill="#e6edf3">  cihub wizard [env]    Guided first-time or re-setup wizard</text>
    <text x="24" y="324" fill="#e6edf3">  cihub setup [env]     Initialize host state, Traefik, and Docker auth config</text>
    <text x="24" y="344" fill="#e6edf3">  cihub register [env]  Print cloud portal registration URL for this device</text>
    <text x="24" y="364" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="404" fill="#30363d">┌─ Hub lifecycle ─────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="424" fill="#e6edf3">  cihub up [env] [--detached]  Start the hub stack</text>
    <text x="24" y="444" fill="#e6edf3">  cihub shutdown [env]         Stop the hub stack</text>
    <text x="24" y="464" fill="#e6edf3">  cihub status [env]           Containers, Cloudflare tunnel, Tailscale VPN, and models</text>
    <text x="24" y="484" fill="#e6edf3">  cihub config [env]           Show resolved configuration values</text>
    <text x="24" y="504" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="544" fill="#30363d">┌─ Models ────────────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="564" fill="#e6edf3">  cihub models list            List installed Ollama models</text>
    <text x="24" y="584" fill="#e6edf3">  cihub models install &lt;name&gt;  Pull an Ollama model (e.g. llama3, mistral)</text>
    <text x="24" y="604" fill="#e6edf3">  cihub models rm &lt;name&gt;       Remove an installed Ollama model</text>
    <text x="24" y="624" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="664" fill="#30363d">┌─ App lifecycle ─────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="684" fill="#e6edf3">  cihub app list                              List managed Docker containers</text>
    <text x="24" y="704" fill="#e6edf3">  cihub app status [name]                     Show container status (color-coded)</text>
    <text x="24" y="724" fill="#e6edf3">  cihub app logs &lt;name&gt; [--tail N]            Stream container logs</text>
    <text x="24" y="744" fill="#e6edf3">  cihub app add &lt;name&gt; &lt;image&gt;                Launch a new Docker container app</text>
    <text x="24" y="764" fill="#e6edf3">  cihub app edit &lt;name&gt; &lt;image&gt;               Recreate a Docker container app</text>
    <text x="24" y="784" fill="#e6edf3">  cihub app start|stop|restart|delete &lt;name&gt;  Container lifecycle controls</text>
    <text x="24" y="804" fill="#e6edf3">  cihub app inspect &lt;name&gt;                    Show container ports, env, and mounts</text>
    <text x="24" y="824" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="864" fill="#30363d">┌─ MCP ───────────────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="884" fill="#e6edf3">  cihub mcp setup [env]     Enable MCP and provision MCP_API_KEY</text>
    <text x="24" y="904" fill="#e6edf3">  cihub mcp shutdown [env]  Disable MCP in the target env file</text>
    <text x="24" y="924" fill="#e6edf3">  cihub mcp config [env]    Show current MCP settings</text>
    <text x="24" y="944" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="984" fill="#30363d">┌─ Developer workflow ────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="1004" fill="#e6edf3">  cihub hot-reload [env]  Run infra + backend/frontend with hot reload</text>
    <text x="24" y="1024" fill="#e6edf3">  cihub purge [--yes]     Remove Docker state + CI-Hub caches/configs</text>
    <text x="24" y="1044" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="1084" fill="#30363d">┌─ Help &amp; docs ───────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="1104" fill="#e6edf3">  cihub man          Manual-style command reference</text>
    <text x="24" y="1124" fill="#e6edf3">  cihub --help       This help output</text>
    <text x="24" y="1144" fill="#e6edf3">  cihub version      Show version from package.json</text>
    <text x="24" y="1164" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <text x="24" y="1204" fill="#b08800">┌─ Environments ──────────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="1224" fill="#e6edf3">  local  ·  dev  ·  staging  ·  prod</text>
    <text x="24" y="1244" fill="#b08800">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
  </g>
</svg>
