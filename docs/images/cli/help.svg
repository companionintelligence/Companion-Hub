<svg xmlns="http://www.w3.org/2000/svg" width="866" height="1156" viewBox="0 0 866 1156" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal capture for help</desc>
  <rect width="866" height="1156" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="866" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="866" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="433.0" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">help</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16" xml:space="preserve">
    <text x="24" y="56" fill="#e6edf3">$ cihub --help</text><text x="24" y="78" fill="#e6edf3"> __   __         __               __                 </text><text x="24" y="100" fill="#e6edf3">/  ` /  \  |\/| |__)  /\  |\ | | /  \ |\ |           </text><text x="24" y="122" fill="#e6edf3">\__, \__/  |  | |    /~~\ | \| | \__/ | \|           </text><text x="24" y="144" fill="#e6edf3">                                                     </text><text x="24" y="166" fill="#e6edf3">       ___  ___              __   ___       __   ___ </text><text x="24" y="188" fill="#e6edf3">| |\ |  |  |__  |    |    | / _` |__  |\ | /  ` |__  </text><text x="24" y="210" fill="#e6edf3">| | \|  |  |___ |___ |___ | \__&gt; |___ | \| \__, |___ </text><text x="24" y="232" fill="#e6edf3"></text><text x="24" y="254" fill="#e6edf3"></text><text x="24" y="276" fill="#e6edf3"></text><text x="24" y="298" fill="#e6edf3">┌─ Quick start───────────────────────────────┐</text><text x="24" y="320" fill="#e6edf3">│ Launch  cihub wizard                      │</text><text x="24" y="342" fill="#e6edf3">│ Package npm install -g ci-hub             │</text><text x="24" y="364" fill="#e6edf3">│ NPX     npx --package ci-hub cihub --help │</text><text x="24" y="386" fill="#e6edf3">│ Compat  pnpm run hub -- --help            │</text><text x="24" y="408" fill="#e6edf3">└────────────────────────────────────────────┘</text><text x="24" y="430" fill="#e6edf3"></text><text x="24" y="452" fill="#e6edf3">┌─ Core commands────────────────────────────────────────────────────────────────────────┐</text><text x="24" y="474" fill="#e6edf3">│ cihub wizard [env]           Interactive setup and launch wizard                     │</text><text x="24" y="496" fill="#e6edf3">│ cihub setup [env]            Initialize host state, Traefik, and Docker auth config  │</text><text x="24" y="518" fill="#e6edf3">│ cihub register [env]         Print cloud portal registration details for this device │</text><text x="24" y="540" fill="#e6edf3">│ cihub up [env] [--detached]  Start the hub stack                                     │</text><text x="24" y="562" fill="#e6edf3">│ cihub shutdown [env]         Stop the hub stack                                      │</text><text x="24" y="584" fill="#e6edf3">│ cihub config [env]           Show resolved configuration values                      │</text><text x="24" y="606" fill="#e6edf3">└───────────────────────────────────────────────────────────────────────────────────────┘</text><text x="24" y="628" fill="#e6edf3"></text><text x="24" y="650" fill="#e6edf3">┌─ MCP commands───────────────────────────────────────────────────────┐</text><text x="24" y="672" fill="#e6edf3">│ cihub mcp setup [env]     Enable MCP and ensure MCP_API_KEY exists │</text><text x="24" y="694" fill="#e6edf3">│ cihub mcp shutdown [env]  Disable MCP in the target env file       │</text><text x="24" y="716" fill="#e6edf3">│ cihub mcp config [env]    Show current MCP settings                │</text><text x="24" y="738" fill="#e6edf3">└─────────────────────────────────────────────────────────────────────┘</text><text x="24" y="760" fill="#e6edf3"></text><text x="24" y="782" fill="#e6edf3">┌─ Container app lifecycle─────────────────────────────────────────────────────────────┐</text><text x="24" y="804" fill="#e6edf3">│ cihub app list                              List local Docker containers            │</text><text x="24" y="826" fill="#e6edf3">│ cihub app add &lt;name&gt; &lt;image&gt;                Launch a new local Docker container app │</text><text x="24" y="848" fill="#e6edf3">│ cihub app edit &lt;name&gt; &lt;image&gt;               Recreate a local Docker container app   │</text><text x="24" y="870" fill="#e6edf3">│ cihub app start|stop|restart|delete &lt;name&gt;  Manage a local Docker container app     │</text><text x="24" y="892" fill="#e6edf3">└──────────────────────────────────────────────────────────────────────────────────────┘</text><text x="24" y="914" fill="#e6edf3"></text><text x="24" y="936" fill="#e6edf3">┌─ Other commands──────────────────────────────────┐</text><text x="24" y="958" fill="#e6edf3">│ cihub help          Show help output            │</text><text x="24" y="980" fill="#e6edf3">│ cihub man           Show manual-style reference │</text><text x="24" y="1002" fill="#e6edf3">│ cihub --help        Help shortcut               │</text><text x="24" y="1024" fill="#e6edf3">└──────────────────────────────────────────────────┘</text><text x="24" y="1046" fill="#e6edf3"></text><text x="24" y="1068" fill="#e6edf3">┌─ Environments──────────────┐</text><text x="24" y="1090" fill="#e6edf3">│ local, dev, staging, prod │</text><text x="24" y="1112" fill="#e6edf3">└────────────────────────────┘</text>
  </g>
</svg>
