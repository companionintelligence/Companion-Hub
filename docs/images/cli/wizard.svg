    <text x="24" y="256" fill="#484f58">Companion Intelligence Hub  ·  companionintelligence.com</text>
    <text x="24" y="296" fill="#3fb950">┌─ Setup Wizard ─────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="316" fill="#e6edf3">  Goal  Launch, configure, and register your Hub in one guided flow.</text>
    <text x="24" y="336" fill="#e6edf3">  Tip   Press Enter to accept the shown default for each prompt.</text>
    <text x="24" y="356" fill="#e6edf3">  Docs  cihub man  ·  cihub --help</text>
    <text x="24" y="376" fill="#3fb950">└─────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="416" fill="#b08800">┌─ First-time setup detected ────────────────────────────────────────────────────────┐</text>
    <text x="24" y="436" fill="#e6edf3">  No .env.local found — wizard will guide you through initial setup.</text>
    <text x="24" y="456" fill="#484f58">  ○ [1/6] Choose environment</text>
    <text x="24" y="476" fill="#484f58">  ○ [2/6] Check prerequisites</text>
    <text x="24" y="496" fill="#484f58">  ○ [3/6] Initialize host &amp; Docker config</text>
    <text x="24" y="516" fill="#484f58">  ○ [4/6] Register with CI Cloud</text>
    <text x="24" y="536" fill="#484f58">  ○ [5/6] Start the Hub</text>
    <text x="24" y="556" fill="#484f58">  ○ [6/6] Install initial model (optional)</text>
    <text x="24" y="576" fill="#b08800">└─────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="616" fill="#58a6ff">● [1/6] Choose environment</text>
    <text x="24" y="636" fill="#30363d">┌─ Choose environment ────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="656" fill="#e6edf3">  1. local    — Local Docker compose stack  (default)</text>
    <text x="24" y="676" fill="#e6edf3">  2. dev      — Shared dev environment</text>
    <text x="24" y="696" fill="#e6edf3">  3. staging  — Shared staging environment</text>
    <text x="24" y="716" fill="#e6edf3">  4. prod     — Production environment</text>
    <text x="24" y="736" fill="#30363d">└─────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="756" fill="#e6edf3">  Environment [1-4, default 1]: <tspan fill="#7ee787">1</tspan></text>
    <text x="24" y="776" fill="#3fb950">✓ [1/6] Environment: local</text>
    <text x="24" y="816" fill="#58a6ff">● [2/6] Checking prerequisites…</text>
    <text x="24" y="836" fill="#30363d">┌─ Prerequisites ─────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="856" fill="#e6edf3">  Docker:           <tspan fill="#3fb950">● available</tspan></text>
    <text x="24" y="876" fill="#e6edf3">  Docker Compose:   <tspan fill="#3fb950">● available</tspan></text>
    <text x="24" y="896" fill="#e6edf3">  Tailscale VPN:    <tspan fill="#3fb950">● 100.64.0.3</tspan></text>
    <text x="24" y="916" fill="#e6edf3">  Env file:         <tspan fill="#d29922">○ will be created</tspan></text>
