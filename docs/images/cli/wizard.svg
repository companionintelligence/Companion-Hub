    <text x="24" y="176" fill="#3fb950"> ___     _       _ _ _                      </text>
    <text x="24" y="196" fill="#3fb950">|_ _|_ _| |_ ___| | (_)__ _ ___ _ _  __ ___ </text>
    <text x="24" y="216" fill="#3fb950"> | || ' \  _/ -_) | | / _` / -_) ' \/ _/ -_)</text>
