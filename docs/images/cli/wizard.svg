<svg xmlns="http://www.w3.org/2000/svg" width="840" height="980" viewBox="0 0 840 980" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal capture for cihub wizard (FTUE first-run mode)</desc>
  <rect width="840" height="980" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="840" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="840" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="420" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">wizard</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="56"  fill="#7ee787">$ cihub wizard</text>
    <text x="24" y="76"  fill="#3fb950"> __   __         __               __                 </text>
    <text x="24" y="96"  fill="#3fb950">/  ` /  \  |\/| |__)  /\  |\ | | /  \ |\ |           </text>
    <text x="24" y="116" fill="#3fb950">\__, \__/  |  | |    /~~\ | \| | \__/ | \|           </text>
    <text x="24" y="136" fill="#3fb950">                                                     </text>
    <text x="24" y="156" fill="#3fb950">       ___  ___              __   ___       __   ___ </text>
    <text x="24" y="176" fill="#3fb950">| |\ |  |  |__  |    |    | / _` |__  |\ | /  ` |__  </text>
    <text x="24" y="196" fill="#3fb950">| | \|  |  |___ |___ |___ | \__&gt; |___ | \| \__, |___</text>
    <text x="24" y="216" fill="#484f58">Companion Intelligence Hub  ·  companionintelligence.com</text>
    <text x="24" y="256" fill="#3fb950">┌─ Setup Wizard ────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="276" fill="#e6edf3">  Goal  Launch, configure, and register your Hub in one guided flow.</text>
    <text x="24" y="296" fill="#e6edf3">  Tip   Press Enter to accept the shown default for each prompt.</text>
    <text x="24" y="316" fill="#e6edf3">  Docs  cihub man  ·  cihub --help</text>
    <text x="24" y="336" fill="#3fb950">└────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="376" fill="#b08800">┌─ First-time setup detected ───────────────────────────────────────────────────────┐</text>
    <text x="24" y="396" fill="#e6edf3">  No .env.local found — wizard will guide you through initial setup.</text>
    <text x="24" y="416" fill="#e6edf3"></text>
    <text x="24" y="436" fill="#e6edf3">  ○ [1/4] Choose environment</text>
    <text x="24" y="456" fill="#e6edf3">  ○ [2/4] Setup host &amp; Docker</text>
    <text x="24" y="476" fill="#e6edf3">  ○ [3/4] Register with CI Cloud</text>
    <text x="24" y="496" fill="#e6edf3">  ○ [4/4] Start the Hub</text>
    <text x="24" y="516" fill="#b08800">└────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="556" fill="#58a6ff">● [1/4] Choose environment</text>
    <text x="24" y="576" fill="#30363d">┌─ Choose environment ──────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="596" fill="#e6edf3">  1. local    — Local Docker compose stack  (default)</text>
    <text x="24" y="616" fill="#e6edf3">  2. dev      — Shared dev environment</text>
    <text x="24" y="636" fill="#e6edf3">  3. staging  — Shared staging environment</text>
    <text x="24" y="656" fill="#e6edf3">  4. prod     — Production environment</text>
    <text x="24" y="676" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="696" fill="#e6edf3">  Environment [1-4, default 1]: <tspan fill="#7ee787">1</tspan></text>
    <text x="24" y="716" fill="#3fb950">✓ [1/4] Environment: local</text>
    <text x="24" y="756" fill="#58a6ff">● [2/4] Setting up host assets…</text>
    <text x="24" y="776" fill="#484f58">  ▶ tsx scripts/init-traefik.ts</text>
    <text x="24" y="796" fill="#484f58">  ▶ tsx scripts/init-docker-config.ts</text>
    <text x="24" y="816" fill="#3fb950">✓ [2/4] Setup complete</text>
    <text x="24" y="856" fill="#58a6ff">● [3/4] Registering with CI Cloud…</text>
    <text x="24" y="876" fill="#3fb950">┌─ Device registration ─────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="896" fill="#e6edf3">  device id  a1b2c3d4-e5f6-7890-abcd-ef1234567890</text>
    <text x="24" y="916" fill="#e6edf3">  portal     https://hub.companionintelligence.com/register?deviceId=a1b2...</text>
    <text x="24" y="936" fill="#e6edf3">  Open the URL above to pair this device, then run: cihub up local</text>
    <text x="24" y="956" fill="#3fb950">└────────────────────────────────────────────────────────────────────────────────────┘</text>
  </g>
</svg>
