<svg xmlns="http://www.w3.org/2000/svg" width="719" height="1024" viewBox="0 0 719 1024" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal capture for wizard</desc>
  <rect width="719" height="1024" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="719" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="719" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="359.5" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">wizard</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16" xml:space="preserve">
    <text x="24" y="56" fill="#e6edf3">$ cihub wizard</text><text x="24" y="78" fill="#e6edf3"> __   __         __               __                 </text><text x="24" y="100" fill="#e6edf3">/  ` /  \  |\/| |__)  /\  |\ | | /  \ |\ |           </text><text x="24" y="122" fill="#e6edf3">\__, \__/  |  | |    /~~\ | \| | \__/ | \|           </text><text x="24" y="144" fill="#e6edf3">                                                     </text><text x="24" y="166" fill="#e6edf3">       ___  ___              __   ___       __   ___ </text><text x="24" y="188" fill="#e6edf3">| |\ |  |  |__  |    |    | / _` |__  |\ | /  ` |__  </text><text x="24" y="210" fill="#e6edf3">| | \|  |  |___ |___ |___ | \__&gt; |___ | \| \__, |___ </text><text x="24" y="232" fill="#e6edf3"></text><text x="24" y="254" fill="#e6edf3">┌─ CI-Hub Setup Wizard──────────────────────────────────────────────────┐</text><text x="24" y="276" fill="#e6edf3">│ Goal  Launch, configure, and register your hub from one guided flow. │</text><text x="24" y="298" fill="#e6edf3">│ Tip   The preferred executable for packaged installs is cihub.       │</text><text x="24" y="320" fill="#e6edf3">│ Path  Global package-manager installs place cihub on your PATH.      │</text><text x="24" y="342" fill="#e6edf3">└───────────────────────────────────────────────────────────────────────┘</text><text x="24" y="364" fill="#e6edf3">┌─ Choose environment─────────────────────┐</text><text x="24" y="386" fill="#e6edf3">│ 1. local    Local Docker compose stack │</text><text x="24" y="408" fill="#e6edf3">│ 2. dev      Shared dev environment     │</text><text x="24" y="430" fill="#e6edf3">│ 3. staging  Shared staging environment │</text><text x="24" y="452" fill="#e6edf3">│ 4. prod     Production environment     │</text><text x="24" y="474" fill="#e6edf3">└─────────────────────────────────────────┘</text><text x="24" y="496" fill="#e6edf3">Environment [1-4] [1]: 1</text><text x="24" y="518" fill="#e6edf3"></text><text x="24" y="540" fill="#e6edf3">┌─ Choose action─────────────────────────────────┐</text><text x="24" y="562" fill="#e6edf3">│ 1. setup         Prepare host assets          │</text><text x="24" y="584" fill="#e6edf3">│ 2. up            Start the hub stack          │</text><text x="24" y="606" fill="#e6edf3">│ 3. register      Print cloud registration URL │</text><text x="24" y="628" fill="#e6edf3">│ 4. config        Show resolved configuration  │</text><text x="24" y="650" fill="#e6edf3">│ 5. mcp-setup     Enable MCP                   │</text><text x="24" y="672" fill="#e6edf3">│ 6. mcp-shutdown  Disable MCP                  │</text><text x="24" y="694" fill="#e6edf3">│ 7. shutdown      Stop the hub stack           │</text><text x="24" y="716" fill="#e6edf3">│ 8. app-list      List local Docker apps       │</text><text x="24" y="738" fill="#e6edf3">└────────────────────────────────────────────────┘</text><text x="24" y="760" fill="#e6edf3">Action [1-8] [1]: 4</text><text x="24" y="782" fill="#e6edf3"></text><text x="24" y="804" fill="#e6edf3">┌─ CI-Hub configuration────────────────────────────────────────────┐</text><text x="24" y="826" fill="#e6edf3">│ environment      local                                          │</text><text x="24" y="848" fill="#e6edf3">│ env file         .env.local                                     │</text><text x="24" y="870" fill="#e6edf3">│ root folder      /tmp/cihub-doc-captures/workdir/.internal-demo │</text><text x="24" y="892" fill="#e6edf3">│ cloud url        https://hub.companionintelligence.com          │</text><text x="24" y="914" fill="#e6edf3">│ compose profiles private-vpn                                    │</text><text x="24" y="936" fill="#e6edf3">│ mcp enabled      true                                           │</text><text x="24" y="958" fill="#e6edf3">│ mcp api key      &lt;not set&gt;                                      │</text><text x="24" y="980" fill="#e6edf3">└──────────────────────────────────────────────────────────────────┘</text>
  </g>
</svg>
