    <text x="24" y="276" fill="#484f58">Companion Intelligence Hub  ·  companionintelligence.com</text>
    <text x="24" y="314" fill="#3fb950">┌─ Setup Wizard──────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="334" fill="#e6edf3">│ Goal  Launch, configure, and register your Hub in one guided flow.       │</text>
    <text x="24" y="354" fill="#e6edf3">│ Tip   Press Enter to accept the shown default for each prompt.           │</text>
    <text x="24" y="374" fill="#e6edf3">│ Docs  cihub man  ·  cihub --help                                         │</text>
    <text x="24" y="394" fill="#3fb950">└────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="434" fill="#b08800">┌─ First-time setup detected────────────────────────────────────────────────┐</text>
    <text x="24" y="454" fill="#e6edf3">│ No .env.local found — wizard will guide you through initial setup.       │</text>
    <text x="24" y="474" fill="#e6edf3">│                                                                          │</text>
    <text x="24" y="494" fill="#e6edf3">│ ○ [1/4] Choose environment                                               │</text>
    <text x="24" y="514" fill="#e6edf3">│ ○ [2/4] Setup host &amp; Docker                                              │</text>
    <text x="24" y="534" fill="#e6edf3">│ ○ [3/4] Register with CI Cloud                                           │</text>
    <text x="24" y="554" fill="#e6edf3">│ ○ [4/4] Start the Hub                                                    │</text>
    <text x="24" y="574" fill="#b08800">└────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="614" fill="#58a6ff">● [1/4] Choose environment</text>
    <text x="24" y="634" fill="#30363d">┌─ Choose environment──────────────────────────────────────────────────────┐</text>
    <text x="24" y="654" fill="#e6edf3">│ 1. local    — Local Docker compose stack  (default)                     │</text>
    <text x="24" y="674" fill="#e6edf3">│ 2. dev      — Shared dev environment                                    │</text>
    <text x="24" y="694" fill="#e6edf3">│ 3. staging  — Shared staging environment                                │</text>
    <text x="24" y="714" fill="#e6edf3">│ 4. prod     — Production environment                                    │</text>
    <text x="24" y="734" fill="#30363d">└──────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="754" fill="#e6edf3">  Environment [1-4, default 1]: <tspan fill="#7ee787">1</tspan></text>
    <text x="24" y="774" fill="#3fb950">✓ [1/4] Environment: local</text>
    <text x="24" y="814" fill="#58a6ff">● [2/4] Setting up host assets…</text>
    <text x="24" y="834" fill="#484f58">▶ tsx scripts/init-traefik.ts</text>
    <text x="24" y="854" fill="#484f58">▶ tsx scripts/init-docker-config.ts</text>
    <text x="24" y="874" fill="#3fb950">✓ [2/4] Setup complete</text>
    <text x="24" y="914" fill="#58a6ff">● [3/4] Registering with CI Cloud…</text>
