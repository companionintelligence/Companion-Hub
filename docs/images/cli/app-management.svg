<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal captures for cihub app add, edit, start, stop, restart, delete</desc>
  <rect width="900" height="720" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="900" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">app-management</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="56"  fill="#7ee787">$ cihub app add demo-app nginx:alpine --port 8080:80 --env MODE=demo</text>
    <text x="24" y="76"  fill="#3fb950">┌─ Adding container app ─────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="96"  fill="#e6edf3">  name   demo-app</text>
    <text x="24" y="116" fill="#e6edf3">  image  nginx:alpine</text>
    <text x="24" y="136" fill="#e6edf3">  ports  8080:80</text>
    <text x="24" y="156" fill="#e6edf3">  env    MODE=demo</text>
    <text x="24" y="176" fill="#3fb950">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="196" fill="#484f58">  ▶ docker run -d --name demo-app -p 8080:80 -e MODE=demo nginx:alpine</text>
    <text x="24" y="216" fill="#e6edf3">c0ffee1234567890</text>
    <text x="24" y="256" fill="#7ee787">$ cihub app inspect demo-app</text>
    <text x="24" y="276" fill="#30363d">┌─ Inspect: demo-app ─────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="296" fill="#e6edf3">  image   nginx:alpine</text>
    <text x="24" y="316" fill="#e6edf3">  status  <tspan fill="#3fb950">Up 30 seconds</tspan></text>
    <text x="24" y="336" fill="#e6edf3">  ports   8080 → 80/tcp</text>
    <text x="24" y="356" fill="#e6edf3">  env     MODE=demo</text>
    <text x="24" y="376" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="416" fill="#7ee787">$ cihub app logs demo-app --tail 5</text>
    <text x="24" y="436" fill="#30363d">┌─ Container logs ────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="456" fill="#e6edf3">  Container: demo-app</text>
    <text x="24" y="476" fill="#e6edf3">  Tail: 5 lines</text>
    <text x="24" y="496" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="516" fill="#484f58">  ▶ docker logs --tail 5 --timestamps demo-app</text>
    <text x="24" y="536" fill="#e6edf3">2026-05-31T22:00:00Z nginx: worker process is running...</text>
    <text x="24" y="576" fill="#7ee787">$ cihub app delete demo-app</text>
    <text x="24" y="596" fill="#b08800">┌─ Container app lifecycle ───────────────────────────────────────────────────────────┐</text>
    <text x="24" y="616" fill="#e6edf3">  Removing container: demo-app</text>
    <text x="24" y="636" fill="#b08800">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="656" fill="#484f58">  ▶ docker rm -f demo-app</text>
    <text x="24" y="676" fill="#e6edf3">demo-app</text>
  </g>
</svg>
