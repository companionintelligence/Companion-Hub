<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">CLI banner — cihub wizard</title>
  <desc id="desc">Terminal showing Companion Intelligence Hub and ci.computer in green.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111827"/></linearGradient></defs>
  <rect width="800" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="40" rx="18" fill="#161b22"/>
  <rect x="0" y="22" width="800" height="18" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">banner-wizard</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" xml:space="preserve">
    <text x="32" y="80"  fill="#7ee787" font-size="15">$ cihub wizard</text>
    <text x="32" y="126" fill="#3fb950" font-size="28">COMPANION HUB</text>
    <text x="32" y="168" fill="#3fb950" font-size="22">ci.computer</text>
    <text x="32" y="210" fill="#e6edf3" font-size="14">The banner appears before every wizard prompt.</text>
    <text x="32" y="238" fill="#8b949e" font-size="12">6-step FTUE  ·  prerequisites  ·  setup  ·  register  ·  start  ·  model install</text>
  </g>
</svg>
