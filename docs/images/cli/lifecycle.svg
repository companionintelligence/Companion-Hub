<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal captures for cihub config, cihub up, and cihub shutdown</desc>
  <rect width="900" height="600" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="900" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">lifecycle</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="56"  fill="#7ee787">$ cihub config local</text>
    <text x="24" y="76"  fill="#30363d">┌─ CI-Hub configuration ─────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="96"  fill="#e6edf3">  environment      local</text>
    <text x="24" y="116" fill="#e6edf3">  env file         .env.local</text>
    <text x="24" y="136" fill="#e6edf3">  root folder      /home/user/.local/share/ci-hub/.internal</text>
    <text x="24" y="156" fill="#e6edf3">  cloud url        https://hub.companionintelligence.com</text>
    <text x="24" y="176" fill="#e6edf3">  compose profiles private-vpn</text>
    <text x="24" y="196" fill="#e6edf3">  mcp enabled      true</text>
    <text x="24" y="216" fill="#e6edf3">  mcp api key      &lt;set&gt;</text>
    <text x="24" y="236" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="276" fill="#7ee787">$ cihub up local --detached</text>
    <text x="24" y="296" fill="#3fb950">┌─ Starting hub ──────────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="316" fill="#e6edf3">  Environment: local</text>
    <text x="24" y="336" fill="#e6edf3">  Mode: detached</text>
    <text x="24" y="356" fill="#e6edf3">  Compose files: docker-compose.local.yml</text>
    <text x="24" y="376" fill="#3fb950">└─────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="396" fill="#484f58">  ▶ docker compose --env-file .env.local --project-name ci-hub -f docker-compose.local.yml up -d --build</text>
    <text x="24" y="416" fill="#e6edf3">Hub stack started.</text>
    <text x="24" y="456" fill="#7ee787">$ cihub shutdown local</text>
    <text x="24" y="476" fill="#b08800">┌─ Shutting down hub ─────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="496" fill="#e6edf3">  Environment: local</text>
    <text x="24" y="516" fill="#b08800">└─────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="536" fill="#484f58">  ▶ docker compose --env-file .env.local --project-name ci-hub -f docker-compose.local.yml down</text>
    <text x="24" y="556" fill="#e6edf3">Hub stack stopped.</text>
  </g>
</svg>
