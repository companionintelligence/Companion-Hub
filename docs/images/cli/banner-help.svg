<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">CLI banner preview from cihub --help</title>
  <desc id="desc">Zoomed terminal capture showing the Companion Intelligence ASCII art banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1040" height="40" rx="18" fill="#161b22"/>
  <rect x="0" y="22" width="1040" height="18" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="520.0" y="25" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">banner-help</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" xml:space="preserve">
    <text x="32" y="74" fill="#7ee787" font-size="17">$ cihub --help</text><text x="32" y="110" fill="#3fb950" font-size="19"> __   __         __               __                 </text><text x="32" y="138" fill="#3fb950" font-size="19">/  ` /  \  |\/| |__)  /\  |\ | | /  \ |\ |           </text><text x="32" y="166" fill="#3fb950" font-size="19">\__, \__/  |  | |    /~~\ | \| | \__/ | \|           </text><text x="32" y="194" fill="#0d1117" font-size="19">                                                     </text><text x="32" y="222" fill="#3fb950" font-size="19">       ___  ___              __   ___       __   ___ </text><text x="32" y="250" fill="#3fb950" font-size="19">| |\ |  |  |__  |    |    | / _` |__  |\ | /  ` |__  </text><text x="32" y="278" fill="#3fb950" font-size="19">| | \|  |  |___ |___ |___ | \__> |___ | \| \__, |___ </text><text x="32" y="316" fill="#e6edf3" font-size="16">Companion Intelligence branding stays readable before the command reference.</text><text x="32" y="344" fill="#8b949e" font-size="14">Quick start • wizard • MCP • app lifecycle</text>
