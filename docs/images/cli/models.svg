<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal captures for cihub models list and models install</desc>
  <rect width="900" height="420" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="900" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">models</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="56"  fill="#7ee787">$ cihub models list</text>
    <text x="24" y="76"  fill="#30363d">┌─ Installed models ──────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="96"  fill="#e6edf3">  Container: ci-hub-ollama</text>
    <text x="24" y="116" fill="#30363d">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="136" fill="#484f58">  ▶ docker exec ci-hub-ollama ollama list</text>
    <text x="24" y="156" fill="#e6edf3">NAME                   ID              SIZE    MODIFIED</text>
    <text x="24" y="176" fill="#e6edf3">llama3:latest          365c0bd3c000    4.7 GB  2 days ago</text>
    <text x="24" y="196" fill="#e6edf3">mistral:latest         61e88e884507    4.1 GB  5 days ago</text>
    <text x="24" y="216" fill="#e6edf3">phi3:latest            4f2222927938    2.3 GB  1 week ago</text>
    <text x="24" y="256" fill="#7ee787">$ cihub models install codestral</text>
    <text x="24" y="276" fill="#3fb950">┌─ Installing model ──────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="296" fill="#e6edf3">  Pulling codestral via Ollama — this may take a few minutes…</text>
    <text x="24" y="316" fill="#3fb950">└────────────────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="24" y="336" fill="#484f58">  ▶ docker exec -it ci-hub-ollama ollama pull codestral</text>
    <text x="24" y="356" fill="#e6edf3">pulling manifest...</text>
    <text x="24" y="376" fill="#e6edf3">pulling d7b23a42b423... 100% ▕████████████████▏ 18.8 GB</text>
    <text x="24" y="396" fill="#3fb950">success</text>
  </g>
</svg>
