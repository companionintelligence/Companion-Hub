<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">CI-Hub CLI screenshot</title>
  <desc id="desc">Terminal capture for cihub setup local</desc>
  <rect width="800" height="240" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="800" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="800" height="14" fill="#161b22"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="400" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">setup</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="56"  fill="#7ee787">$ cihub setup local</text>
    <text x="24" y="76"  fill="#484f58">  ▶ tsx scripts/init-traefik.ts</text>
    <text x="24" y="96"  fill="#e6edf3">Traefik config initialized.</text>
    <text x="24" y="116" fill="#484f58">  ▶ tsx scripts/init-docker-config.ts</text>
    <text x="24" y="136" fill="#e6edf3">Docker auth config initialized.</text>
    <text x="24" y="156" fill="#3fb950">┌─ Setup complete ────────────────────────────────────────────────────────────────┐</text>
    <text x="24" y="176" fill="#e6edf3">  Host assets prepared for local.</text>
    <text x="24" y="196" fill="#e6edf3">  Next: cihub register local</text>
    <text x="24" y="216" fill="#3fb950">└─────────────────────────────────────────────────────────────────────────────────┘</text>
  </g>
</svg>
