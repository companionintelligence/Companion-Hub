version: '3.8'

services:
  db:
    image: postgres:14
    command: -p 6543
    ports:
      - 6543
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: companion
      POSTGRES_DB: companiondb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d companiondb -U companion -p 6543"]
      interval: 5s
      timeout: 10s
      retries: 120

  queue:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: companion
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - 5672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 120

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    ports:
      - 9091
      - 3000
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 6543
      POSTGRES_USERNAME: companion
      POSTGRES_PASSWORD: postgres
      POSTGRES_DBNAME: companiondb
      RABBITMQ_HOST: queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: companion
      RABBITMQ_PASSWORD: admin
      TIPI_DATA_DIR: /data
      ROOT_FOLDER_HOST: /tmp/runtipi-e2e
      JWT_SECRET: test-secret
      CI_CLOUD_API_URL: http://non-existent-service:3000
      CI_CLOUD_FRONTEND_URL: http://non-existent-service:3000
      CI_CLOUD_APP_STORE_URL: http://non-existent-service:3000/api
      APPS_REPO_URL: https://github.com/companionintelligence/CI-App-Store
      APPS_REPO_ID: repo-id
      DOMAIN: ci.computer
      LOCAL_DOMAIN: ci.lan
      TIPI_VERSION: 9.9.9
      E2E_TEST: true
      DEVICE_ID: test-device-e2e
    volumes:
      - /data
      - /var/run/docker.sock:/var/run/docker.sock
