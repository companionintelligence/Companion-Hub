# Pull a prebuilt Hub image instead of building from source (no NODE_AUTH_TOKEN needed).
# Layered on for any env (dev/staging/prod) whose env file sets CI_HUB_IMAGE — see
# getComposeFiles() in scripts/lib/cli-compose-env.ts.
services:
  ci-hub:
    image: ${CI_HUB_IMAGE:-ghcr.io/companionintelligence/ci-hub:latest}
    pull_policy: if_not_present
    build: !reset null
    secrets: !reset []
