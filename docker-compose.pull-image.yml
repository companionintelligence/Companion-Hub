# Overlay used only by `cihub pool update` (see scripts/lib/cli-pool-update.ts).
#
# docker-compose.prod.yml declares the ci-hub service `build:`-only — no `image:` at all — so
# `docker compose pull` has nothing to fetch there and `up` falls back to a from-source build,
# which needs a GitHub Packages token most fleet nodes don't have. docker-compose.dev-image.yml
# already solves this the same way, but only for `env=dev`; every real fleet node runs `prod`.
#
# `pull_policy: always` is deliberate, not `if_not_present`: CI_HUB_IMAGE names a mutable,
# CI-repushed tag (ghcr.io/companionintelligence/ci-hub:dev, updated on every merge), and
# `if_not_present` would keep serving whatever was cached on first pull forever.
services:
  ci-hub:
    image: ${CI_HUB_IMAGE}
    pull_policy: always
    build: !reset null
    secrets: !reset []
