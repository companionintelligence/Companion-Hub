services:
  ci-hub-db:
    container_name: ci-hub-db
    image: postgres:14
    pull_policy: if_not_present
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
      - ci_hub_pgdata:/var/lib/postgresql/data
    command: -p 6543
    ports:
      - 6543:6543
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: companion
      POSTGRES_DB: companiondb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d companiondb -U companion -p 6543"]
      interval: 5s
      timeout: 10s
      retries: 120
    networks:
      - ci_os_hub_network

  ci-os-hub-queue:
    container_name: ci-os-hub-queue
    image: rabbitmq:4-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s
    ports:
      - 5672:5672
    environment:
      RABBITMQ_DEFAULT_USER: companion
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - ci_os_hub_network

  ci-os-hub:
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx turbo run dev --filter backend --filter frontend --filter @ci-hub/common
    depends_on:
      ci-hub-db:
        condition: service_healthy
      ci-os-hub-queue:
        condition: service_healthy
    container_name: ci-os-hub
    restart: unless-stopped
    healthcheck:
      start_period: 30s
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - 3000:3000
      - 9091:9091
    volumes:
      # Hot reload
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/common/src:/app/packages/common/src
      # Migrations
      - ./packages/backend/src/core/database/drizzle:/app/assets/migrations
      # Data
      - .internal/media:/data/media
      - .internal/state:/data/state
      - .internal/repos:/data/repos
      - ../CI-App-Store:/data/repos/migrated
      - .internal/apps:/data/apps
      - .internal/logs:/data/logs
      - .internal/user-config:/data/user-config
      - .internal/app-data:/app-data
      - .internal/backups:/data/backups
      # Static
      - ${ENV_FILE:-.env}:/data/.env
      - ./.internal/cache:/cache
      - ./docker-compose.local.yml:/data/docker-compose.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      - ci_os_hub_network
    environment:
      LOCAL: true
      NODE_ENV: development
      ROOT_FOLDER_HOST: ${PWD}/.internal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USERNAME: companion
      POSTGRES_DBNAME: companiondb
      RABBITMQ_USERNAME: companion
      RABBITMQ_PASSWORD: admin
      RABBITMQ_HOST: ci-os-hub-queue
      INTERNAL_IP: 127.0.0.1
      CI_HUB_VERSION: 4.5.0
      LOG_LEVEL: debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    labels:
      # ---- General ----- #
      ci-hub.managed: true

  # Cloudflare tunnel for dev — opt-in via: docker compose --profile cloudflare up cloudflared -d
  # Also attached to ci-server network so memory-test-amd (CI server gateway) is reachable at ci-server-gateway-1:8642
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    pull_policy: if_not_present
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run --token-file /home/nonroot/.cloudflared/token
    volumes:
      - ./tunnel:/home/nonroot/.cloudflared:ro
    networks:
      - ci_os_hub_network
      - ci_server_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - cloudflare

networks:
  ci_os_hub_network:
    driver: bridge
    name: ci-os-hub_network
  ci_server_network:
    external: true
    name: ci-server_ci

volumes:
  ci_hub_pgdata:
