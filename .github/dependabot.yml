version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 7.76 changed how isDirty follows dirtyFields (react-hook-form#13370). The install form
      # re-seeds on !isDirty and prefills app_base_url from dirtyFields, and two of its tests fail
      # on 7.76+. Lift this once the form is adapted.
      - dependency-name: 'react-hook-form'
        versions: ['>=7.76.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'

  # Rust/Tauri desktop app crates
  - package-ecosystem: 'cargo'
    directory: '/packages/desktop/src-tauri'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  # Rust/Tauri mobile app crates
  - package-ecosystem: 'cargo'
    directory: '/packages/mobile/src-tauri'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  # Isolated agent npm tree (not in the pnpm workspace)
  - package-ecosystem: 'npm'
    directory: '/agent'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
