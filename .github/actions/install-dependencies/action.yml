name: Install dependencies

description: Install dependencies

inputs:
  node-auth-token:
    description: Unused. Kept so existing callers still pass. The Hub no longer installs private @companionintelligence packages.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      name: Install Node.js
      with:
        node-version: "22"

    - uses: pnpm/action-setup@v4
      name: Install pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
