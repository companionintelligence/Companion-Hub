name: 'Dependency Review'

# Scans dependency manifests changed in a PR for known-vulnerable
# packages and blocks the merge when a high-or-worse advisory is found.
# CASA Tier 2 / SOC 2 evidence: recurring dependency vulnerability scanning.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
