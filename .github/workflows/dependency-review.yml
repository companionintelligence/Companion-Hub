name: 'Dependency Review'

# Scans dependency manifests changed in a PR for known-vulnerable
# packages and blocks the merge when a high-or-worse advisory is found.
# CASA Tier 2 / SOC 2 evidence: recurring dependency vulnerability scanning.
#
# Requires GitHub Advanced Security (dependency graph + dependency review).
# When GHAS is not enabled, the review step is skipped with a warning so
# PR checks stay green while the workflow remains wired for later enablement.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Note when GHAS is unavailable
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning::Dependency review requires GitHub Advanced Security (dependency graph + dependency review). Enable it under Settings → Code security and analysis. This check is wired but non-blocking until then."
