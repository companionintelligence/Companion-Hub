name: Integraton tests
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   workflow_call:
#   pull_request:
#   push:
#     branches:
#       - dev
# <<< ci-local:gated
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        env:
          POSTGRES_TEST_IMAGE: public.ecr.aws/docker/library/postgres:14
          RABBITMQ_TEST_IMAGE: public.ecr.aws/docker/library/rabbitmq:4-alpine
        run: pnpm run test:integration
