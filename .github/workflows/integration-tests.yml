name: Integraton tests
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          PGPORT: 6543
          POSTGRES_INITDB_ARGS: '--pgport=6543'
        ports:
          - 5433:6543
        options: >-
          --health-cmd "pg_isready -p 6543"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Run integration tests
        run: bun run test:integration
