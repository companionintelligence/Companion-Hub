name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: true
        type: boolean
      environment:
        description: "Target environment"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production
      platforms:
        description: "Platforms to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos-only

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.platforms == 'all' || startsWith(matrix.label, 'macOS') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux (ARM64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || '' }}
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && 'true' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        env:
          NODE_ENV: production
        run: |
          bun run --filter=@ci-hub/common build
          bun run --filter=frontend build

      - name: Set environment config
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "CI_HUB_DOMAIN=ci.computer" >> $GITHUB_ENV
            echo "CI_HUB_CLOUD_URL=https://portal.ci.computer" >> $GITHUB_ENV
            echo "CI_HUB_BUILD_VERSION=4.7.0" >> $GITHUB_ENV
          elif [ "${{ inputs.environment }}" = "staging" ]; then
            echo "CI_HUB_DOMAIN=companionintel.com" >> $GITHUB_ENV
            echo "CI_HUB_CLOUD_URL=https://portal.companionintel.com" >> $GITHUB_ENV
            echo "CI_HUB_BUILD_VERSION=4.7.0" >> $GITHUB_ENV
          else
            echo "CI_HUB_DOMAIN=companionintelligence.com" >> $GITHUB_ENV
            echo "CI_HUB_CLOUD_URL=https://portal.companionintelligence.com" >> $GITHUB_ENV
            echo "CI_HUB_BUILD_VERSION=4.7.0" >> $GITHUB_ENV
          fi

      # ── macOS Code Signing ──────────────────────────────────────────
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm certificate.p12

      - name: Build Tauri app (signed)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        env:
          # macOS signing — Tauri reads these automatically (only meaningful on macOS)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd packages/desktop
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Tauri app
        if: runner.os != 'macOS' || env.APPLE_SIGNING_CONFIGURED != 'true'
        run: |
          cd packages/desktop
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

      # ── macOS Notarization ──────────────────────────────────────────
      - name: Notarize macOS DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          DMG_PATH=$(find packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$DMG_PATH" ]; then
            echo "Notarizing $DMG_PATH..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 600
            xcrun stapler staple "$DMG_PATH"
            echo "✅ Notarization complete"
          fi

      # ── Windows Code Signing (Azure Trusted Signing) ────────────────
      - name: Sign Windows artifacts
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-depth: 3
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Collect release artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-artifacts

          # macOS
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          fi

          # Linux
          if [ -d "$BUNDLE_DIR/deb" ]; then
            cp "$BUNDLE_DIR"/deb/*.deb release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/rpm" ]; then
            cp "$BUNDLE_DIR"/rpm/*.rpm release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/appimage" ]; then
            cp "$BUNDLE_DIR"/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          fi

          # Windows
          if [ -d "$BUNDLE_DIR/msi" ]; then
            cp "$BUNDLE_DIR"/msi/*.msi release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/nsis" ]; then
            cp "$BUNDLE_DIR"/nsis/*-setup.exe release-artifacts/ 2>/dev/null || true
          fi

          echo "=== Release artifacts ==="
          ls -lh release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect all files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} release-files/ \;
          echo "=== All release files ==="
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Companion Hub Desktop ${{ inputs.tag }}${{ inputs.environment == 'production' && '' || format(' ({0})', inputs.environment) }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Companion Hub Desktop ${{ inputs.tag }}

            ### Downloads

            | Platform | Installer | Notes |
            |---|---|---|
            | **Windows (x64)** | `.msi` or `-setup.exe` | Recommended for most Windows users |
            | **macOS (Apple Silicon)** | `.dmg` | M1/M2/M3/M4 Macs |
            | **macOS (Intel)** | `.dmg` | Older Intel-based Macs |
            | **Linux (x64)** | `.deb`, `.rpm`, or `.AppImage` | Ubuntu/Debian, Fedora/RHEL, or universal |
            | **Linux (ARM64)** | `.deb`, `.rpm`, or `.AppImage` | Raspberry Pi, ARM servers |

            ### Requirements
            - Docker must be installed and running
            - Windows: Windows 10+ with WebView2 (ships with Windows 11)
            - macOS: macOS 11.0+
            - Linux: WebKitGTK 4.1
