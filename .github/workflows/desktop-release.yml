name: Desktop Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - production
      platforms:
        description: 'Platforms to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-only
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build-container:
    name: Build Hub Container
    uses: ./.github/workflows/build-container.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  build:
    needs: build-container
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux (ARM64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: Windows (ARM64)
    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    env:
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || '' }}
      # Sentry symbol/sourcemap upload runs only when SENTRY_AUTH_TOKEN is set, and
      # also needs repo/org variables SENTRY_ORG, SENTRY_FRONTEND_PROJECT and
      # SENTRY_DESKTOP_PROJECT. Uploads are best-effort (continue-on-error) and
      # never fail a release.
      SENTRY_SYMBOLS_ENABLED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && 'true' || '' }}
      # Windows signing uses GitHub OIDC + Azure login + Azure Artifact Signing.
      # Required environment secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID,
      # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE.
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CERTIFICATE_PROFILE != '' && 'true' || '' }}
      BUILD_ENABLED: ${{ inputs.platforms == 'all' || startsWith(matrix.label, 'macOS') }}
    steps:
      - name: Checkout
        if: env.BUILD_ENABLED
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install Rust (stable)
        if: env.BUILD_ENABLED
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        if: env.BUILD_ENABLED
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
      - name: Install Linux dependencies
        if: env.BUILD_ENABLED && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            rpm \
            xdg-utils
      - name: Install pnpm
        if: env.BUILD_ENABLED
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        if: env.BUILD_ENABLED
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Bun
        if: env.BUILD_ENABLED
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        if: env.BUILD_ENABLED
        run: pnpm install --frozen-lockfile
      - name: Set environment config
        if: env.BUILD_ENABLED
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            {
              echo "CI_CLOUD_URL=https://hub.ci.computer"
              echo "CI_HUB_CLOUD_URL=https://hub.ci.computer"
              echo "CI_HUB_DOMAIN=companionintelligence.com"
            } >> "$GITHUB_ENV"
          else
            {
              echo "CI_CLOUD_URL=https://hub.companionintelligence.com"
              echo "CI_HUB_CLOUD_URL=https://hub.companionintelligence.com"
              echo "CI_HUB_DOMAIN=companionintelligence.com"
            } >> "$GITHUB_ENV"
          fi
          {
            echo "CI_HUB_ENVIRONMENT=${{ inputs.environment }}"
            echo "CI_HUB_BUILD_VERSION=${{ inputs.tag }}"
          } >> "$GITHUB_ENV"
      - name: Build frontend
        if: env.BUILD_ENABLED
        env:
          NODE_ENV: production
          CI_CLOUD_URL: ${{ env.CI_CLOUD_URL }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
          VITE_SENTRY_RELEASE: ci-hub-frontend@${{ inputs.tag }}
          # Emit production source maps only when we will upload them to Sentry.
          VITE_BUILD_SOURCEMAPS: ${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '' }}
        run: |
          pnpm run --filter=@ci-hub/common build
          pnpm run --filter=frontend build
      - name: Build standalone Companion Hub CLI
        if: env.BUILD_ENABLED
        shell: bash
        run: |
          CLI_OUT="packages/desktop/src-tauri/resources/cihub"
          if [ "${{ runner.os }}" = "Windows" ]; then
            CLI_OUT="${CLI_OUT}.exe"
          fi
          node scripts/build-standalone-cli.cjs --target "${{ matrix.target }}" --outfile "$CLI_OUT" --bundle-resource
          ls -lh "$CLI_OUT"
      - name: Upload frontend source maps to Sentry
        if: env.BUILD_ENABLED && env.SENTRY_SYMBOLS_ENABLED
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_FRONTEND_PROJECT }}
        run: |
          # Best-effort per command: under `bash -eo pipefail` a sentry-cli
          # failure would otherwise abort the step before the deletion below,
          # leaving raw .map files to be embedded in the shipped desktop bundle.
          # Always strip the maps regardless of the upload result.
          DIST="packages/frontend/dist/client"
          npx --yes @sentry/cli@2 sourcemaps inject "$DIST" || echo "::warning::sentry sourcemaps inject failed"
          npx --yes @sentry/cli@2 sourcemaps upload \
            --release "ci-hub-frontend@${{ inputs.tag }}" "$DIST" || echo "::warning::sentry sourcemaps upload failed"
          find "$DIST" -name '*.map' -delete
      - name: Bump Tauri version to match release tag
        if: env.BUILD_ENABLED
        shell: bash
        run: |
          SEMVER="${{ inputs.tag }}"
          SEMVER="${SEMVER#v}"
          echo "Setting Tauri version to $SEMVER"
          # Update tauri.conf.json
          cd packages/desktop
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$SEMVER';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          # Update Cargo.toml
          sed -i'' -e 's/^version = ".*"/version = "'"$SEMVER"'"/' src-tauri/Cargo.toml
          echo "tauri.conf.json: $(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"
          echo "Cargo.toml: $(grep '^version' src-tauri/Cargo.toml | head -1)"
      # ── macOS Code Signing ──────────────────────────────────────────
      - name: Import Apple certificate
        if: env.BUILD_ENABLED && runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm certificate.p12
      - name: Sign bundled macOS CLI resource
        if: env.BUILD_ENABLED && runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          CLI_OUT="packages/desktop/src-tauri/resources/cihub"
          chmod 755 "$CLI_OUT"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime "$CLI_OUT"
          codesign --verify --verbose=2 "$CLI_OUT"
      - name: Build Tauri app (signed)
        if: env.BUILD_ENABLED && runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        env:
          # CI sets CI=true; tauri-bundler would skip DMG background/layout without this (tauri#592).
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          # macOS signing — Tauri reads these automatically (only meaningful on macOS)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
        run: |
          cd packages/desktop
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Tauri app
        if: env.BUILD_ENABLED && (runner.os != 'macOS' || env.APPLE_SIGNING_CONFIGURED != 'true')
        env:
          # CI sets CI=true; tauri-bundler would skip DMG background/layout without this (tauri#592).
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || '' }}
          # Ad-hoc sign on macOS when no Apple certificate is configured
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
        shell: bash
        run: |
          cd packages/desktop
          base_args=(--target "${{ matrix.target }}" -c '{"bundle":{"createUpdaterArtifacts":false}}')

          # Tauri downloads external bundling tools from GitHub at bundle time
          # (linuxdeploy/AppRun for the Linux AppImage, the WiX toolset for the
          # Windows MSI) and routinely hits transient HTTP 5xx (e.g. 504), which
          # previously failed the whole release. Retry the bundle step; the Rust
          # compile is already cached, so each retry only re-attempts the
          # download/bundle, and a genuine outage still fails after retries.
          retry_build() {
            local attempts=5 attempt backoff
            for attempt in $(seq 1 "$attempts"); do
              if npx --yes @tauri-apps/cli@2 build "$@"; then
                return 0
              fi
              if [[ "$attempt" -eq "$attempts" ]]; then
                echo "::error::tauri build failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              backoff=$((attempt * 20))
              echo "::warning::tauri build failed (attempt ${attempt}/${attempts}); retrying in ${backoff}s" >&2
              sleep "$backoff"
            done
          }

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # The required Linux desktop release artifacts are deb/rpm only.
            # AppImage is excluded here because linuxdeploy on GitHub ARM runners
            # is flaky enough to break otherwise successful ARM64 releases.
            npx --yes @tauri-apps/cli@2 build "${base_args[@]}" -b deb,rpm
            sh scripts/patch-deb-maintainer-scripts.sh
          else
            retry_build "${base_args[@]}"
          fi
      # ── macOS Notarization ──────────────────────────────────────────
      - name: Notarize macOS DMG
        if: env.BUILD_ENABLED && runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          DMG_PATH=$(find packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$DMG_PATH" ]; then
            echo "Notarizing $DMG_PATH..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 600
            xcrun stapler staple "$DMG_PATH"
            echo "✅ Notarization complete"
          fi
      # ── Windows Code Signing (Azure Artifact Signing via GitHub OIDC) ──
      # See docs/DESKTOP-RELEASE-SIGNING.md for the exact Azure IDs, secrets, and
      # federated credential subjects this workflow expects.
      - name: Prepare Windows signing paths
        if: env.BUILD_ENABLED && runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $bundleDir = (Resolve-Path "packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle").Path
          "WINDOWS_BUNDLE_DIR=$bundleDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Azure login for Artifact Signing
        if: env.BUILD_ENABLED && runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows artifacts
        if: env.BUILD_ENABLED && runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ env.WINDOWS_BUNDLE_DIR }}
          files-folder-filter: exe,msi
          files-folder-recurse: true
          files-folder-depth: 3
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Upload desktop debug symbols to Sentry
        if: env.BUILD_ENABLED && env.SENTRY_SYMBOLS_ENABLED
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
        run: |
          # Upload native debug info so Rust panics/crashes symbolicate in Sentry.
          # Captures Windows PDBs plus any dSYM/DWARF present. NOTE: the release
          # profile sets strip=true, so macOS/Linux symbol coverage is limited;
          # set split-debuginfo or relax strip for full native symbolication.
          npx --yes @sentry/cli@2 debug-files upload --include-sources \
            "packages/desktop/src-tauri/target/${{ matrix.target }}/release" || true
      - name: Collect release artifacts
        if: env.BUILD_ENABLED
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-artifacts
          # macOS
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          fi
          # Linux
          if [ -d "$BUNDLE_DIR/deb" ]; then
            cp "$BUNDLE_DIR"/deb/*.deb release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/rpm" ]; then
            cp "$BUNDLE_DIR"/rpm/*.rpm release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/appimage" ]; then
            cp "$BUNDLE_DIR"/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          fi
          # Windows
          if [ -d "$BUNDLE_DIR/msi" ]; then
            cp "$BUNDLE_DIR"/msi/*.msi release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/nsis" ]; then
            cp "$BUNDLE_DIR"/nsis/*-setup.exe release-artifacts/ 2>/dev/null || true
          fi
          echo "=== Release artifacts ==="
          ls -lh release-artifacts/
      - name: Upload release artifacts
        if: env.BUILD_ENABLED
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false
      - name: Collect all files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} release-files/ \;
          echo "=== All release files ==="
          ls -lh release-files/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Companion Hub Desktop ${{ inputs.tag }}${{ inputs.environment != 'production' && format(' ({0})', inputs.environment) || '' }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Companion Hub Desktop ${{ inputs.tag }}
            ### Downloads
            | Platform | Installer | Notes |
            |---|---|---|
            | **Windows (x64)** | `.msi` or `-setup.exe` | Recommended for most Windows users |
            | **Windows (ARM64)** | `.msi` or `-setup.exe` | Windows on ARM (Snapdragon and other ARM64 PCs) |
            | **macOS (Apple Silicon)** | `.dmg` | M1/M2/M3/M4 Macs |
            | **macOS (Intel)** | `.dmg` | Older Intel-based Macs |
            | **Linux (x64)** | `.deb` or `.rpm` | Ubuntu/Debian or Fedora/RHEL |
            | **Linux (ARM64)** | `.deb` or `.rpm` | Raspberry Pi, ARM servers |
            ### Requirements
            - Docker must be installed and running
            - Windows: Windows 10+ with WebView2 (ships with Windows 11)
            - macOS: macOS 11.0+
            - Linux: WebKitGTK 4.1

  upload-r2:
    if: inputs.environment == 'production'
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_DL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          BUCKET="dl-prod"
          VERSION="${{ inputs.tag }}"

          upload() { wrangler r2 object put --remote "$BUCKET/$1" --file "$2"; }

          # macOS
          for f in artifacts/release-aarch64-apple-darwin/*.dmg; do
            [ -f "$f" ] && upload "$VERSION/macos/arm/$(basename "$f")" "$f"
          done
          for f in artifacts/release-x86_64-apple-darwin/*.dmg; do
            [ -f "$f" ] && upload "$VERSION/macos/intel/$(basename "$f")" "$f"
          done

          # Windows x64
          for f in artifacts/release-x86_64-pc-windows-msvc/*.msi; do
            [ -f "$f" ] && upload "$VERSION/windows/x64/$(basename "$f")" "$f"
          done
          for f in artifacts/release-x86_64-pc-windows-msvc/*-setup.exe; do
            [ -f "$f" ] && upload "$VERSION/windows/x64/$(basename "$f")" "$f"
          done

          # Windows ARM64
          for f in artifacts/release-aarch64-pc-windows-msvc/*.msi; do
            [ -f "$f" ] && upload "$VERSION/windows/arm64/$(basename "$f")" "$f"
          done
          for f in artifacts/release-aarch64-pc-windows-msvc/*-setup.exe; do
            [ -f "$f" ] && upload "$VERSION/windows/arm64/$(basename "$f")" "$f"
          done

          # Linux x64
          for f in artifacts/release-x86_64-unknown-linux-gnu/*.deb; do
            [ -f "$f" ] && upload "$VERSION/linux/deb/x64/$(basename "$f")" "$f"
          done
          for f in artifacts/release-x86_64-unknown-linux-gnu/*.rpm; do
            [ -f "$f" ] && upload "$VERSION/linux/rpm/x64/$(basename "$f")" "$f"
          done
          # Linux ARM64
          for f in artifacts/release-aarch64-unknown-linux-gnu/*.deb; do
            [ -f "$f" ] && upload "$VERSION/linux/deb/arm/$(basename "$f")" "$f"
          done
          for f in artifacts/release-aarch64-unknown-linux-gnu/*.rpm; do
            [ -f "$f" ] && upload "$VERSION/linux/rpm/arm/$(basename "$f")" "$f"
          done

      - name: Generate and upload manifest.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_DL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          BUCKET="dl-prod"
          VERSION="${{ inputs.tag }}"
          SEMVER="${VERSION#v}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          node -e "
          const fs = require('fs');
          const path = require('path');
          const manifest = {
            version: '$SEMVER',
            date: '$DATE',
            platforms: {}
          };

          const mappings = [
            ['windows-x86_64', 'release-x86_64-pc-windows-msvc', { msi: '.msi', exe: '-setup.exe' }],
            ['windows-aarch64', 'release-aarch64-pc-windows-msvc', { msi: '.msi', exe: '-setup.exe' }],
            ['darwin-aarch64', 'release-aarch64-apple-darwin', { dmg: '.dmg' }],
            ['darwin-x86_64', 'release-x86_64-apple-darwin', { dmg: '.dmg' }],
            ['linux-x86_64', 'release-x86_64-unknown-linux-gnu', { deb: '.deb', rpm: '.rpm' }],
            ['linux-aarch64', 'release-aarch64-unknown-linux-gnu', { deb: '.deb', rpm: '.rpm' }],
          ];

          for (const [platform, artifactDir, formats] of mappings) {
            const dir = path.join('artifacts', artifactDir);
            if (!fs.existsSync(dir)) continue;
            const files = fs.readdirSync(dir);
            const platformData = {};
            for (const [fmt, ext] of Object.entries(formats)) {
              const file = files.find(f => f.endsWith(ext));
              if (file) {
                const stat = fs.statSync(path.join(dir, file));
                const filePath = path.join(dir, file);
                const fileBuffer = fs.readFileSync(filePath);
                const sha256 = require('crypto').createHash('sha256').update(fileBuffer).digest('hex');
                const encodedFile = encodeURIComponent(file);
                let r2Path;
                if (platform === 'windows-aarch64') r2Path = 'windows/arm64';
                else if (platform.startsWith('windows')) r2Path = 'windows/x64';
                else if (platform === 'darwin-aarch64') r2Path = 'macos/arm';
                else if (platform === 'darwin-x86_64') r2Path = 'macos/intel';
                else if (platform === 'linux-x86_64') r2Path = 'linux/' + fmt + '/x64';
                else r2Path = 'linux/' + fmt + '/arm';
                platformData[fmt] = {
                  url: 'https://dl.ci.computer/$VERSION/' + r2Path + '/' + encodedFile,
                  size: stat.size,
                  sha256,
                };
              }
            }
            if (Object.keys(platformData).length > 0) {
              manifest.platforms[platform] = platformData;
            }
          }

          fs.writeFileSync('/tmp/manifest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          "

          wrangler r2 object put --remote "$BUCKET/$VERSION/manifest.json" --file /tmp/manifest.json

      - name: Update latest.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_DL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "{\"version\":\"${{ inputs.tag }}\",\"date\":\"${DATE}\"}" > /tmp/latest.json
          wrangler r2 object put --remote "dl-prod/latest.json" --file /tmp/latest.json

  finalize-release-page:
    if: inputs.environment == 'production' && !inputs.prerelease
    needs: [release, upload-r2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Finalize GitHub release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./.github/scripts/finalize-desktop-release.sh
