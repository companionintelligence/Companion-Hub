name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: true
        type: boolean

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux (ARM64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        env:
          NODE_ENV: production
        run: |
          bun run --filter=@ci-hub/common build
          bun run --filter=frontend build

      - name: Build Tauri app
        run: |
          cd packages/desktop
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect release artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-artifacts

          # macOS
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          fi

          # Linux
          if [ -d "$BUNDLE_DIR/deb" ]; then
            cp "$BUNDLE_DIR"/deb/*.deb release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/rpm" ]; then
            cp "$BUNDLE_DIR"/rpm/*.rpm release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/appimage" ]; then
            cp "$BUNDLE_DIR"/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          fi

          # Windows
          if [ -d "$BUNDLE_DIR/msi" ]; then
            cp "$BUNDLE_DIR"/msi/*.msi release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "$BUNDLE_DIR/nsis" ]; then
            cp "$BUNDLE_DIR"/nsis/*-setup.exe release-artifacts/ 2>/dev/null || true
          fi

          echo "=== Release artifacts ==="
          ls -lh release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect all files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} release-files/ \;
          echo "=== All release files ==="
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Companion Hub Desktop ${{ inputs.tag }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Companion Hub Desktop ${{ inputs.tag }}

            ### Downloads

            | Platform | Installer | Notes |
            |---|---|---|
            | **Windows (x64)** | `.msi` or `-setup.exe` | Recommended for most Windows users |
            | **macOS (Apple Silicon)** | `.dmg` | M1/M2/M3/M4 Macs |
            | **macOS (Intel)** | `.dmg` | Older Intel-based Macs |
            | **Linux (x64)** | `.deb`, `.rpm`, or `.AppImage` | Ubuntu/Debian, Fedora/RHEL, or universal |
            | **Linux (ARM64)** | `.deb`, `.rpm`, or `.AppImage` | Raspberry Pi, ARM servers |

            ### Requirements
            - Docker must be installed and running
            - Windows: Windows 10+ with WebView2 (ships with Windows 11)
            - macOS: macOS 11.0+
            - Linux: WebKitGTK 4.1
