name: Desktop Tests
# Auto-triggers are scoped to `packages/desktop/src-tauri/**` so this only burns
# Actions credit when the Rust crate actually changes (~62 commits/quarter).
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   workflow_dispatch:
#   pull_request:
#     paths:
#       - 'packages/desktop/src-tauri/**'
#       - '.github/workflows/desktop-tests.yml'
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST: packages/desktop/src-tauri/Cargo.toml

jobs:
  rust-tests:
    name: Rust unit tests (desktop)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            libglib2.0-dev

      - name: Formatting
        run: cargo fmt --manifest-path "$MANIFEST" --check

      # --all-targets is what compiles the `#[cfg(any(test, target_os = "..."))]`
      # installer-script generators on Linux. Without it they are never type-checked
      # here, and a dropped cfg only surfaces on the Windows/macOS bundle build.
      - name: Type check (all targets)
        run: cargo check --manifest-path "$MANIFEST" --all-targets

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Module size budget (advisory)
        continue-on-error: true
        run: packages/desktop/src-tauri/scripts/check-module-size.sh

      # Advisory only: ~20k lines have never been clippy-gated, so failing the build
      # on the existing backlog would mean permanently red CI. Tighten once the
      # backlog is burned down.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -W clippy::all
