name: Desktop Tests
# TEMPORARY (Actions credit): automatic PR/push triggers disabled.
# Re-enable when credits recover. Manual: gh workflow run desktop-tests.yml
on:
  workflow_dispatch:

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust unit tests (desktop)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Run tests
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
