name: Mobile Build

# Builds the Tauri mobile app (packages/mobile) for iOS + Android, the same way
# `desktop-build.yml` builds the desktop app.
#
# Manual/release-only. Previously also ran automatically on every push to `dev`
# touching mobile/frontend/common code — that auto-trigger is removed as of
# 2026-09-10, for the same reason as desktop-build.yml: CI-Hub's native runner
# minutes were the org's single largest GitHub Actions line (see
# CI-Engineering/architecture/cost-model.md §4.2). Run before cutting a
# release, or on demand to verify a mobile-affecting change builds:
#
#   gh workflow run mobile-build.yml --repo companionintelligence/CI-Hub --ref dev
#
# Artifacts (download from the run's Summary page):
#   - companion-hub-android-debug-apk  → installable APK (debug-signed; `adb install`)
#   - companion-hub-ios-sim-app        → iOS Simulator .app (drag onto a booted simulator)
#
# A distributable, store-ready Android AAB / iOS .ipa needs release signing
# secrets (Google Play upload key / Apple Developer cert + provisioning profile);
# see the "Release signing" section in packages/mobile/README.md.

on:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# Phone cloud-connect talks to production Portal. Do not inherit a developer
# `CI_CLOUD_URL=https://hub.companionintelligence.com` from `cihub up dev`.
env:
  CI_CLOUD_URL: https://hub.ci.computer
  CI_HUB_ENVIRONMENT: production

jobs:
  # ── Android ──────────────────────────────────────────────────────────────
  android:
    name: Build — Android (APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable) + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri -> target

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The Android Rust build (multi-ABI) + gradle + the Rust cache save can
      # exceed the ~14 GB free on the ubuntu runner. Reclaim ~15-20 GB of
      # preinstalled toolchains we don't use so the cache save doesn't ENOSPC.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/2[0-8].* || true
          sudo docker image prune -af || true
          df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NODE_ENV: production
          # Without a DSN, initHubSentry() no-ops and the artifact ships with
          # crash reporting inert (mirrors desktop-build.yml).
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
          VITE_SENTRY_RELEASE: ci-hub-frontend@${{ github.sha }}
        run: |
          pnpm run --filter=@ci-hub/common build
          pnpm run --filter=frontend build

      # `--debug` produces a debug-signed universal APK that installs on any
      # device/emulator without release keystore secrets. The mobile package's
      # gen/android project is committed, so no `tauri android init` is needed.
      # Build a universal APK for arm64 (phones + Apple-Silicon emulators) and
      # x86_64 (Intel emulators). Skipping the 32-bit ABIs (armv7/i686) halves
      # the Rust target size + build time — plenty for a test/QA artifact.
      - name: Build Android APK
        working-directory: packages/mobile
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK_HOME=$NDK_HOME"
          pnpm exec tauri android build --apk --debug --target aarch64 x86_64

      - name: List artifacts
        run: find packages/mobile/src-tauri/gen/android/app/build/outputs -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: companion-hub-android-debug-apk
          path: packages/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ── Android release AAB (Play upload) ────────────────────────────────────
  # Skipped entirely until the Play upload keystore secrets exist, so it never
  # reds the pipeline. Once set, this produces the signed .aab Play requires.
  # See packages/mobile/STORE-READINESS.md for generating the keystore.
  android-release:
    name: Build — Android (release AAB)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEY_BASE64 not set — skipping the release AAB. See packages/mobile/STORE-READINESS.md."
          fi

      - name: Checkout
        if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v6

      - name: Install Rust (stable) + Android targets
        if: steps.secrets.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        if: steps.secrets.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri -> target

      - name: Install JDK 17
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.secrets.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Free up disk space
        if: steps.secrets.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/2[0-8].* || true
          sudo docker image prune -af || true
          df -h /

      - name: Install pnpm
        if: steps.secrets.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.secrets.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.secrets.outputs.present == 'true'
        env:
          NODE_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
          VITE_SENTRY_RELEASE: ci-hub-frontend@${{ github.sha }}
        run: |
          pnpm run --filter=@ci-hub/common build
          pnpm run --filter=frontend build

      # keystore.properties is gitignored; build.gradle.kts picks it up and wires
      # signingConfigs.release automatically when present.
      - name: Write release keystore
        if: steps.secrets.outputs.present == 'true'
        working-directory: packages/mobile/src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > upload.keystore
          cat > keystore.properties <<EOF
          storeFile=upload.keystore
          storePassword=$ANDROID_KEY_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android AAB (signed)
        if: steps.secrets.outputs.present == 'true'
        working-directory: packages/mobile
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          pnpm exec tauri android build --aab --target aarch64 armv7 x86_64

      - name: Upload AAB
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: companion-hub-android-release-aab
          path: packages/mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  # ── iOS ──────────────────────────────────────────────────────────────────
  # Builds for the iOS Simulator (no code-signing required). The GitHub macOS
  # runners ship a stable Xcode, so the local swift-rs × Xcode-27 workaround
  # (see packages/mobile/README.md) is NOT needed here.
  ios:
    name: Build — iOS (Simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable) + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NODE_ENV: production
          # Without a DSN, initHubSentry() no-ops and the artifact ships with
          # crash reporting inert (mirrors desktop-build.yml).
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
          VITE_SENTRY_RELEASE: ci-hub-frontend@${{ github.sha }}
        run: |
          pnpm run --filter=@ci-hub/common build
          pnpm run --filter=frontend build

      # Simulator target → unsigned build, no Apple Developer account needed.
      # Tauri's post-build archive step is skipped for the simulator target; the
      # built .app lands in Xcode's DerivedData.
      - name: Build iOS app (simulator, unsigned)
        working-directory: packages/mobile
        run: pnpm exec tauri ios build --target aarch64-sim

      - name: Locate built .app
        id: findapp
        run: |
          APP="$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*Build/Products/*-iphonesimulator/*.app' -maxdepth 6 2>/dev/null | head -1)"
          # A build that produced no .app is a FAILED build, not an empty one.
          # This step used to just record an empty output, the upload was skipped
          # by `if: ... != ''`, and the job went green having shipped nothing --
          # indistinguishable from a real success. The ios-release lane below
          # already gets this right; this is the same guard.
          if [ -z "$APP" ]; then
            echo "::error::No iOS Simulator .app produced — check the build step log."
            exit 1
          fi
          echo "Found: $APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: companion-hub-ios-sim-app
          path: ${{ steps.findapp.outputs.app }}
          if-no-files-found: error

  # ── iOS release IPA (App Store Connect / TestFlight) ─────────────────────
  # Skipped entirely until the Apple signing secrets exist, so it never reds
  # the pipeline — same shape as `android-release` above. Once set, this
  # produces the signed .ipa that App Store Connect accepts.
  # See packages/mobile/STORE-READINESS.md for obtaining the cert + profile.
  ios-release:
    name: Build — iOS (release IPA)
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_CERTIFICATE_BASE64 / APPLE_DEVELOPMENT_TEAM not set — skipping the release IPA. See packages/mobile/STORE-READINESS.md."
          fi
          # TestFlight upload is independently optional: the IPA is still
          # produced and uploaded as an artifact without an ASC API key.
          if [ -n "${{ secrets.APPSTORE_API_KEY_ID }}" ]; then
            echo "testflight=true" >> "$GITHUB_OUTPUT"
          else
            echo "testflight=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPSTORE_API_KEY_ID not set — IPA will be built but not uploaded to TestFlight."
          fi

      - name: Checkout
        if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v6

      - name: Install Rust (stable) + iOS device target
        if: steps.secrets.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        if: steps.secrets.outputs.present == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri -> target

      - name: Install pnpm
        if: steps.secrets.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.secrets.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.secrets.outputs.present == 'true'
        env:
          NODE_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
          VITE_SENTRY_RELEASE: ci-hub-frontend@${{ github.sha }}
        run: |
          pnpm run --filter=@ci-hub/common build
          pnpm run --filter=frontend build

      # ASC requires CFBundleVersion to strictly increase per upload of a given
      # marketing version. `github.run_number` is monotonic per workflow, so it
      # is a valid build number and never repeats.
      #
      # NOTE: do NOT use tauri's `--build-number` flag here. It *appends* to the
      # app version, yielding `0.1.0.<n>` — four components. Apple allows a
      # CFBundleVersion of at most THREE period-separated integers, so ASC
      # rejects that build at upload (verified against a real archive).
      - name: Stamp version + build number
        if: steps.secrets.outputs.present == 'true'
        working-directory: packages/mobile
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/set-ios-version.mjs
          grep -E 'CFBundleShortVersionString|CFBundleVersion' src-tauri/gen/apple/project.yml

      # Certificate goes into a throwaway keychain scoped to this runner, so it
      # never touches the default login keychain and dies with the job.
      - name: Import signing certificate
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILES/build.mobileprovision"
          echo "Installed profile:"
          security cms -D -i "$PROFILES/build.mobileprovision" 2>/dev/null \
            | plutil -extract Name raw - 2>/dev/null || true

      - name: Build signed IPA (App Store)
        if: steps.secrets.outputs.present == 'true'
        working-directory: packages/mobile
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        run: |
          pnpm exec tauri ios build --ci \
            --target aarch64 \
            --export-method app-store-connect

      - name: Locate IPA
        if: steps.secrets.outputs.present == 'true'
        id: findipa
        run: |
          IPA="$(find packages/mobile/src-tauri/gen/apple/build -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced — check the build step log."
            exit 1
          fi
          echo "Found: $IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: companion-hub-ios-release-ipa
          path: ${{ steps.findipa.outputs.ipa }}
          if-no-files-found: error

      # Optional: hand the build straight to TestFlight. Needs an App Store
      # Connect API key (Users and Access ▸ Integrations ▸ App Store Connect API).
      # Without those three secrets the IPA is still available as an artifact
      # above and can be uploaded manually via Transporter.
      - name: Upload to TestFlight
        if: steps.secrets.outputs.present == 'true' && steps.secrets.outputs.testflight == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          KEYDIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f "${{ steps.findipa.outputs.ipa }}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
