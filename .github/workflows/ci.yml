name: Hub CI
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      # `pnpm run test` ends in `test:cli`, which now compiles and runs the standalone `cihub`
      # binary (scripts/__tests__/cli-binary-smoke.test.ts). That suite refuses to skip when CI is
      # set, so bun has to be installed here or the job fails — which is the intent.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Run biome tests
        run: pnpm run lint:ci

      - name: Run knip (unused files/deps)
        run: pnpm run knip:ci

      - name: Run tsc
        run: pnpm run tsc

      - name: Check OpenAPI drift
        run: pnpm run check:openapi

      - name: Run tests
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client
        run: pnpm run bundle
