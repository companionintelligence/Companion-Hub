name: Hub CI
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   workflow_call:
#   pull_request:
#   push:
#     branches:
#       - dev
# <<< ci-local:gated
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Run biome tests
        run: pnpm run lint:ci

      - name: Run knip (unused files/deps)
        run: pnpm run knip:ci

      - name: Run tsc
        run: pnpm run tsc

      - name: Check OpenAPI drift
        run: pnpm run check:openapi

      - name: Run tests
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build client
        run: pnpm run bundle
