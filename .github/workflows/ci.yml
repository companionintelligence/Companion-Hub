name: Hub CI
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   workflow_call:
#   workflow_dispatch:
#   pull_request:
#   push:
#     branches:
#       - dev
# <<< ci-local:gated
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      # `pnpm run test` ends in `test:cli`, which now compiles and runs the standalone `cihub`
      # binary (scripts/__tests__/cli-binary-smoke.test.ts). That suite refuses to skip when CI is
      # set, so bun has to be installed here or the job fails — which is the intent.
      - name: Install bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run biome tests
        run: pnpm run lint:ci

      - name: Run knip (unused files/deps)
        run: pnpm run knip:ci

      # Every workflow here is dispatched by hand, so nothing else runs these rules on a push.
      - name: Check workflow hygiene
        run: pnpm run check:workflows

      - name: Run tsc
        run: pnpm run tsc

      # Stays gated on the steps before it: `gen:swagger` compiles the backend, so after a tsc failure
      # it would only fail on the same type errors.
      - name: Check OpenAPI drift
        run: pnpm run check:openapi

      # Runs after a lint, knip, or tsc failure too, so a failing check cannot hide the test results.
      # `!cancelled()` rather than `always()` stops a run that a newer push cancels. The `Install bun`
      # outcome also stands for setup: that step is skipped unless checkout, Node, and dependencies succeeded.
      # CI-Marketplace checks listings with copies of the Hub's listing rules; this clone lets
      # common's marketplace-rules-parity test compare them with the Hub's own, and fail when a rule
      # changed here without the copy (CI_REQUIRE_MARKETPLACE turns a missing clone into a failure).
      # Anonymous: the marketplace is public. Its dev branch is what ships listings.
      - name: Fetch CI-Marketplace for the rules comparison
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        run: git clone --depth 1 --branch dev https://github.com/companionintelligence/ci-marketplace.git "$RUNNER_TEMP/ci-marketplace"

      - name: Run tests
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        env:
          CI_MARKETPLACE_DIR: ${{ runner.temp }}/ci-marketplace
          CI_REQUIRE_MARKETPLACE: "1"
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client
        run: pnpm run bundle
