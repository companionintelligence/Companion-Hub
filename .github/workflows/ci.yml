name: Hub CI
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      # `pnpm run test` ends in `test:cli`, which now compiles and runs the standalone `cihub`
      # binary (scripts/__tests__/cli-binary-smoke.test.ts). That suite refuses to skip when CI is
      # set, so bun has to be installed here or the job fails — which is the intent.
      - name: Install bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Run biome tests
        run: pnpm run lint:ci

      - name: Run knip (unused files/deps)
        run: pnpm run knip:ci

      - name: Run tsc
        run: pnpm run tsc

      # Stays gated on the steps before it: `gen:swagger` compiles the backend, so after a tsc failure
      # it would only fail on the same type errors.
      - name: Check OpenAPI drift
        run: pnpm run check:openapi

      # Runs after a lint, knip, or tsc failure too, so a failing check cannot hide the test results.
      # `!cancelled()` rather than `always()` stops a run that a newer push cancels. The `Install bun`
      # outcome also stands for setup: that step is skipped unless checkout, Node, and dependencies succeeded.
      - name: Run tests
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client
        run: pnpm run bundle
