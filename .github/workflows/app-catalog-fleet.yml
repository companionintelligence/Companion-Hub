name: App Catalog Fleet Tests
# OSS NOTE (companionintelligence/CI-Hub#1210): private lab hostnames + org
# Tailscale secrets. Exclude from the public tree before history squash.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full        # All apps across 10 servers
          - high-priority  # Only high priority apps
          - single-batch   # Single batch on single server
          - quick       # Quick smoke test (10 apps)
      batch:
        description: 'Batch number (0-9) for single-batch mode'
        required: false
        default: '0'
      server:
        description: 'Target server for single-batch mode'
        required: false
        default: 'core-1'
        type: choice
        options:
          - core-1
          - core-2
          - core-5
          - core-6
          - core-8
          - core-9
          - core-10
          - core-13
          - beta-1
          - beta-red

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fleet server Tailscale IPs — stored as GitHub Actions secrets (not hardcoded).
  # Add FLEET_<NAME>_IP under Settings → Secrets and variables → Actions.
  CORE_1_IP: ${{ secrets.FLEET_CORE_1_IP }}
  CORE_2_IP: ${{ secrets.FLEET_CORE_2_IP }}
  CORE_5_IP: ${{ secrets.FLEET_CORE_5_IP }}
  CORE_6_IP: ${{ secrets.FLEET_CORE_6_IP }}
  CORE_8_IP: ${{ secrets.FLEET_CORE_8_IP }}
  CORE_9_IP: ${{ secrets.FLEET_CORE_9_IP }}
  CORE_10_IP: ${{ secrets.FLEET_CORE_10_IP }}
  CORE_13_IP: ${{ secrets.FLEET_CORE_13_IP }}
  BETA_1_IP: ${{ secrets.FLEET_BETA_1_IP }}
  BETA_RED_IP: ${{ secrets.FLEET_BETA_RED_IP }}
  SSH_USER: ${{ secrets.FLEET_SSH_USER }}

jobs:
  prepare:
    name: Prepare Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_apps: ${{ steps.set-matrix.outputs.total_apps }}
    steps:
      - uses: actions/checkout@v6
      
      - id: set-matrix
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          
          if [[ "$MODE" == "full" ]] || [[ "$MODE" == "" ]]; then
            # Full fleet - all 10 online servers (IPs injected from env vars sourced from secrets)
            echo "matrix={\"include\":[
              {\"server\":\"core-1\",\"ip\":\"$CORE_1_IP\",\"batch\":0},
              {\"server\":\"core-2\",\"ip\":\"$CORE_2_IP\",\"batch\":1},
              {\"server\":\"core-5\",\"ip\":\"$CORE_5_IP\",\"batch\":2},
              {\"server\":\"core-6\",\"ip\":\"$CORE_6_IP\",\"batch\":3},
              {\"server\":\"core-8\",\"ip\":\"$CORE_8_IP\",\"batch\":4},
              {\"server\":\"core-9\",\"ip\":\"$CORE_9_IP\",\"batch\":5},
              {\"server\":\"core-10\",\"ip\":\"$CORE_10_IP\",\"batch\":6},
              {\"server\":\"core-13\",\"ip\":\"$CORE_13_IP\",\"batch\":7},
              {\"server\":\"beta-1\",\"ip\":\"$BETA_1_IP\",\"batch\":8},
              {\"server\":\"beta-red\",\"ip\":\"$BETA_RED_IP\",\"batch\":9}
            ]}" >> "$GITHUB_OUTPUT"
            echo "total_apps=126" >> "$GITHUB_OUTPUT"
            
          elif [[ "$MODE" == "high-priority" ]]; then
            # High priority apps only (9 apps, single server)
            echo "matrix={\"include\":[
              {\"server\":\"core-1\",\"ip\":\"$CORE_1_IP\",\"batch\":\"high\"}
            ]}" >> "$GITHUB_OUTPUT"
            echo "total_apps=9" >> "$GITHUB_OUTPUT"
            
          elif [[ "$MODE" == "single-batch" ]]; then
            SERVER="${{ github.event.inputs.server || 'core-1' }}"
            BATCH="${{ github.event.inputs.batch || '0' }}"
            
            # Map server to IP via env vars (values come from secrets)
            case "$SERVER" in
              core-1)  IP="$CORE_1_IP" ;;
              core-2)  IP="$CORE_2_IP" ;;
              core-5)  IP="$CORE_5_IP" ;;
              core-6)     IP="$CORE_6_IP" ;;
              core-8)     IP="$CORE_8_IP" ;;
              core-9)     IP="$CORE_9_IP" ;;
              core-10)    IP="$CORE_10_IP" ;;
              core-13)    IP="$CORE_13_IP" ;;
              beta-1)     IP="$BETA_1_IP" ;;
              beta-red)   IP="$BETA_RED_IP" ;;
            esac
            
            echo "matrix={\"include\":[{\"server\":\"$SERVER\",\"ip\":\"$IP\",\"batch\":$BATCH}]}" >> "$GITHUB_OUTPUT"
            echo "total_apps=13" >> "$GITHUB_OUTPUT"
            
          elif [[ "$MODE" == "quick" ]]; then
            # Quick smoke test - 10 essential apps on one server
            echo "matrix={\"include\":[
              {\"server\":\"core-1\",\"ip\":\"$CORE_1_IP\",\"batch\":\"quick\"}
            ]}" >> "$GITHUB_OUTPUT"
            echo "total_apps=10" >> "$GITHUB_OUTPUT"
          fi

  test-batch:
    name: Test Batch on ${{ matrix.server }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max per server
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.58.2

      - name: Verify connectivity
        run: |
          echo "Testing connection to ${{ matrix.server }} (${{ matrix.ip }})..."
          ping -c 3 "${{ matrix.ip }}"

      - name: Prepare test environment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@${{ matrix.ip }} << 'ENDSSH'
            # Update code to the workflow ref under test, not always dev.
            cd ~/devel/CI-Hub
            git fetch --quiet origin "${{ github.ref_name }}"
            git checkout --detach "${{ github.sha }}"
            git rev-parse --short HEAD
            
            # Install dependencies
            pnpm install --frozen-lockfile 2>/dev/null || pnpm install
            
            # Ensure directories exist
            mkdir -p e2e/screenshots/current e2e/screenshots/baselines e2e/results
            
            # Check Docker
            docker info > /dev/null 2>&1 || echo "Warning: Docker not accessible"
            
            # Check CI-Hub service
            systemctl --user status ci-hub 2>/dev/null || echo "Hub service not found"
          ENDSSH

      - name: Run catalog tests
        id: run-tests
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 "${{ env.SSH_USER }}@${{ matrix.ip }}" 'bash -s' << 'ENDSSH'
            cd ~/devel/CI-Hub
            
            # Set environment
            export BATCH='${{ matrix.batch }}'
            export TEST_DOMAIN=test.ci.computer
            export E2E_TEST_EMAIL=e2e-test@ci.computer
            E2E_TEST_PASSWORD="$(cat <<'__CI_HUB_E2E_PASSWORD__'
            ${{ secrets.E2E_TEST_PASSWORD }}
            __CI_HUB_E2E_PASSWORD__
            )"
            export E2E_TEST_PASSWORD
            mkdir -p e2e/results
            
            # Determine test file
            if [[ "$BATCH" == "high" ]]; then
              TEST_FILE="e2e/app-lifecycle.spec.ts"
            elif [[ "$BATCH" == "quick" ]]; then
              TEST_FILE="e2e/app-lifecycle.spec.ts"
              export QUICK_MODE=true
            else
              TEST_FILE="e2e/generated/catalog-batch-${BATCH}.spec.ts"
            fi
            
            echo "Running tests: \$TEST_FILE"
            echo "Batch: $BATCH"
            echo "Server: ${{ matrix.server }}"
            
            # Run Playwright tests with extended timeout
            export PLAYWRIGHT_JSON_OUTPUT_NAME=e2e/results/catalog-batch-${BATCH}.json
            E2E_RUN_CATALOG_TESTS=true pnpm exec playwright test \$TEST_FILE \
              --timeout=300000 \
              --reporter=json,html \
              --output=test-results-batch-${BATCH} \
              2>&1 || true
            
            # Generate summary
            if [ -f playwright-report/index.html ]; then
              echo "Tests completed - report generated"
            else
              echo "Warning: No report generated"
            fi
          ENDSSH

      - name: Collect results
        if: always()
        run: |
          BATCH="${{ matrix.batch }}"
          
          mkdir -p results-${{ matrix.server }}
          
          # Copy test results
          scp -o StrictHostKeyChecking=no -r \
            ${{ env.SSH_USER }}@${{ matrix.ip }}:~/devel/CI-Hub/test-results-batch-${BATCH} \
            results-${{ matrix.server }}/ 2>/dev/null || true

          # Copy JSON summary
          scp -o StrictHostKeyChecking=no \
            ${{ env.SSH_USER }}@${{ matrix.ip }}:~/devel/CI-Hub/e2e/results/catalog-batch-${BATCH}.json \
            results-${{ matrix.server }}/catalog-batch-${BATCH}.json 2>/dev/null || true
          
          # Copy report
          scp -o StrictHostKeyChecking=no -r \
            ${{ env.SSH_USER }}@${{ matrix.ip }}:~/devel/CI-Hub/playwright-report \
            results-${{ matrix.server }}/ 2>/dev/null || true
          
          # Copy screenshots
          scp -o StrictHostKeyChecking=no -r \
            ${{ env.SSH_USER }}@${{ matrix.ip }}:~/devel/CI-Hub/e2e/screenshots/current \
            results-${{ matrix.server }}/screenshots/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.server }}-batch-${{ matrix.batch }}
          path: results-${{ matrix.server }}/
          retention-days: 7

  aggregate:
    name: Aggregate Results
    needs: [prepare, test-batch]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: all-results/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate unified report
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          const resultsDir = 'all-results';
          const results = [];
          let totalPassed = 0, totalFailed = 0;
          
          // Scan all result directories
          if (fs.existsSync(resultsDir)) {
            const dirs = fs.readdirSync(resultsDir);
            
            for (const dir of dirs) {
              const batchFile = fs.readdirSync(path.join(resultsDir, dir)).find((f) => /^catalog-batch-.*\.json$/.test(f));
              const reportPath = batchFile ? path.join(resultsDir, dir, batchFile) : '';
              
              if (fs.existsSync(reportPath)) {
                try {
                  const report = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
                  totalPassed += report.stats?.expected || 0;
                  totalFailed += report.stats?.unexpected || 0;
                  results.push({
                    server: dir.replace('results-', '').split('-batch')[0],
                    batch: dir.match(/batch-(\d+)/)?.[1] || 'unknown',
                    passed: report.stats?.expected || 0,
                    failed: report.stats?.unexpected || 0,
                  });
                } catch (e) {
                  console.error(`Failed to parse ${reportPath}: ${e.message}`);
                }
              }
            }
          }
          
          const total = totalPassed + totalFailed;
          const passRate = total > 0 ? ((totalPassed / total) * 100).toFixed(1) : '0';
          
          // Generate markdown report
          let md = `# App Catalog Fleet Test Report\n\n`;
          md += `**Date:** ${new Date().toISOString().split('T')[0]}\n`;
          md += `**Total Apps Tested:** ${{ needs.prepare.outputs.total_apps }}\n\n`;
          md += `## Summary\n\n`;
          md += `| Metric | Value |\n|--------|-------|\n`;
          md += `| Total Passed | ${totalPassed} |\n`;
          md += `| Total Failed | ${totalFailed} |\n`;
          md += `| Pass Rate | ${passRate}% |\n\n`;
          
          md += `## Server Results\n\n`;
          md += `| Server | Batch | Passed | Failed |\n`;
          md += `|--------|-------|--------|--------|\n`;
          for (const r of results) {
            md += `| ${r.server} | ${r.batch} | ${r.passed} | ${r.failed} |\n`;
          }
          
          fs.writeFileSync('fleet-report.md', md);
          console.log(md);
          SCRIPT

      - name: Post summary
        run: cat fleet-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified report
        uses: actions/upload-artifact@v7
        with:
          name: fleet-unified-report
          path: fleet-report.md
          retention-days: 7

  notify:
    name: Notify
    needs: [prepare, test-batch, aggregate]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.test-batch.result }}" == "success" ]]; then
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.test-batch.result }}" == "failure" ]]; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          else
            echo "status=⚠️ Partial" >> "$GITHUB_OUTPUT"
            echo "color=16776960" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "App Catalog Fleet Tests - ${{ steps.status.outputs.status }}",
                "description": "Weekly app catalog tests completed.",
                "color": ${{ steps.status.outputs.color }},
                "fields": [
                  {"name": "Mode", "value": "${{ github.event.inputs.mode || 'full' }}", "inline": true},
                  {"name": "Apps", "value": "${{ needs.prepare.outputs.total_apps }}", "inline": true},
                  {"name": "Servers", "value": "10", "inline": true}
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }'
