name: E2E Platform Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: e2e-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-platform:
    runs-on: [self-hosted, ci-core]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test app images
        run: |
          cd e2e/platform-test-app/services/web && docker build -t ci-e2e-test-app-web:latest .
          cd "$GITHUB_WORKSPACE"
          cd e2e/platform-test-app/services/worker && docker build -t ci-e2e-test-app-worker:latest .
          cd "$GITHUB_WORKSPACE"
          cd e2e/platform-test-app/services/udp-echo && docker build -t ci-e2e-test-app-udp:latest .

      - name: Acquire file lock
        run: |
          LOCK=/tmp/ci-hub-e2e.lock
          TIMEOUT=600
          START=$(date +%s)
          while ! (set -o noclobber; echo $$ > "$LOCK") 2>/dev/null; do
            NOW=$(date +%s)
            if [ $((NOW - START)) -ge $TIMEOUT ]; then
              echo "Lock timeout after ${TIMEOUT}s — removing stale lock"
              rm -f "$LOCK"
              echo $$ > "$LOCK"
              break
            fi
            echo "Waiting for lock... ($((NOW - START))s)"
            sleep 5
          done
          echo "Lock acquired"

      - name: Clean previous test app
        run: |
          docker ps -a --filter "name=ci-e2e-test-app" --format "{{.Names}}" | xargs -r docker rm -f || true
          docker network ls --filter "name=ci-e2e-test-app" --format "{{.Name}}" | xargs -r docker network rm || true

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright platform tests
        run: npx playwright test e2e/platform/ --reporter=html
        env:
          HUB_URL: http://localhost:3000
          APP_URL: http://localhost:7100

      - name: Cleanup
        if: always()
        run: |
          docker ps -a --filter "name=ci-e2e-test-app" --format "{{.Names}}" | xargs -r docker rm -f || true
          docker network ls --filter "name=ci-e2e-test-app" --format "{{.Name}}" | xargs -r docker network rm || true
          rm -f /tmp/ci-hub-e2e.lock

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-platform
          path: playwright-report/
          retention-days: 7
