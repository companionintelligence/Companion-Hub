name: E2E Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version tag for release E2E"
        required: false
        type: string

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: companiondb
        ports:
          - 6543:5432
        options: >-
          --health-cmd "pg_isready -U companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: companion
          RABBITMQ_DEFAULT_PASS: admin
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: bun install --frozen-lockfile

      - name: Create data directories
        run: |
          mkdir -p /tmp/ci-hub-e2e/{apps,app-data,state,repos,logs,backups,user-config,media}
          mkdir -p /tmp/ci-hub-e2e/state/traefik/{config,dynamic,tls}
          touch /tmp/ci-hub-e2e/state/traefik/acme_storage.json
          echo "# E2E test env" > /tmp/ci-hub-e2e/.env

      - name: Verify services
        run: |
          # Postgres readiness is guaranteed by the service health check above
          # Just verify the port is reachable from the runner
          timeout 10 bash -c 'until echo > /dev/tcp/localhost/6543; do sleep 1; done' && echo "Postgres port open"
          # Wait for RabbitMQ AMQP port to accept connections (health check may pass before port is bound to host)
          timeout 60 bash -c 'until echo > /dev/tcp/localhost/5672; do sleep 2; done' && echo "RabbitMQ AMQP port open"

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - name: Start mock portal
        run: |
          bun run e2e/mock-portal/server.ts &
          echo "MOCK_PID=$!" >> $GITHUB_ENV
          sleep 2
          curl -sf http://localhost:4444/v2/ || echo "Warning: mock portal not responding"

      - name: Run E2E tests
        run: bun run test:e2e:ci
        env:
          SERVER_IP: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 6543
          POSTGRES_USERNAME: companion
          POSTGRES_PASSWORD: postgres
          POSTGRES_DBNAME: companiondb
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USERNAME: companion
          RABBITMQ_PASSWORD: admin
          JWT_SECRET: e2e-test-secret
          CI_CLOUD_URL: http://localhost:4444
          DOMAIN: ci.computer
          LOCAL_DOMAIN: ci.lan
          ROOT_FOLDER_HOST: /tmp/ci-hub-e2e
          CI_HUB_APP_DATA_PATH: /tmp/ci-hub-e2e
          CI_HUB_DATA_DIR: /tmp/ci-hub-e2e
          CI_HUB_APP_DATA_DIR: /tmp/ci-hub-e2e/app-data
          CI_HUB_APP_DIR: ${{ github.workspace }}
          CI: true
          DEVICE_ID: test-device-e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
