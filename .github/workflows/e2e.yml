name: E2E Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: tipi
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tipi
        ports:
          - 6543:5432
        options: >-
          --health-cmd "pg_isready -U tipi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: tipi
          RABBITMQ_DEFAULT_PASS: tipi
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: bun install --frozen-lockfile

      - name: Create data directories
        run: |
          mkdir -p /tmp/runtipi-e2e/{apps,app-data,state,repos,logs,backups,user-config,media}
          mkdir -p /tmp/runtipi-e2e/state/traefik/{config,dynamic,tls}
          touch /tmp/runtipi-e2e/state/traefik/acme_storage.json
          echo "# E2E test env" > /tmp/runtipi-e2e/.env

      - name: Verify services
        run: |
          # Postgres readiness is guaranteed by the service health check above
          # Just verify the port is reachable from the runner
          timeout 10 bash -c 'until echo > /dev/tcp/localhost/6543; do sleep 1; done' && echo "Postgres port open"
          curl -sf http://localhost:5672 || echo "RabbitMQ AMQP port open (expected non-HTTP)"

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e:ci
        env:
          SERVER_IP: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 6543
          POSTGRES_USERNAME: tipi
          POSTGRES_PASSWORD: postgres
          POSTGRES_DBNAME: tipi
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USERNAME: tipi
          RABBITMQ_PASSWORD: tipi
          JWT_SECRET: e2e-test-secret
          CI_CLOUD_URL: https://portal.companionintelligence.com
          CI_CLOUD_API_URL: https://portal.companionintelligence.com/api
          CI_CLOUD_FRONTEND_URL: https://portal.companionintelligence.com
          DOMAIN: ci.computer
          LOCAL_DOMAIN: tipi.lan
          ROOT_FOLDER_HOST: /tmp/runtipi-e2e
          RUNTIPI_APP_DATA_PATH: /tmp/runtipi-e2e
          TIPI_DATA_DIR: /tmp/runtipi-e2e
          TIPI_APP_DATA_DIR: /tmp/runtipi-e2e/app-data
          TIPI_APP_DIR: ${{ github.workspace }}
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
