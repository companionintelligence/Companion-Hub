name: Publish Hub Stack Tag

# Mint a Hub stack tag from an image that already exists, without rebuilding.
#
# Recovery lever for the class of incident in #920: a release built and shipped desktop
# bundles, but the versioned image they pin was never published, so every install fails to
# start. Rebuilding from source would produce a *different* image than the one that was
# tested; `crane copy` re-points a tag at the existing multi-arch manifest, preserving the
# digest, so what users pull is provably the artifact that was already validated.
#
# Prefer fixing the release pipeline. Reach for this when installs are already stranded.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Existing image to copy from (e.g. ghcr.io/companionintelligence/ci-hub:latest)'
        required: true
        default: 'ghcr.io/companionintelligence/ci-hub:latest'
        type: string
      tag:
        description: 'Version tag to publish, unprefixed (e.g. 0.2.45)'
        required: true
        type: string
      copy_to_portal:
        description: 'Also mirror to the Portal registry (used for in-app update listing)'
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-hub-stack-tag
  cancel-in-progress: false

jobs:
  publish:
    name: Republish stack tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The Portal credentials are environment-scoped (build-container.yml reads them from
    # inside an environment-bound job, and the Portal host differs per environment).
    # Without this binding they resolve empty and the mirror silently no-ops.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Validate before touching any registry. The resolver rejects `v`-prefixed and
      # partial versions, which would otherwise publish a tag no client can resolve.
      - name: Validate target tag
        id: refs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # The resolver treats an empty tag as the legitimate "no version" case, which
          # build-container needs on push events. Here it would silently degrade into
          # copying :latest onto :latest and reporting success while minting nothing, so
          # require a version explicitly. `required: true` does not reject an empty string.
          if [ -z "${RELEASE_TAG// /}" ]; then
            echo "::error::A version tag is required (e.g. 0.2.45); refusing to run with an empty tag."
            exit 1
          fi

          node scripts/release/resolve-hub-image-tags.cjs --environment production --tag "$RELEASE_TAG"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image to the target tag
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGET_REF: ${{ steps.refs.outputs.desktop_ref }}
        run: |
          set -euo pipefail

          SOURCE_DIGEST="$(crane digest "${SOURCE_REF}")"
          echo "::notice::Source ${SOURCE_REF} is ${SOURCE_DIGEST}"

          # crane copy transfers the manifest (or manifest index) as-is, so a multi-arch
          # source stays multi-arch and the digest is unchanged.
          crane copy "${SOURCE_REF}" "${TARGET_REF}"

          TARGET_DIGEST="$(crane digest "${TARGET_REF}")"
          echo "::notice::Target ${TARGET_REF} is ${TARGET_DIGEST}"

          # Equal digests are the proof that we published the validated artifact rather
          # than something newly built. Treat any difference as a failure worth inspecting.
          if [ "${SOURCE_DIGEST}" != "${TARGET_DIGEST}" ]; then
            echo "::error::Digest mismatch after copy (source ${SOURCE_DIGEST}, target ${TARGET_DIGEST})."
            exit 1
          fi

          {
            echo "### Republished Hub stack tag"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| source | \`${SOURCE_REF}\` |"
            echo "| target | \`${TARGET_REF}\` |"
            echo "| digest | \`${TARGET_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror to Portal registry
        if: inputs.copy_to_portal
        continue-on-error: true
        env:
          PORTAL_USER: ${{ secrets.PORTAL_REGISTRY_USERNAME }}
          PORTAL_PASS: ${{ secrets.PORTAL_REGISTRY_PASSWORD }}
          PORTAL: ${{ steps.refs.outputs.portal_registry }}
          TARGET_REF: ${{ steps.refs.outputs.desktop_ref }}
          VERSION: ${{ steps.refs.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAL_USER}" ]; then
            echo "::warning::Portal credentials not configured; skipping mirror."
            exit 0
          fi
          crane auth login "${PORTAL}" -u "${PORTAL_USER}" -p "${PORTAL_PASS}"
          # Portal keeps the ci-os-hub repo name — it is the path the backend lists for
          # update discovery, not the GHCR repo Docker pulls from.
          crane copy "${TARGET_REF}" "${PORTAL}/ci-os-hub:${VERSION}"
          echo "::notice::Mirrored to ${PORTAL}/ci-os-hub:${VERSION}"

      # Same contract as the release gate: the tag is only useful if an ordinary,
      # unauthenticated Docker can pull it on both shipped architectures.
      - name: Verify the new tag is publicly pullable
        env:
          TARGET_REF: ${{ steps.refs.outputs.desktop_ref }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          echo '{}' > "${DOCKER_CONFIG}/config.json"

          if ! MANIFEST="$(crane manifest "${TARGET_REF}" 2>/tmp/crane-err)"; then
            echo "::error::${TARGET_REF} is not anonymously pullable: $(cat /tmp/crane-err)"
            echo "::error::Confirm the GHCR package visibility is public."
            exit 1
          fi

          for ARCH in amd64 arm64; do
            if ! echo "${MANIFEST}" | grep -q "\"architecture\": *\"${ARCH}\""; then
              echo "::error::${TARGET_REF} is missing linux/${ARCH}; the source image was not multi-arch."
              exit 1
            fi
          done

          echo "::notice::${TARGET_REF} verified: anonymous pull, linux/amd64 + linux/arm64."
