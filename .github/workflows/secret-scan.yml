name: 'Secret Scan'

# Scans PR and push deltas for committed secrets using the open-source Gitleaks CLI.
# CASA Tier 2 / SOC 2 evidence: recurring secret scanning on new changes.
#
# Uses the Gitleaks binary directly (not gitleaks-action) so org repos do not
# require a paid GITLEAKS_LICENSE for the GitHub Action wrapper.
# Scans commit deltas only — not full history — to avoid blocking on legacy
# findings predating this workflow.

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${BEFORE_SHA}..${AFTER_SHA}"
          else
            LOG_OPTS="${AFTER_SHA}~1..${AFTER_SHA}"
          fi
          echo "Scanning commits: $LOG_OPTS"
          gitleaks detect --source . --redact --verbose --log-opts="$LOG_OPTS"
