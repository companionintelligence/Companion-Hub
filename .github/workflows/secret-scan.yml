name: 'Secret Scan'

# Scans the repository and PR diffs for committed secrets (API keys,
# tokens, credentials) using Gitleaks.
# CASA Tier 2 / SOC 2 evidence: recurring secret scanning.

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    # non-blocking until GitHub Advanced Security / GITLEAKS_LICENSE is enabled on this repo
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
