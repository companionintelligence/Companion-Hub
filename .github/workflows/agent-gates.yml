name: Agent Gates
# TEMPORARY (Actions credit): automatic PR triggers disabled.
# Re-enable pull_request when credits recover. Manual: gh workflow run agent-gates.yml
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  agent-gates:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Benchmark gate
        run: pnpm run benchmark:gate

      - name: Visual regression
        run: |
          if [ -n "$(ls -A e2e/screenshots/baselines/*.png 2>/dev/null)" ]; then
            pnpm run test:visual
          else
            echo "No visual baselines committed — skipping test:visual"
          fi
