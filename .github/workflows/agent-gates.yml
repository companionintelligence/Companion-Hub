name: Agent Gates
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   pull_request:
#     paths:
#       - 'packages/frontend/**'
#       - 'e2e/visual/**'
#       - 'e2e/helpers/screenshot.ts'
#       - 'scripts/agent/**'
#       - 'e2e/results/benchmarks/**'
# <<< ci-local:gated
on:
  workflow_dispatch:

jobs:
  agent-gates:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Benchmark gate
        run: pnpm run benchmark:gate

      - name: Visual regression
        run: |
          if [ -n "$(ls -A e2e/screenshots/baselines/*.png 2>/dev/null)" ]; then
            pnpm run test:visual
          else
            echo "No visual baselines committed — skipping test:visual"
          fi
