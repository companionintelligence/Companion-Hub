name: Nightly Release

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   workflow_dispatch:
#   schedule:
#     - cron: "0 0 * * *"
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp the build time
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          # Nightly carries the same CI_HUB_BUILD_* stamp as a release build. Without it every
          # nightly image reports itself identically, and `nightly` is the one channel where two
          # images a day share a tag — the commit and the build time are the only things that
          # tell them apart. No comments inside the block scalar: each line is parsed as KEY=VALUE.
          build-args: |
            CI_HUB_VERSION=nightly
            CI_HUB_ENVIRONMENT=nightly
            CI_HUB_BUILD_VERSION=nightly
            CI_HUB_BUILD_CHANNEL=nightly
            CI_HUB_BUILD_SHA=${{ github.sha }}
            CI_HUB_BUILD_REF=${{ github.ref }}
            CI_HUB_BUILD_TIME=${{ steps.stamp.outputs.built_at }}
            CI_HUB_BUILD_IMAGE_REF=ghcr.io/companionintelligence/ci-hub:nightly
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-hub-backend@nightly
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BACKEND_PROJECT=${{ vars.SENTRY_BACKEND_PROJECT }}
            SENTRY_FRONTEND_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
            VITE_BUILD_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '' }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_FRONTEND_DSN }}
            VITE_SENTRY_RELEASE=ci-hub-frontend@nightly
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Publish alongside every other Hub stack image, in the public ci-hub package.
          # ci-os-hub is private and is no longer a publish target (#920).
          tags: ghcr.io/companionintelligence/ci-hub:nightly
          # This job does not run docker/metadata-action, so nothing would stamp OCI labels at all.
          # `revision` is what hub-deployment.ts falls back to for a build with no version, and
          # `cihub pool update` reports "this build stamps no org.opencontainers.image.revision"
          # when it is missing — which was true of every nightly image.
          labels: |
            org.opencontainers.image.version=nightly
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.stamp.outputs.built_at }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=CI-Hub

  update-manifest:
    needs: [build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create version manifest
        run: |
          cat > latest.json << EOF
          {
            "version": "nightly",
            "image": "ghcr.io/companionintelligence/ci-hub:nightly",
            "channel": "nightly",
            "released": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${{ github.sha }}"
          }
          EOF
      - name: Upload to nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          files: latest.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-tests:
    needs: [build-images]
    uses: "./.github/workflows/e2e.yml"
    secrets: inherit
    with:
      version: nightly
