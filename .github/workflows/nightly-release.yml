name: Nightly Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            CI_HUB_VERSION=nightly
            CI_HUB_ENVIRONMENT=nightly
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-hub-backend@nightly
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BACKEND_PROJECT=${{ vars.SENTRY_BACKEND_PROJECT }}
            SENTRY_FRONTEND_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
            VITE_BUILD_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '' }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_FRONTEND_DSN }}
            VITE_SENTRY_RELEASE=ci-hub-frontend@nightly
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/companionintelligence/ci-os-hub:nightly

  update-manifest:
    needs: [build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create version manifest
        run: |
          cat > latest.json << EOF
          {
            "version": "nightly",
            "image": "ghcr.io/companionintelligence/ci-os-hub:nightly",
            "channel": "nightly",
            "released": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${{ github.sha }}"
          }
          EOF
      - name: Upload to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: latest.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-tests:
    needs: [build-images]
    uses: "./.github/workflows/e2e.yml"
    secrets: inherit
    with:
      version: nightly
