name: Build and Push Container

on:
  push:
    branches:
      - "main"
      - "dev"
      - "staging"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      tag:
        description: 'Release tag to publish as a versioned image (e.g. v0.2.45). Production only; ignored elsewhere.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      tag:
        description: 'Release tag to publish as a versioned image (e.g. v0.2.45). Production only; ignored elsewhere.'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    # Consumed by verify-anonymous-pull, which must check the exact reference this job
    # published rather than recomputing it and risking a drift between the two.
    outputs:
      image_repo: ${{ steps.tags.outputs.image_repo }}
      channel_tag: ${{ steps.tags.outputs.channel_tag }}
      version: ${{ steps.tags.outputs.version }}
      desktop_ref: ${{ steps.tags.outputs.desktop_ref }}
    permissions:
      contents: read
      deployments: write
      packages: write
    # Same rule as the "Resolve image references" step: the explicit input wins, branch
    # detection is only the push-event fallback. Keyed off inputs.environment rather than
    # github.event_name because that reports the CALLER's event inside a reusable workflow,
    # so the two would disagree the moment a non-dispatch caller is added.
    environment:
      name: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/staging' && 'staging') || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pre-check required secrets
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are present"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolution rules live in a unit-tested script shared with the desktop binary, not
      # inline here — see scripts/release/resolve-hub-image-tags.cjs. It decides the repo,
      # the channel tag, whether a versioned tag is published, and the exact reference the
      # shipped desktop will pin (desktop_ref), which the verify job then proves is
      # anonymously pullable.
      #
      # Runs on the runner's preinstalled Node (setup-node comes later, and dependencies
      # are never installed in this job) — hence the script is dependency-free CommonJS.
      - name: Resolve image references
        id: tags
        env:
          # Both empty on push events; only dispatched/called runs supply them.
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Prefer the explicit input over the trigger. `github.event_name` reports the
          # CALLER's event inside a reusable workflow, so branching on it would ignore
          # inputs.environment if Desktop Release were ever triggered by anything other
          # than a dispatch. Branch detection is only the push-event fallback.
          if [ -n "${INPUT_ENVIRONMENT:-}" ]; then
            ENV="${INPUT_ENVIRONMENT}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi

          echo "Resolving image references for environment=${ENV} tag=${RELEASE_TAG:-<none>}"
          node scripts/release/resolve-hub-image-tags.cjs --environment "$ENV" --tag "${RELEASE_TAG:-}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.tags.outputs.image_repo }}
          # Channel tag always; the versioned tag only when the resolver produced one
          # (production releases). Tags are unprefixed by contract — hub_env.rs strips the
          # `v` when composing its pin, so a `v`-prefixed tag would be unpullable.
          tags: |
            type=raw,value=${{ steps.tags.outputs.channel_tag }}
            type=raw,value=${{ steps.tags.outputs.version }},enable=${{ steps.tags.outputs.version != '' }}
          # metadata-action stamps the FIRST tag above as the version label, so the published 0.2.71
          # image says `org.opencontainers.image.version=latest`. The Hub's self-updater reads this
          # label to learn which release it runs (CI_HUB_VERSION in the env file was wrong on 10 of
          # 16 fleet Hubs), so a release build must carry its version here.
          #
          # `revision` is also one metadata-action sets by default, and it is restated explicitly
          # because it is now load-bearing twice over: hub-deployment.ts identifies a channel build
          # by it (a `dev` image has no version), and it is the only thing that tells two untagged
          # `:dev` indexes apart. A default that silently stops being emitted would take both with
          # it. Every label here is also passed as a build-arg below, so the SAME facts reach the
          # running process — a label is readable only through the Docker socket, which the Hub's
          # own `GET /api/hub/build` must not depend on.
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version || steps.tags.outputs.channel_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=CI-Hub
            org.opencontainers.image.description=Companion Hub appliance runtime

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # Skip caching the binfmt image — concurrent jobs race on the same
          # cache key ("Unable to reserve cache ... another job may be creating
          # this cache"). The binfmt image is tiny, so re-pulling is cheaper
          # than the noisy, non-fatal cache-reservation failures.
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity is baked as ENV in the runner stage (see the Dockerfile block that
          # declares the CI_HUB_BUILD_* args). Labels alone are not enough: reading a label needs
          # the Docker socket, and "which build am I?" has to be answerable by the Hub process
          # itself — that is what `GET /api/hub/build` serves.
          #
          # CI_HUB_VERSION additionally reaches the BUILDER stage, where vite.config.ts bakes it
          # into the frontend bundle (`import.meta.env.CI_HUB_VERSION`). Until now this workflow
          # passed nothing, so every shipped bundle was built with an empty version and
          # `hub-hello.ts` could not tell a stale tab from a current one after a stack update.
          #
          # No comments inside the block scalar below: every line there is parsed as KEY=VALUE.
          build-args: |
            CI_CLOUD_URL=https://${{ steps.tags.outputs.portal_registry }}
            CI_HUB_VERSION=${{ steps.tags.outputs.version || steps.tags.outputs.channel_tag }}
            CI_HUB_ENVIRONMENT=${{ steps.tags.outputs.environment }}
            CI_HUB_BUILD_VERSION=${{ steps.tags.outputs.version || steps.tags.outputs.channel_tag }}
            CI_HUB_BUILD_CHANNEL=${{ steps.tags.outputs.channel_tag }}
            CI_HUB_BUILD_SHA=${{ github.sha }}
            CI_HUB_BUILD_REF=${{ github.ref }}
            CI_HUB_BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            CI_HUB_BUILD_IMAGE_REF=${{ steps.tags.outputs.desktop_ref }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-hub-backend@${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BACKEND_PROJECT=${{ vars.SENTRY_BACKEND_PROJECT }}
            SENTRY_FRONTEND_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
            VITE_BUILD_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '' }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_FRONTEND_DSN }}
            VITE_SENTRY_RELEASE=ci-hub-frontend@${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Push to Portal registry
        id: portal
        env:
          PORTAL_USER: ${{ secrets.PORTAL_REGISTRY_USERNAME }}
          PORTAL_PASS: ${{ secrets.PORTAL_REGISTRY_PASSWORD }}
        run: |
          # Without -e the step's status is just the LAST command's, so a trailing
          # conditional would mask a failed login or copy and report success.
          set -euo pipefail

          if [ -z "${PORTAL_USER}" ] || [ -z "${PORTAL_PASS}" ]; then
            echo "::error::PORTAL_REGISTRY_USERNAME and PORTAL_REGISTRY_PASSWORD are required."
            echo "::error::Refusing to skip the Portal mirror. Set both secrets on this environment."
            exit 1
          fi

          PORTAL="${{ steps.tags.outputs.portal_registry }}"
          TAG="${{ steps.tags.outputs.channel_tag }}"
          VERSION="${{ steps.tags.outputs.version }}"
          CHANNEL_IMAGE="${{ steps.tags.outputs.image_repo }}:${TAG}"

          echo "Logging in to ${PORTAL}..."
          crane auth login "${PORTAL}" -u "${PORTAL_USER}" -p "${PORTAL_PASS}"
          # Same keychain crane reads. crane auth login only writes config.json and
          # does not verify the password against the registry.
          echo "${PORTAL_PASS}" | docker login "${PORTAL}" -u "${PORTAL_USER}" --password-stdin

          # Fail here with a readable error instead of crane's dest-HEAD 401.
          # GET /v2/_catalog requires valid Basic; GET /v2/ is anonymous and proves nothing.
          CATALOG_CODE="$(curl -sS -o /tmp/portal-catalog.json -w '%{http_code}' \
            -u "${PORTAL_USER}:${PORTAL_PASS}" \
            "https://${PORTAL}/v2/_catalog")"
          if [ "${CATALOG_CODE}" != "200" ]; then
            echo "::error::Portal ${PORTAL} rejected PORTAL_REGISTRY_USERNAME/PASSWORD (HTTP ${CATALOG_CODE} on /v2/_catalog)."
            echo "::error::Those GitHub Environment secrets must match the Cloudflare Worker REGISTRY_USERNAME/REGISTRY_PASSWORD for this Portal."
            echo "::error::crane auth login does not verify credentials; a dest HEAD then fails with 401."
            cat /tmp/portal-catalog.json >&2 || true
            exit 1
          fi

          echo "Copying ${CHANNEL_IMAGE} → ${PORTAL}/ci-hub:${TAG}"
          crane copy "${CHANNEL_IMAGE}" "${PORTAL}/ci-hub:${TAG}"

          echo "Copying ${CHANNEL_IMAGE} → ${PORTAL}/ci-hub:latest"
          crane copy "${CHANNEL_IMAGE}" "${PORTAL}/ci-hub:latest"

          # The Portal repo is what the backend LISTS for available updates
          # (registry.service.ts filters to semver-valid tags). Without a versioned copy
          # that listing is permanently empty and update discovery falls back to
          # dl.ci.computer/latest.json — so publish the version here too.
          #
          # Sourced from the VERSIONED GHCR reference, not the channel tag: this workflow
          # also runs on pushes to main, so :latest can move between the build above and
          # this copy, which would publish a different digest under the version's name.
          if [ -n "${VERSION}" ]; then
            VERSIONED_IMAGE="${{ steps.tags.outputs.image_repo }}:${VERSION}"
            echo "Copying ${VERSIONED_IMAGE} → ${PORTAL}/ci-hub:${VERSION}"
            crane copy "${VERSIONED_IMAGE}" "${PORTAL}/ci-hub:${VERSION}"
          fi

      # Fatal on the mirror step itself. This warning still fires if that step is
      # cancelled or otherwise does not report success, so the GHCR-vs-Portal gap
      # is visible in the job log rather than only as a red X.
      - name: Warn when the Portal mirror was not updated
        if: ${{ always() && !cancelled() && steps.portal.outcome != 'success' }}
        run: |
          echo "::warning::Portal mirror was not updated (outcome: ${{ steps.portal.outcome }})." \
               "The image is published to GHCR and is still pullable, but" \
               "${{ steps.tags.outputs.portal_registry }}/ci-hub did not receive it, so in-app" \
               "update listing will fall back to dl.ci.computer/latest.json."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env ${{ steps.tags.outputs.environment }}

  # Prove the published image is usable by an ordinary user before any desktop bundle is
  # built against it. Hub 0.2.44 shipped pinning an image that returned 403 to anonymous
  # Docker; nothing in the pipeline noticed, because every CI step was authenticated (#920).
  #
  # This job therefore runs with NO registry login and an empty DOCKER_CONFIG, so ambient
  # credentials cannot mask a private package. Desktop Release depends on this whole
  # workflow, so a failure here blocks all six desktop builds before they start.
  verify-anonymous-pull:
    name: Verify image is publicly pullable
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fresh runner: nothing is inherited from the deploy job, including crane or binfmt.
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      # linux/arm64 `docker run` on ubuntu-latest needs binfmt; without it the gate reports
      # exec format error even when the pushed arm64 manifest slot is correct.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Verify anonymous pull and multi-arch manifest
        env:
          DESKTOP_REF: ${{ needs.deploy.outputs.desktop_ref }}
          CHANNEL_REF: ${{ needs.deploy.outputs.image_repo }}:${{ needs.deploy.outputs.channel_tag }}
          IMAGE_REPO: ${{ needs.deploy.outputs.image_repo }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail

          # A verification that checks nothing must never report success. If the deploy job
          # stopped emitting desktop_ref (renamed output, dropped mapping), the loop below
          # would simply not execute and this job would go green having proved nothing —
          # the same silent-pass class of failure that let #920 ship.
          if [ -z "${DESKTOP_REF}" ]; then
            echo "::error::deploy did not report a desktop_ref, so there is nothing to verify."
            echo "::error::Refusing to pass. Check the 'Resolve image references' step and the job outputs mapping."
            exit 1
          fi

          # When a version was published, the reference under test must be that version.
          # Otherwise a drift between what is published and what is verified would let the
          # gate pass on :latest while the pinned version tag is missing.
          if [ -n "${VERSION}" ] && [ "${DESKTOP_REF}" != "${IMAGE_REPO}:${VERSION}" ]; then
            echo "::error::Published version '${VERSION}' does not match the verified reference '${DESKTOP_REF}'."
            echo "::error::The resolver and the workflow disagree; desktop builds would pin an unverified image."
            exit 1
          fi

          # Isolate from any ambient credentials so this mirrors a first-time user.
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          echo '{}' > "${DOCKER_CONFIG}/config.json"

          # Every reference a shipped build could resolve to. When a version is published,
          # desktop_ref is that version; otherwise it is the channel tag and this dedupes.
          REFS="${DESKTOP_REF}"
          if [ "${CHANNEL_REF}" != "${DESKTOP_REF}" ]; then
            REFS="${REFS} ${CHANNEL_REF}"
          fi

          FAILED=0
          {
            echo "### Hub stack image verification"
            echo ""
            echo "| reference | anonymous pull | linux/amd64 | linux/arm64 | digest |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for REF in ${REFS}; do
            echo "Probing ${REF} anonymously…"
            if ! MANIFEST="$(crane manifest "${REF}" 2>/tmp/crane-err)"; then
              echo "::error::${REF} is NOT anonymously pullable: $(cat /tmp/crane-err)"
              echo "::error::A shipped desktop build pins this exact reference and will fail with 403/404 at startup." \
                   "Confirm the GHCR package is public and that this tag was published."
              echo "| \`${REF}\` | ❌ | – | – | – |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
              continue
            fi

            # Tolerate a flaky digest lookup: it is metadata for the summary table, and
            # failing the release over a transient 5xx here would abort the loop before
            # the remaining references are probed.
            DIGEST="$(crane digest "${REF}" 2>/dev/null || echo 'unavailable')"

            # Decide on plain booleans and derive the display separately: tying the
            # pass/fail branch to the emoji used in the summary table would let a cosmetic
            # edit silently change what this gate accepts.
            #
            # Matched from a here-string rather than `echo | grep`: under `pipefail`,
            # `grep -q` exits on first match and can SIGPIPE the producer, making the
            # pipeline report failure on a manifest that DID contain the architecture.
            HAS_AMD64=0; HAS_ARM64=0
            grep -q '"architecture": *"amd64"' <<< "${MANIFEST}" && HAS_AMD64=1
            grep -q '"architecture": *"arm64"' <<< "${MANIFEST}" && HAS_ARM64=1

            # Both are required: Apple Silicon and ARM64 Linux desktops are shipped targets,
            # and an amd64-only image would leave them emulating or failing outright.
            if [ "${HAS_AMD64}" -ne 1 ] || [ "${HAS_ARM64}" -ne 1 ]; then
              echo "::error::${REF} is not multi-arch (amd64=${HAS_AMD64} arm64=${HAS_ARM64})." \
                   "Restore 'platforms: linux/amd64,linux/arm64' on the build step."
              FAILED=1
            fi

            # Manifest index strings alone are not enough: a BUILDPLATFORM bug can publish
            # an amd64 Node blob under the linux/arm64 slot. Assert image config architecture
            # and a real `uname -m` from each platform.
            for PLAT_EXPECT in "linux/amd64:amd64:x86_64" "linux/arm64:arm64:aarch64"; do
              PLAT="${PLAT_EXPECT%%:*}"
              REST="${PLAT_EXPECT#*:}"
              CFG_EXPECT="${REST%%:*}"
              UNAME_EXPECT="${REST##*:}"
              CFG_ARCH="$(crane config --platform "${PLAT}" "${REF}" 2>/tmp/crane-cfg-err | jq -r '.architecture // empty' || true)"
              if [ "${CFG_ARCH}" != "${CFG_EXPECT}" ]; then
                echo "::error::${REF} platform ${PLAT} config.architecture is '${CFG_ARCH}' (want ${CFG_EXPECT})." \
                     "Runner stages must use TARGETPLATFORM so arm64 images are not amd64 under Rosetta." \
                     "$(cat /tmp/crane-cfg-err 2>/dev/null || true)"
                FAILED=1
                continue
              fi
              if ! docker pull --platform "${PLAT}" "${REF}" >/tmp/docker-pull-out 2>&1; then
                echo "::error::Failed to pull ${REF} for ${PLAT}: $(cat /tmp/docker-pull-out)"
                FAILED=1
                continue
              fi
              UNAME_GOT="$(docker run --rm --platform "${PLAT}" "${REF}" uname -m 2>/tmp/uname-err || true)"
              if [ "${UNAME_GOT}" != "${UNAME_EXPECT}" ]; then
                echo "::error::${REF} platform ${PLAT} uname -m is '${UNAME_GOT}' (want ${UNAME_EXPECT})." \
                     "$(cat /tmp/uname-err 2>/dev/null || true)"
                FAILED=1
              fi
              NODE_ARCH="$(docker run --rm --platform "${PLAT}" "${REF}" node -p process.arch 2>/tmp/node-arch-err || true)"
              NODE_EXPECT="x64"
              [ "${CFG_EXPECT}" = "arm64" ] && NODE_EXPECT="arm64"
              if [ "${NODE_ARCH}" != "${NODE_EXPECT}" ]; then
                echo "::error::${REF} platform ${PLAT} process.arch is '${NODE_ARCH}' (want ${NODE_EXPECT})." \
                     "$(cat /tmp/node-arch-err 2>/dev/null || true)"
                FAILED=1
              fi
            done

            [ "${HAS_AMD64}" -eq 1 ] && AMD64="✅" || AMD64="❌"
            [ "${HAS_ARM64}" -eq 1 ] && ARM64="✅" || ARM64="❌"

            echo "| \`${REF}\` | ✅ | ${AMD64} | ${ARM64} | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::${REF} verified (${DIGEST})"
          done

          exit "${FAILED}"
