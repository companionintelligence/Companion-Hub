name: Build and Push Container

on:
  push:
    branches:
      - "main"
      - "dev"
      - "staging"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write
      packages: write
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || github.ref == 'refs/heads/dev' && 'dev' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pre-check required secrets
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are present"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ENV="dev"
          else
            ENV="dev"
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

          if [ "$ENV" = "production" ]; then
            {
              echo "docker_tag=latest"
              echo "container_tag=ci-os-hub:latest"
              echo "portal_registry=hub.ci.computer"
            } >> "$GITHUB_OUTPUT"
          elif [ "$ENV" = "staging" ]; then
            {
              echo "docker_tag=staging"
              echo "container_tag=ci-os-hub:staging"
              echo "portal_registry=portal.companionintel.com"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "docker_tag=dev"
              echo "container_tag=ci-os-hub:dev"
              echo "portal_registry=hub.companionintelligence.com"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.docker_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # Skip caching the binfmt image — concurrent jobs race on the same
          # cache key ("Unable to reserve cache ... another job may be creating
          # this cache"). The binfmt image is tiny, so re-pulling is cheaper
          # than the noisy, non-fatal cache-reservation failures.
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CI_CLOUD_URL=https://${{ steps.tags.outputs.portal_registry }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-hub-backend@${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BACKEND_PROJECT=${{ vars.SENTRY_BACKEND_PROJECT }}
            SENTRY_FRONTEND_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
            VITE_BUILD_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '' }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_FRONTEND_DSN }}
            VITE_SENTRY_RELEASE=ci-hub-frontend@${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Push to Portal registry
        continue-on-error: true
        env:
          PORTAL_USER: ${{ secrets.PORTAL_REGISTRY_USERNAME }}
          PORTAL_PASS: ${{ secrets.PORTAL_REGISTRY_PASSWORD }}
        if: env.PORTAL_USER != ''
        run: |
          PORTAL="${{ steps.tags.outputs.portal_registry }}"
          TAG="${{ steps.tags.outputs.docker_tag }}"
          GHCR_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"

          echo "Logging in to ${PORTAL}..."
          crane auth login "${PORTAL}" -u "${PORTAL_USER}" -p "${PORTAL_PASS}"

          echo "Copying ${GHCR_IMAGE} → ${PORTAL}/ci-os-hub:${TAG}"
          crane copy "${GHCR_IMAGE}" "${PORTAL}/ci-os-hub:${TAG}"

          echo "Copying ${GHCR_IMAGE} → ${PORTAL}/ci-os-hub:latest"
          crane copy "${GHCR_IMAGE}" "${PORTAL}/ci-os-hub:latest"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env ${{ steps.tags.outputs.environment }}
