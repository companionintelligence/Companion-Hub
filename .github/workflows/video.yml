# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Same stage as .github/workflows/e2e.yml — the Hub backend needs Postgres
    # and RabbitMQ before it will answer /api/health.
    env:
      SERVER_IP: localhost
      FRONTEND_PORT: "9091"
      BACKEND_PORT: "3000"
      API_PORT: "3000"
      MOCK_PORTAL_PORT: "4444"
      E2E_USE_REAL_PORTAL: "false"
      E2E_TEST: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "6543"
      POSTGRES_USERNAME: companion
      POSTGRES_PASSWORD: postgres
      POSTGRES_DBNAME: companiondb
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: companion
      RABBITMQ_PASSWORD: admin
      JWT_SECRET: e2e-test-secret
      CI_CLOUD_URL: http://localhost:4444
      DOMAIN: ci.computer
      LOCAL_DOMAIN: ci.lan
      TZ: UTC
      DEMO_MODE: "false"
      GUEST_DASHBOARD: "false"
      ALLOW_ERROR_MONITORING: "false"
      PERSIST_TRAEFIK_CONFIG: "false"
      PRIVATE_VPN_USER_DISABLED: "true"
      DISABLE_PASSWORD_RESET: "true"
      ADVANCED_SETTINGS: "false"
      EXPERIMENTAL_INSECURE_COOKIE: "true"
      DEVICE_ID: test-device-e2e
      ROOT_FOLDER_HOST: /tmp/ci-hub-e2e
      CI_HUB_DATA_DIR: /tmp/ci-hub-e2e
      CI_HUB_APP_DATA_PATH: /tmp/ci-hub-e2e
      CI_HUB_APP_DATA_DIR: /tmp/ci-hub-e2e/app-data
      CI_HUB_TUNNEL_DIR: /tmp/ci-hub-e2e/tunnel
      CI_HUB_VERSION: video
      CI_MARKETPLACE_DIR: ${{ github.workspace }}/../CI-Marketplace

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: companiondb
        ports:
          - 6543:5432
        options: >-
          --health-cmd "pg_isready -U companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: companion
          RABBITMQ_DEFAULT_PASS: admin
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The store and app-details shots render the catalog that
      # e2e/start-backend.sh symlinks from $CI_MARKETPLACE_DIR/apps. Without this
      # checkout the script prints "app store will be empty" and both shots fail
      # their waitFor. CI-Marketplace is private, so this needs a cross-repo
      # token; it is non-fatal so the rest of the cut still captures without one.
      - name: Check out CI-Marketplace (store catalog)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: companionintelligence/CI-Marketplace
          ref: dev
          path: ../CI-Marketplace
          token: ${{ secrets.CI_ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          # Without `scope`, setup-node writes a bare `registry=` line into
          # ~/.npmrc and routes EVERY package at GitHub Packages, so public
          # deps (playwright) 404 on install. Scope it to the one org that
          # actually lives there.
          scope: "@companionintelligence"

      - uses: pnpm/action-setup@v4

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # Boots the SAME three servers as playwright.config.ts -> webServer[]:
      #   [0] mock portal   pnpm exec tsx e2e/mock-portal/server.ts        :4444
      #   [1] backend       bash e2e/start-backend.sh                      :3000
      #   [2] frontend      build && preview  (the CI branch of that entry) :9091
      # Playwright is not running here, so this job owns all three processes.
      # The frontend is the PREVIEW build on purpose — see video/capture.config.mjs.
      - name: Start app
        run: |
          set -euo pipefail

          mkdir -p /tmp/ci-hub-e2e/{apps,app-data,state,repos,logs,backups,user-config,media,tunnel}
          mkdir -p /tmp/ci-hub-e2e/state/traefik/{config,dynamic,tls}
          touch /tmp/ci-hub-e2e/state/traefik/acme_storage.json

          timeout 60 bash -c 'until echo > /dev/tcp/localhost/6543; do sleep 1; done'
          timeout 90 bash -c 'until echo > /dev/tcp/localhost/5672; do sleep 2; done'

          MOCK_PORTAL_SCENARIO=registered pnpm exec tsx e2e/mock-portal/server.ts \
            > /tmp/mock-portal.log 2>&1 &
          bash e2e/start-backend.sh > /tmp/backend.log 2>&1 &

          pnpm run --filter frontend build
          pnpm run --filter frontend preview > /tmp/frontend.log 2>&1 &

          timeout 120 bash -c 'until curl -sf http://localhost:4444/___control > /dev/null; do sleep 2; done'
          timeout 420 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null; do sleep 3; done'
          timeout 180 bash -c 'until curl -sf http://localhost:9091 > /dev/null; do sleep 2; done'

          # Seed the local admin the storyboard's hub-home shot signs in as
          # (test@test.com / password, e2e/helpers/constants.ts). Reuses the
          # repo's own fixtures rather than duplicating the argon2 hash here.
          pnpm exec tsx -e "
            const f = await import('./e2e/fixtures/fixtures.ts');
            const db = await import('./e2e/helpers/db.ts');
            await db.clearDatabase();
            await db.seedOrganization();
            await f.createTestUser();
          "

          echo "stage up: http://localhost:9091"

      - name: Capture
        working-directory: video
        run: npm run capture

      # A failed shot is almost always the stage, not the storyboard.
      - name: Stage logs
        if: failure()
        run: |
          for f in /tmp/mock-portal.log /tmp/backend.log /tmp/frontend.log; do
            echo "===== $f ====="
            tail -n 120 "$f" || true
          done

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-hub-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Companion Hub product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
