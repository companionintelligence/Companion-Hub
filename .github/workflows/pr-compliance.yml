name: PR Compliance
# TEMPORARY (Actions credit): automatic PR triggers disabled.
# Re-enable when credits recover. Manual: gh workflow run pr-compliance.yml
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  check-issue-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check for issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';
            const combined = title + '\n' + body;

            const issueRefPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+|#\d+/gi;
            const matches = combined.match(issueRefPattern);

            if (!matches || matches.length === 0) {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });

              const botComment = comments.data.find(c =>
                c.user.type === 'Bot' && c.body.includes('Issue Reference Missing')
              );

              if (!botComment) {
                const commentBody = [
                  ':link: **Issue Reference Missing**',
                  '',
                  'This PR does not appear to reference a GitHub issue. For traceability, please link to the Task or issue this PR addresses:',
                  '',
                  '- `Closes #123` — closes the issue when merged',
                  '- `Fixes #123` — same as Closes',
                  '- `Part of #123` — references without closing',
                  '',
                  'If this is a small fix or chore that does not need an issue, you can ignore this reminder.',
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: commentBody,
                });
              }

              core.warning('No issue reference found in PR title or body. Consider linking to a Task or issue for traceability.');
            } else {
              core.info('Found issue references: ' + matches.join(', '));
            }
