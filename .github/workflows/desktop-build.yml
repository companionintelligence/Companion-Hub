name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - feat/tauri-*
    paths:
      - "packages/desktop/**"
      - "packages/frontend/**"
      - "packages/common/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "packages/desktop/**"
      - "packages/frontend/**"
      - "packages/common/**"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: native aarch64 on GitHub’s arm64 macOS runners.
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          # Intel: cross-compile x86_64 on the same arm64 runner (macos-13 was retired Dec 2025).
          # See https://v2.tauri.app/distribute/pipelines/github/
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Production frontend build skips Sentry upload when SENTRY_AUTH_TOKEN is unset (see vite.config.ts).
      - name: Build frontend
        env:
          NODE_ENV: production
        run: |
          bun run --filter=@ci-hub/common build
          bun run --filter=frontend build

      # Use the published CLI via npx (avoids `cargo install` and bogus CARGO_NET_RETRY_LIMIT → `net.retry` errors).
      # PR/CI has no TAURI_SIGNING_PRIVATE_KEY; merge off createUpdaterArtifacts so .app/.dmg still build.
      # Release jobs that set TAURI_SIGNING_PRIVATE_KEY can omit `-c` to emit .tar.gz + .sig for the updater.
      - name: Build Tauri app
        run: |
          cd packages/desktop
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: List artifacts
        shell: bash
        run: |
          echo "=== Release binary ==="
          ls -lh packages/desktop/src-tauri/target/${{ matrix.target }}/release/ci-os-hub-desktop* 2>/dev/null || true
          echo "=== Bundles ==="
          find packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*-setup.exe" \) -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-${{ matrix.target }}-dmg
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-${{ matrix.target }}-app
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload Linux deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-linux-x64-deb
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-linux-x64-rpm
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-linux-x64-appimage
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # --- Windows artifacts ---
      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-windows-x64-msi
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-hub-windows-x64-setup
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
