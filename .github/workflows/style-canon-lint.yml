name: Style canon lint

# Gated like every other workflow in this repo (ci-local runs checks locally);
# dispatch it deliberately. Fails if any --primary drifts off the CI canon, and if a
# brand file under packages/frontend/public/ differs from packages/frontend/brand.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:canon
