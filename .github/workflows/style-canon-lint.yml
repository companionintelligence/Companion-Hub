name: Style canon lint

# Gated like every other workflow in this repo (ci-local runs checks locally);
# dispatch it deliberately. Fails if any --primary drifts off the CI canon, and if a
# brand file served or bundled by the Hub differs from its origin: packages/frontend/brand
# for the company logo, packages/frontend/hub-brand for the Hub mark (see sync-brand.mjs).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow checks out code and lints it, and writes nothing back.
permissions:
  contents: read

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:canon
