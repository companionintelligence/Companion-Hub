name: Style canon lint

# Gated like every other workflow in this repo (ci-local runs checks locally);
# dispatch it deliberately. Fails if any --primary drifts off the CI canon, and if a
# committed brand copy (packages/frontend/public/ logos, src/styles/ci-tokens.css)
# differs from CI-Common. Only this workflow needs a registry token: the CI-Common
# packages live in tools/ci-common, outside the workspace every other job installs.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci-common:install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint:canon
